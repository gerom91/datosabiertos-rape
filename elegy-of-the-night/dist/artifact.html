    gfx.applyLighting(room.def.darkness != null ? room.def.darkness : th.darkness, th.tint);
    G.fx.drawNumbers(ctx, cx, cy);
    if (g.transT > 0) gfx.fade = g.transT > 7 ? (14 - g.transT) / 7 : g.transT / 7;
    else gfx.fade = g.fadeIn > 0 ? g.fadeIn / 10 : 0;
  };

  function drawRain(ctx, cx, cy) {

    for (let i = 0; i < 70; i++) {
      const x = ((i * 53 + t * 3 - cx * 0.9) % (G.W + 40) + G.W + 40) % (G.W + 40) - 20;

    const y0 = Math.max(0, Math.floor(cy / 16)), y1 = Math.min(room.th - 1, Math.floor((cy + G.H) / 16));

          ctx.fillRect(tx * 16 - cx, ty * 16 - cy, 16, 16);
        }
  }
})();

    desc: N('A wolf twisted by the eclipse. It charges in straight lines and is slow to turn.', 'Un lobo retorcido por el eclipse. Embiste en línea recta y le cuesta girar.'),
    area: 'entrance', hp: 22, atk: 12, def: 1, exp: 8, w: 26, h: 16, gold: [5, 30],

})();

/* ---- js/roombuilder.js ---- */
/* Elegy of the Night — roombuilder.js
 * Small DSL used by the room data files. It produces the ASCII rows that
 * world.js understands, with doors carved at the standard positions so
 * neighbouring rooms always line up.
 *
 *   G.R({ id:'ent_hall', area:'entrance', x:3, y:19, w:3, h:2 }, (b) => {
 *     b.shell();                 // solid border (2 tiles on floors/ceilings)
 *     b.door('L', 1); b.door('R', 0);
 *     b.fill(10, 20, 15, 21);    // inclusive rectangle of '#'
 *     b.stairs(30, 25, 14, 'r'); // '/' going up-right from (30,25)
 *     b.plat(4, 9, 18);          // one-way platform row 18, cols 4..9
 *     b.enemy(40, 25, 'ghoul');  // feet on the floor tile below row 25
 *     b.candle(12, 22); b.item(60, 25, 'rusted_saber');
 *   });
 *
 * Coordinates are tile columns/rows inside the room (0-based).
 * Standard doors: side doors open rows (cell*14+8 .. cell*14+11) with floor
 * at rows cell*14+12..13; top/bottom doors open columns (cell*24+10 .. +13).
 */
(function () {
  'use strict';
  const root = typeof window !== 'undefined' ? window : globalThis;
  const G = (root.G = root.G || {});
  const CW = G.CELL_W, CH = G.CELL_H;
  const LETTERS = 'abdefghijklmnopqruvwxyzACDEFHJKLMNOPQRSTUVWYZ0123456789!$&*+-:;<>?_|';

  G.R = function (meta, fn) {
    const w = meta.w || 1, h = meta.h || 1;
    const tw = w * CW, th = h * CH;
    const grid = [];
    for (let y = 0; y < th; y++) grid.push(new Array(tw).fill('.'));
    const legend = {};
    const keyToCh = {};
    let li = 0;
    const inb = (x, y) => x >= 0 && y >= 0 && x < tw && y < th;
    const b = {
      tw, th, w, h,
      set(x, y, ch) {
        if (inb(x, y)) grid[y][x] = ch;
        return b;
      },
      get(x, y) {
        return inb(x, y) ? grid[y][x] : '#';
      },
      fill(x0, y0, x1, y1, ch) {
        ch = ch || '#';
        const ax = Math.min(x0, x1), bx = Math.max(x0, x1), ay = Math.min(y0, y1), by = Math.max(y0, y1);
        for (let y = ay; y <= by; y++) for (let x = ax; x <= bx; x++) b.set(x, y, ch);
        return b;
      },
      clear(x0, y0, x1, y1) {
        return b.fill(x0, y0, x1, y1, '.');
      },
      // solid frame: side walls `side` thick, ceiling `top` thick, floor `bottom` thick
      shell(side, top, bottom) {
        side = side == null ? 1 : side;
        top = top == null ? 2 : top;
        bottom = bottom == null ? 2 : bottom;
        if (top) b.fill(0, 0, tw - 1, top - 1);
        if (bottom) b.fill(0, th - bottom, tw - 1, th - 1);
        if (side) {
          b.fill(0, 0, side - 1, th - 1);
          b.fill(tw - side, 0, tw - 1, th - 1);
        }
        return b;
      },
      // floor of a cell row: rows (cell*14+12, +13) across x0..x1
      cellFloor(cell, x0, x1) {
        return b.fill(x0 == null ? 0 : x0, cell * CH + 12, x1 == null ? tw - 1 : x1, cell * CH + 13);
      },
      /* door(side, cell, depth): carve the standard opening, `depth` tiles deep
       * into the room (default 2), and make sure the floor under it is solid. */
      door(side, cell, depth) {
        depth = depth == null ? 2 : depth;
        if (side === 'L' || side === 'R') {
          const r0 = cell * CH + 8;
          for (let d = 0; d < depth; d++) {
            const x = side === 'L' ? d : tw - 1 - d;
            for (let r = r0; r < r0 + 4; r++) b.set(x, r, '.');
            b.set(x, r0 + 4, '#');
            b.set(x, r0 + 5, '#');
            b.set(x, r0 - 1, '#');
          }
        } else {
          const c0 = cell * CW + 10;
          for (let d = 0; d < depth; d++) {
            const y = side === 'T' ? d : th - 1 - d;
            for (let c = c0; c < c0 + 4; c++) b.set(c, y, '.');
            b.set(c0 - 1, y, '#');
            b.set(c0 + 4, y, '#');
          }
        }
        return b;
      },
      // stairs: dir 'r' ('/', climbing to the right) or 'l' ('\\', climbing to the left)
      stairs(x, y, n, dir) {
        for (let i = 0; i < n; i++) {
          if (dir === 'l') b.set(x - i, y - i, '\\');
          else b.set(x + i, y - i, '/');
        }
        return b;
      },
      plat(x0, x1, y, ch) {
        for (let x = Math.min(x0, x1); x <= Math.max(x0, x1); x++) b.set(x, y, ch || '=');
        return b;
      },
      stamp(x, y, rows) {
        rows.forEach((r, j) => {
          for (let i = 0; i < r.length; i++) if (r[i] !== ' ') b.set(x + i, y + j, r[i]);
        });
        return b;
      },
      // generic entity: obj is a legend entry
      spawn(x, y, obj, tileCh) {
        const k = JSON.stringify(obj);
        let ch = keyToCh[k];
        if (!ch) {
          if (obj.t === 'candle' && !obj.drop && !obj.lift && !tileCh) ch = 'c';
          else if (obj.t === 'save' && Object.keys(obj).length === 1) ch = 's';
          else if (obj.t === 'teleport' && Object.keys(obj).length === 1) ch = 't';
          else if (obj.t === 'start') ch = '@';
          else {
            while (li < LETTERS.length && legend[LETTERS[li]]) li++;
            ch = LETTERS[li++];
            legend[ch] = tileCh ? Object.assign({ tile: tileCh }, obj) : obj;
          }
          keyToCh[k] = ch;
        }
        b.set(x, y, ch);
        return b;
      },
      enemy(x, y, id, extra) {
        return b.spawn(x, y, Object.assign({ t: 'enemy', id }, extra || {}));
      },
      boss(x, y, id, extra) {
        return b.spawn(x, y, Object.assign({ t: 'enemy', id }, extra || {}));
      },
      candle(x, y, drop, extra) {
        return b.spawn(x, y, Object.assign({ t: 'candle' }, drop ? { drop } : {}, extra || {}));
      },
      item(x, y, id, extra) {
        return b.spawn(x, y, Object.assign({ t: 'item', id }, extra || {}));
      },
      // item hidden inside a breakable wall tile
      hidden(x, y, id) {
        return b.spawn(x, y, { t: 'item', id, hidden: true }, 'B');
      },
      relic(x, y, id) {
        return b.spawn(x, y, { t: 'relic', id });
      },
      sub(x, y, id) {
        return b.spawn(x, y, { t: 'subweapon', id });
      },
      save(x, y) {
        return b.spawn(x, y, { t: 'save' });
      },
      tp(x, y) {
        return b.spawn(x, y, { t: 'teleport' });
      },
      start(x, y) {
        return b.spawn(x, y, { t: 'start' });
      },
      lore(x, y, id) {
        return b.spawn(x, y, { t: 'lore', id });
      },
      tome(x, y, spell) {
        return b.spawn(x, y, { t: 'tome', spell });
      },
      npc(x, y, id, extra) {
        return b.spawn(x, y, Object.assign({ t: 'npc', id }, extra || {}));
      },
      shop(x, y) {
        return b.spawn(x, y, { t: 'shop' });
      },
      portal(x, y, to, tx, ty, extra) {
        return b.spawn(x, y, Object.assign({ t: 'portal', to, tx, ty }, extra || {}));
      },
      trigger(x, y, scene, tw2, th2, extra) {
        return b.spawn(x, y, Object.assign({ t: 'trigger', scene, tw: tw2 || 1, th: th2 || 3 }, extra || {}));
      },
      pagelock(x, y) {
        return b.spawn(x, y, { t: 'pagelock' });
      },
      mplat(x, y, extra) {
        return b.spawn(x, y, Object.assign({ t: 'mplat' }, extra || {}));
      },
      ascii() {
        return grid.map((r) => r.join(''));
      },
    };
    fn(b);
    meta.rows = grid.map((r) => r.join(''));
    meta.legend = Object.assign({}, meta.legend || {}, legend);
    G.world.room(meta);
    return meta;
  };
})();

  // ---- actors spawned by scenes ----------------------------------------------------------------------
  class Actor extends G.Ent {
    constructor(id, x, y, facing) {
      super({ x: x - 8, y: y - 40, w: 16, h: 40, z: 1 });
      this.actor = id;
      this.facing = facing || -1;
      this.alpha = 0;
      this.fadeTo = 1;
    }
    update(g) {
      this.t++;
      this.alpha = U.approach(this.alpha, this.fadeTo, 0.04);
      if (this.fadeTo === 0 && this.alpha === 0) this.dead = true;
    }
    draw(ctx, camx, camy) {
      const fn = G.NPC_ART[this.actor];
      if (!fn) return;
      ctx.globalAlpha = this.alpha;
      fn(ctx, Math.round(this.cx - camx), Math.round(this.fy - camy), this.t, this.facing);
      ctx.globalAlpha = 1;
    }
  }

  // ---- dialogue engine ---------------------------------------------------------------------------------
  const ST = (G.story = { active: false, steps: [], i: 0, line: null, typed: 0, wait: 0, t: 0, actors: {}, opts: {} });

  ST.play = function (id, opts) {
    const sc = G.SCENES[id];
    if (!sc) return;
    if (ST.active) return;
    ST.active = true;
    ST.id = id;
    ST.steps = typeof sc === 'function' ? sc() : sc;
    ST.i = -1;
    ST.opts = opts || {};
    ST.line = null;
    ST.narr = false;
    ST.actors = {};
    G.state.flags['scene_' + id] = 1;
    const pl = G.game.player;
    if (pl) {
      pl.locked = true;
      pl.atk = null;
      if (pl.form !== 'human') pl.setForm('human', true);
    }
    G.audio.duck(true);
    ST.next();
  };

  ST.end = function () {
    ST.active = false;
    ST.line = null;
    G.audio.stopSpeech();
    G.audio.duck(false);
    const pl = G.game.player;
    if (pl) pl.locked = false;
    I.consumeAll();
    const after = ST.opts.after;
    ST.opts = {};
    if (after) after();
  };

  ST.next = function () {
    ST.i++;
    G.audio.stopSpeech();
    ST.line = null;
    while (ST.i < ST.steps.length) {
      const s = ST.steps[ST.i];
      const g = G.game;
      if (s.who || s.narr) {
        ST.line = s;
        ST.typed = 0;
        ST.t = 0;
        ST.narr = !!s.narr;
        ST.spoken = false;
        const sp = s.narr ? 'narrator' : s.who;
        if (G.settings.voices) {
          ST.speaking = true;
          G.audio.say(s.en, { speaker: sp, onend: () => (ST.speaking = false) });
        } else ST.speaking = false;
        return;
      }
      if (s.wait) {
        ST.wait = s.wait;
        return;
      }
      if (s.do) s.do(g);
      if (s.music) G.audio.playMusic(s.music, { fade: s.fade || 1 });
      if (s.stopMusic) G.audio.stopMusic(s.stopMusic);
      if (s.sfx) G.audio.sfx(s.sfx);
      if (s.shake) gfx.shake(s.shake[0], s.shake[1]);
      if (s.flash) gfx.flash(s.flash, 10);
      if (s.flag) G.state.flags[s.flag] = 1;
      if (s.give) {
        G.invAdd(G.state, s.give, 1);
        G.ui.notify(G.tr(G.ITEMS[s.give].name), '#f0e6c8', G.ITEMS[s.give]);
      }
      if (s.relic) {
        G.state.relics[s.relic] = true;
        G.audio.sfx('relic_get');
        const r = G.RELICS[s.relic];
        G.ui.banner(G.tr(r.name), G.tr(r.desc), r.col, 260);
      }
      if (s.actor) {
        const a = s.actor;
        if (a.remove) {
          const ac = ST.actors[a.id];
          if (ac) ac.fadeTo = 0;
        } else {
          const ac = new Actor(a.id, a.x, a.y, a.facing);
          ST.actors[a.id] = ac;
          g.add(ac);
        }
      }
      if (s.face) G.game.player.facing = s.face;
      ST.i++;
    }
    ST.end();
  };

  ST.update = function () {
    if (!ST.active) return;
    if (G.ui.modal()) return;
    if (ST.wait > 0) {
      ST.wait--;
      if (ST.wait === 0) ST.next();
      return;
    }
    if (!ST.line) return;
    ST.t++;
    const text = G.tr(ST.line);
    if (ST.typed < text.length) {
      ST.typed = Math.min(text.length, ST.typed + (ST.narr ? 0.9 : 1.4));
      if (!G.settings.voices && Math.floor(ST.typed) % 3 === 0) G.audio.sfx('text_blip', { vol: 0.25 });
    }
    if (I.pressed.menu && ST.opts.skippable !== false && G.SCENES_SKIPPABLE) {
      // skip the whole scene
      while (ST.i < ST.steps.length - 1) {
        ST.i++;
        const s = ST.steps[ST.i];
        if (s.do) s.do(G.game);
        if (s.flag) G.state.flags[s.flag] = 1;
        if (s.give) G.invAdd(G.state, s.give, 1);
        if (s.relic) G.state.relics[s.relic] = true;
        if (s.music) G.audio.playMusic(s.music);
      }
      ST.end();
      return;
    }
    if (I.pressed.confirm || I.pressed.attack) {
      if (ST.typed < text.length) ST.typed = text.length;
      else {
        G.audio.sfx('menu_move', { vol: 0.4 });
        ST.next();
      }
    }
    // auto-advance narration after the voice finishes
    if (ST.narr && ST.typed >= text.length && !ST.speaking && ST.t > 60 + text.length * 2 && ST.line.auto) ST.next();
  };

  ST.draw = function () {
    if (!ST.active || !ST.line) return;
    const W = G.W, H = G.H, m = gfx.mctx;
    const text = G.tr(ST.line).slice(0, Math.floor(ST.typed));
    if (ST.narr) {
      m.fillStyle = 'rgba(0,0,0,' + (ST.line.dark ? 0.92 : 0.55) + ')';
      m.fillRect(0, 0, W, H);
      const lines = gfx.wrap(text, 300, 9, 'body');
      lines.forEach((l, i) => gfx.text(l, W / 2, H / 2 - (lines.length * 13) / 2 + 10 + i * 13, { size: 9, align: 'center', color: '#efe4cc', italic: true }));

/* ---- js/ui.js ---- */
/* Elegy of the Night — ui.js
 * HUD, notifications, banners and every in-game panel: pause menu (status,
 * equipment, items, relics, spells, map, bestiary, system), shop, save slots,
 * teleporter list, lore reader, game over. Drawn on the high-res UI layer
 * in virtual 384x224 coordinates.
 */
(function () {
  'use strict';
  const root = typeof window !== 'undefined' ? window : globalThis;
  const G = (root.G = root.G || {});
  const U = G.util, I = G.input, gfx = G.gfx;

  const UI = (G.ui = { stack: [], notes: [], banners: [], area: null, lvlT: 0, t: 0 });
  const W = G.W, H = G.H;
  const COL = { text: '#ece6d6', dim: '#9a94a8', gold: '#e8c872', sel: '#ffffff', red: '#ff7080', green: '#80ff9a', blue: '#8ab0ff', hp: '#d8303c', mp: '#3c66e0' };

  UI.arrowFor = function (d) {
    return { f: '→', b: '←', u: '↑', d: '↓', uf: '↗', ub: '↖', df: '↘', db: '↙' }[d] || d;
  };
  function T(o) {
    return G.tr(o);
  }
  function txt(s, x, y, o) {
    gfx.text(s, x, y, o);
  }
  function icon(it, x, y, sz) {
    if (!it) return;
    const m = gfx.mctx;
    m.imageSmoothingEnabled = false;
    m.drawImage(G.itemIcon(it), x, y, sz || 12, sz || 12);
  }
  function bar(x, y, w, h, frac, c1, c2, bg) {
    const m = gfx.mctx;
    m.fillStyle = bg || 'rgba(0,0,0,0.65)';
    m.fillRect(x, y, w, h);
    const fw = Math.max(0, Math.min(1, frac)) * w;
    const gr = m.createLinearGradient(0, y, 0, y + h);
    gr.addColorStop(0, c2 || U.shade(c1, 0.35));
    gr.addColorStop(1, c1);
    m.fillStyle = gr;
    m.fillRect(x, y, fw, h);
    m.strokeStyle = 'rgba(220,210,180,0.6)';
    m.lineWidth = 0.4;
    m.strokeRect(x, y, w, h);
  }
  function selBar(x, y, w, h) {
    const m = gfx.mctx;
    const a = 0.35 + Math.sin(UI.t * 0.12) * 0.12;
    const gr = m.createLinearGradient(x, 0, x + w, 0);
    gr.addColorStop(0, 'rgba(120,150,255,' + a + ')');
    gr.addColorStop(1, 'rgba(120,150,255,0)');
    m.fillStyle = gr;
    m.fillRect(x, y, w, h);
    m.fillStyle = COL.gold;
    m.beginPath();
    m.moveTo(x - 4, y + h / 2 - 2.5);
    m.lineTo(x - 0.5, y + h / 2);
    m.lineTo(x - 4, y + h / 2 + 2.5);
    m.fill();
  }

  UI.push = (p) => {
    UI.stack.push(p);
    if (p.onOpen) p.onOpen();
    return p;
  };
  UI.pop = () => {
    const p = UI.stack.pop();
    if (p && p.onClose) p.onClose();
    if (!UI.stack.length) G.audio.duck(false);
    return p;
  };
  UI.top = () => UI.stack[UI.stack.length - 1];
  UI.modal = () => UI.stack.length > 0;
  UI.closeAll = () => {
    while (UI.stack.length) UI.pop();
  };

  // ---- notifications & banners ----------------------------------------------------------------
  UI.notify = function (text, col, it) {
    UI.notes.push({ text, col: col || COL.text, it, t: 0 });
    if (UI.notes.length > 4) UI.notes.shift();
  };
  UI.banner = function (title, desc, col, dur) {
    UI.push(new Banner(title, desc, col, dur));
  };
  UI.areaBanner = function (name) {

  function drawMinimap(x, y, w, h) {
    const g = G.game, room = g.room, s = G.state;
    const m = gfx.mctx;
    const cw = 6, ch = 4;
    const pc = room.cellOf(U.clamp(g.player.cx, 0, room.pw - 1), U.clamp(g.player.cy, 0, room.ph - 1));
    const cols = Math.floor(w / cw), rows = Math.floor(h / ch);
    m.fillStyle = 'rgba(0,0,0,0.55)';
    m.fillRect(x, y, w, h);
    m.strokeStyle = 'rgba(200,180,120,0.6)';
    m.lineWidth = 0.4;
    m.strokeRect(x, y, w, h);
    const ox = pc.cx - Math.floor(cols / 2), oy = pc.cy - Math.floor(rows / 2);
    const vis = s.visited[room.map] || {};
    for (let j = 0; j < rows; j++)
      for (let i = 0; i < cols; i++) {
        const cx = ox + i, cy = oy + j;
        if (!vis[cx + ',' + cy]) continue;
        const rid = G.world.roomAtCell(room.map, cx, cy);
        if (!rid) continue;
        drawCell(m, room.map, rid, cx, cy, x + i * cw, y + j * ch, cw, ch);
      }
    if (UI.t % 30 < 20) {
      m.fillStyle = '#ffffff';
      m.fillRect(x + (pc.cx - ox) * cw + 2, y + (pc.cy - oy) * ch + 1, 2, 2);
    }
  }

  // one map cell (used by the minimap and the map screen)
  function drawCell(m, mapId, rid, cx, cy, x, y, cw, ch) {
    const def = G.world.rooms[rid];
    const f = def._feat || {};
    let fill = '#2346b4';
    if (f.save) fill = '#c0283c';
    else if (f.teleport) fill = '#c8a028';
    else if (f.portal) fill = '#8a40c0';
    else if (def.map === 'archives') fill = '#5a2a8a';
    m.fillStyle = fill;
    m.fillRect(x, y, cw, ch);
    m.fillStyle = 'rgba(255,255,255,0.12)';
    m.fillRect(x, y, cw, 0.6);
    // walls
    const lx = cx - def.x, ly = cy - def.y;
    const wall = '#f0f0ff';
    const lw = Math.max(0.5, cw / 9);
    const door = (side, cell) => (def._doors || []).some((d) => d.side === side && d.cell === cell && d.to);
    m.fillStyle = wall;
    if (lx === 0 && !door('L', ly)) m.fillRect(x, y, lw, ch);
    if (lx === def.w - 1 && !door('R', ly)) m.fillRect(x + cw - lw, y, lw, ch);
    if (ly === 0 && !door('T', lx)) m.fillRect(x, y, cw, lw);
    if (ly === def.h - 1 && !door('B', lx)) m.fillRect(x, y + ch - lw, cw, lw);
    // door ticks
    if (lx === 0 && door('L', ly)) m.fillRect(x, y, lw, ch * 0.35);
    if (lx === def.w - 1 && door('R', ly)) m.fillRect(x + cw - lw, y, lw, ch * 0.35);
  }
  UI.drawCell = drawCell;

  const TABS = ['status', 'equip', 'items', 'relics', 'spells', 'map', 'bestiary', 'system'];
  class PauseMenu extends Panel {
    constructor(tab) {
      super();
      this.tab = Math.max(0, TABS.indexOf(tab || 'status'));
      this.cur = {};
      this.sub = null; // equip item chooser etc.
      this.mapId = G.game.room.map;
      this.mapOff = null;
      this.confirm = null;
    }
    onOpen() {
      G.audio.sfx('menu_open');
      G.audio.duck(true);
    }
    get name() {
      return TABS[this.tab];
    }
    cursor(key, n, wrapV) {
      let c = this.cur[key] || 0;
      if (I.repeat('down')) {
        c = c + 1 >= n ? (wrapV === false ? n - 1 : 0) : c + 1;
        G.audio.sfx('menu_move');
      }
      if (I.repeat('up')) {
        c = c - 1 < 0 ? (wrapV === false ? 0 : n - 1) : c - 1;
        G.audio.sfx('menu_move');
      }
      c = U.clamp(c, 0, Math.max(0, n - 1));
      this.cur[key] = c;
      return c;
    }
    update() {
      if (this.confirm) return this.confirm.update();
      if (!this.sub) {
        if (I.pressed.tabR || (I.pressed.right && !['map', 'system', 'equip'].includes(this.name) && false)) {
          this.tab = (this.tab + 1) % TABS.length;
          G.audio.sfx('menu_move');
          return;
        }
        if (I.pressed.tabL) {
          this.tab = (this.tab + TABS.length - 1) % TABS.length;
          G.audio.sfx('menu_move');
          return;
        }
        if (I.pressed.cancel || I.pressed.menu || (this.name === 'map' && I.pressed.map)) {
          G.audio.sfx('menu_cancel');
          UI.pop();
          G.game.player.refreshStats();
          return;
        }

      const fn = this['u_' + this.name];
      if (fn) fn.call(this);

      const m = gfx.mctx;
      m.fillStyle = 'rgba(2,2,10,0.72)';

    // -- equipment --
    u_equip() {
      const s = G.state;
      if (!this.sub) {
        const c = this.cursor('eq', G.SLOTS.length);
        if (I.pressed.confirm) {
          G.audio.sfx('menu_select');
          this.sub = { slot: G.SLOTS[c], cur: 0 };
        }
        return;
      }
      const list = this.equipList(this.sub.slot);
      const n = list.length;
      if (I.repeat('down')) {
        this.sub.cur = (this.sub.cur + 1) % n;
        G.audio.sfx('menu_move');
      }
      if (I.repeat('up')) {
        this.sub.cur = (this.sub.cur + n - 1) % n;
        G.audio.sfx('menu_move');
      }
      if (I.pressed.cancel) {
        G.audio.sfx('menu_cancel');
        this.sub = null;
        return;
      }
      if (I.pressed.confirm) {
        const id = list[this.sub.cur];
        if (id === s.equip[this.sub.slot]) {
          this.sub = null;
          return;
        }
        G.equipItem(s, this.sub.slot, id === '__none' ? null : id);
        G.audio.sfx('menu_select');
        G.game.player.refreshStats();
        this.sub = null;
      }
    }
    equipList(slot) {
      const s = G.state;
      const ids = Object.keys(s.inv).filter((id) => {
        const it = G.ITEMS[id];
        return it && G.slotAccepts(slot, it);
      });
      ids.sort((a, b) => (G.ITEMS[b].atk || G.ITEMS[b].def || 0) - (G.ITEMS[a].atk || G.ITEMS[a].def || 0));
      return ['__none'].concat(ids);
    }

      const s = G.state, pl = G.game.player;
      gfx.panel(8, 24, 176, 120);

      });

      let pv = null, focusIt = null;
      if (this.sub) {
        const list = this.equipList(this.sub.slot);
        const id = list[this.sub.cur];
        focusIt = id !== '__none' ? G.ITEMS[id] : null;
        const tmp = JSON.parse(JSON.stringify({ base: s.base, equip: s.equip, inv: s.inv, status: s.status }));
        G.equipItem(tmp, this.sub.slot, id === '__none' ? null : id);
        pv = G.calcStats(tmp);
        // item list

        list.slice(start, start + 8).forEach((lid, k) => {
          const i = start + k;
          const y = 38 + k * 13;

        });

      if (pv) {
        const rows = [['atkR', G.t('atk') + ' R'], ['atkL', G.t('atk') + ' L'], ['def', G.t('def')], ['str', G.t('str')], ['con', G.t('con')], ['int', G.t('int')], ['lck', G.t('lck')]];
        // compact diff line
        const parts = rows.map(([k, lab]) => [lab, pv[k] - st[k], pv[k]]).filter((r) => r[1]);
        parts.forEach((r, i) => txt(r[0] + ' ' + r[2] + (r[1] > 0 ? ' ▲' + r[1] : ' ▼' + -r[1]), 16 + (i % 4) * 90, 160 + Math.floor(i / 4) * 10, { size: 6.5, color: r[1] > 0 ? COL.green : COL.red }));

      if (focusIt) {

        G.audio.sfx('menu_move');

            st.dmgNumbers = !st.dmgNumbers;

  // ---- map drawing ---------------------------------------------------------------------------------
  UI.drawMap = function (mapId, x, y, w, h, off) {
    const s = G.state, m = gfx.mctx;
    const map = G.world.maps[mapId];
    gfx.panel(x, y, w, h, { top: 'rgba(4,6,24,0.96)', bottom: 'rgba(2,2,12,0.96)' });
    txt(T(map.name), x + 10, y + 13, { size: 8, font: 'title', color: mapId === 'archives' ? '#d8b0ff' : COL.gold });
    txt(G.mapCompletion(s, mapId).toFixed(1) + '% ' + G.t('explored'), x + w - 10, y + 13, { size: 7, align: 'right', color: COL.text });
    txt('[Z] ' + (mapId === 'castle' ? G.t('map_archives') : G.t('map_castle')) + '   ↑↓←→', x + w - 10, y + h - 6, { size: 5.5, align: 'right', color: COL.dim });
    if (!map.total) return;
    const cols = map.maxX - map.minX + 1, rows = map.maxY - map.minY + 1;
    const cw = Math.max(4, Math.min(9, Math.floor((w - 20) / cols))), ch = Math.max(3, Math.round(cw * 0.62));
    const mw = cols * cw, mh = rows * ch;
    let ox = x + (w - mw) / 2 + off.x, oy = y + 18 + (h - 30 - mh) / 2 + off.y;
    m.save();
    m.beginPath();
    m.rect(x + 3, y + 17, w - 6, h - 26);
    m.clip();
    const vis = s.visited[mapId] || {};
    for (const key in vis) {
      const [cx, cy] = key.split(',').map(Number);
      const rid = G.world.roomAtCell(mapId, cx, cy);
      if (!rid) continue;
      drawCell(m, mapId, rid, cx, cy, ox + (cx - map.minX) * cw, oy + (cy - map.minY) * ch, cw, ch);
    }
    // current position
    const g = G.game;
    if (g.room && g.room.map === mapId && UI.t % 40 < 26) {
      const pc = g.room.cellOf(U.clamp(g.player.cx, 0, g.room.pw - 1), U.clamp(g.player.cy, 0, g.room.ph - 1));
      m.fillStyle = '#ffffff';
      m.fillRect(ox + (pc.cx - map.minX) * cw + cw / 2 - 1.5, oy + (pc.cy - map.minY) * ch + ch / 2 - 1.5, 3, 3);
    }
    m.restore();
    // legend
    const lg = [['#c0283c', G.t('legend_save')], ['#c8a028', G.t('legend_warp')], ['#8a40c0', G.t('map_archives')]];
    lg.forEach((l, i) => {
      m.fillStyle = l[0];
      m.fillRect(x + 10 + i * 70, y + h - 11, 6, 4);
      txt(l[1], x + 19 + i * 70, y + h - 6.5, { size: 5.5, color: COL.dim });
    });
  };

  class Confirm extends Panel {

  // ---- save slots ----------------------------------------------------------------------------------------
  class SavePanel extends Panel {
    constructor(at, mode) {
      super();
      this.at = at;
      this.mode = mode || 'save'; // 'save' | 'load'
      this.c = Math.max(0, (G.save.lastSlot || 1) - 1);
      this.msg = null;
      this.msgT = 0;
      this.busy = false;
      this.metas = [null, null, null];
      this.refresh();
    }
    refresh() {
      G.save.listMeta().then((m) => (this.metas = m));
    }
    onOpen() {
      G.audio.duck(true);
    }
    update() {
      if (this.confirm) return this.confirm.update();
      if (this.msgT > 0) {
        this.msgT--;
        if (this.msgT === 0 && this.closeAfter) UI.pop();
        return;
      }
      if (this.busy) return;
      if (I.repeat('down')) {
        this.c = (this.c + 1) % 3;
        G.audio.sfx('menu_move');
      }
      if (I.repeat('up')) {
        this.c = (this.c + 2) % 3;
        G.audio.sfx('menu_move');
      }
      if (I.pressed.cancel) {
        G.audio.sfx('menu_cancel');
        UI.pop();
        return;
      }
      if (I.pressed.confirm) {
        const slot = this.c + 1;
        const doSave = () => {
          this.busy = true;
          const s = G.state;
          s.room = this.at.room;
          s.px = this.at.x;
          s.py = this.at.y;
          s.saveRoom = this.at.room;
          s.saves = (s.saves || 0) + 1;
          G.save.write(slot, s).then((ok) => {
            this.busy = false;
            this.msg = ok ? G.t('saved') : G.t('save_fail');
            this.msgT = 70;
            this.closeAfter = ok;
            G.audio.sfx(ok ? 'menu_select' : 'menu_error');
            this.refresh();
          });
        };
        if (this.metas[this.c]) {
          this.confirm = new Confirm(G.t('overwrite'), (yes) => {
            this.confirm = null;
            if (yes) doSave();
          });
        } else doSave();
      }
    }
    draw() {
      const m = gfx.mctx;
      m.fillStyle = 'rgba(40,0,10,0.45)';
      m.fillRect(0, 0, W, H);
      txt(G.t('save_here'), W / 2, 34, { size: 11, font: 'title', align: 'center', gradient: ['#ffe0e0', '#c04050'] });
      for (let i = 0; i < 3; i++) {

  class Shop extends Panel {
    constructor() {
      super();
      this.mode = 'root';
      this.c = 0;
      this.qty = 1;
      this.say = G.tr({ en: 'Welcome, Master Alucard. Browse at your leisure.', es: 'Bienvenido, maese Alucard. Mire con calma.' });
      this.cur = {};
    }
    onOpen() {
      G.audio.duck(true);
      G.audio.playMusic('shop', { fade: 0.6 });
    }
    onClose() {
      const r = G.game.room;
      G.audio.playMusic(r.def.music || r.area.music, { fade: 0.8 });
    }
    stock() {
      return G.SHOP.filter((e) => !e.flag || G.state.flags[e.flag]).map((e) => e.id).filter((id) => G.ITEMS[id]);
    }
    sellable() {
      return Object.keys(G.state.inv).filter((id) => G.ITEMS[id] && G.ITEMS[id].kind !== 'key' && (G.ITEMS[id].price || 0) > 0);
    }
    update() {
      const s = G.state;
      if (this.mode === 'root') {
        const opts = 5;
        if (I.repeat('down')) {
          this.c = (this.c + 1) % opts;
          G.audio.sfx('menu_move');
        }
        if (I.repeat('up')) {
          this.c = (this.c + opts - 1) % opts;
          G.audio.sfx('menu_move');
        }
        if (I.pressed.cancel) {
          G.audio.sfx('menu_cancel');
          UI.pop();
          return;
        }
        if (I.pressed.confirm) {
          G.audio.sfx('menu_select');
          if (this.c === 0) {
            this.mode = 'buy';
            this.cur.list = 0;
          } else if (this.c === 1) {
            this.mode = 'sell';
            this.cur.list = 0;
          } else if (this.c === 2) {
            this.mode = 'bestiary';
            this.cur.bs = 0;
          } else if (this.c === 3) {
            const hints = G.LIBRARIAN_HINTS || [];
            const h = hints.find((x) => (!x.need || s.flags[x.need]) && (!x.until || !s.flags[x.until])) || hints[0];
            if (h) {
              this.say = T(h.text);
              G.audio.say(h.text.en, { speaker: 'librarian' });
            }
          } else UI.pop();
        }
        return;
      }
      if (this.mode === 'bestiary') {
        const l = Object.keys(G.ENEMIES).filter((id) => s.bestiary[id]);
        if (l.length) {
          if (I.repeat('down')) this.cur.bs = (this.cur.bs + 1) % l.length;
          if (I.repeat('up')) this.cur.bs = (this.cur.bs + l.length - 1) % l.length;
        }
        if (I.pressed.cancel) this.mode = 'root';
        return;
      }
      const list = this.mode === 'buy' ? this.stock() : this.sellable();
      if (!list.length) {
        if (I.pressed.cancel) this.mode = 'root';
        return;
      }
      const n = list.length;
      if (this.mode === 'qty') return;
      if (I.repeat('down')) {
        this.cur.list = (this.cur.list + 1) % n;
        this.qty = 1;
        G.audio.sfx('menu_move');
      }
      if (I.repeat('up')) {
        this.cur.list = (this.cur.list + n - 1) % n;
        this.qty = 1;
        G.audio.sfx('menu_move');
      }
      const id = list[this.cur.list];
      const it = G.ITEMS[id];
      const consumable = it.kind === 'use';
      if (consumable) {
        if (I.repeat('right')) this.qty = Math.min(99, this.qty + 1);
        if (I.repeat('left')) this.qty = Math.max(1, this.qty - 1);
      } else this.qty = 1;
      if (I.pressed.cancel) {
        this.mode = 'root';
        G.audio.sfx('menu_cancel');
        return;
      }
      if (I.pressed.confirm) {
        if (this.mode === 'buy') {
          const cost = it.price * this.qty;
          if (s.gold < cost) {
            G.audio.sfx('menu_error');
            this.say = G.t('not_enough_gold');
            return;
          }
          s.gold -= cost;
          G.invAdd(s, id, this.qty);
          G.audio.sfx('gold');
          this.say = G.t('thank_you');
        } else {
          const val = Math.floor((it.price || 0) / 2) * this.qty;
          if (G.invCount(s, id) < this.qty) return;
          G.invRemove(s, id, this.qty);
          s.gold += val;
          G.audio.sfx('gold');
          this.qty = 1;
          if (this.cur.list >= this.sellable().length) this.cur.list = Math.max(0, this.sellable().length - 1);
        }
      }
    }
    draw() {
      const s = G.state, m = gfx.mctx;
      m.fillStyle = 'rgba(4,2,0,0.7)';
      m.fillRect(0, 0, W, H);
      // header with portrait
      gfx.panel(8, 8, 368, 46, { top: 'rgba(40,24,10,0.95)', bottom: 'rgba(16,10,4,0.95)', border: '#e0c080' });
      const por = G.portrait && G.portrait('librarian');
      if (por) {
        m.imageSmoothingEnabled = false;
        m.drawImage(por, 12, 10, 36, 42);
      }
      txt(G.t('shop_title'), 54, 22, { size: 9, font: 'title', color: COL.gold });
      gfx.wrap(this.say, 230, 7).slice(0, 2).forEach((l, i) => txt(l, 54, 34 + i * 9, { size: 7, italic: true, color: COL.text }));
      txt(G.t('gold') + '  ' + s.gold, 368, 22, { size: 8, align: 'right', color: '#ffe070' });
      if (this.mode === 'root') {
        gfx.panel(8, 60, 120, 82);
        [G.t('buy'), G.t('sell'), G.t('enemy_list'), G.t('talk'), G.t('leave')].forEach((o, i) => {
          const y = 76 + i * 14;
          if (i === this.c) selBar(14, y - 9.5, 108, 13);
          txt(o, 22, y, { size: 8, font: 'title', color: i === this.c ? '#fff' : COL.text });
        });
        return;
      }
      if (this.mode === 'bestiary') {
        const l = Object.keys(G.ENEMIES).filter((id) => s.bestiary[id]);
        m.save();
        m.translate(0, 34);
        m.scale(1, 0.85);
        UI.drawBestiary(l, this.cur.bs || 0);
        m.restore();
        return;
      }
      const list = this.mode === 'buy' ? this.stock() : this.sellable();
      gfx.panel(8, 60, 368, 120);
      gfx.panel(8, 184, 368, 32);
      if (!list.length) {
        txt('—', W / 2, 120, { size: 8, align: 'center', color: COL.dim });
        return;
      }
      const c = this.cur.list || 0;
      const per = 8, start = Math.max(0, Math.min(c - 3, list.length - per));
      list.slice(start, start + per).forEach((id, k) => {

        txt(String(price), 360, y, { size: 7.5, align: 'right', color: s.gold >= price || this.mode === 'sell' ? '#ffe070' : COL.red });
      });
      const it = G.ITEMS[list[c]];

/* ---- js/save.js ---- */
/* Elegy of the Night — save.js
 * Three save files. Backends, in order of preference:
 *   cloud  — the claude.ai artifact store (db capability, private per player)
 *   local  — this browser's localStorage
 *   none   — storage blocked: progress lives in memory, export/import a .json
 * Every write is mirrored to localStorage when it is available.
 * Settings (volumes, language…) are a per-browser convenience in localStorage.
 */
(function () {
  'use strict';
  const root = typeof window !== 'undefined' ? window : globalThis;
  const G = (root.G = root.G || {});

  const KEY = 'elegy_night_slot';
  const SKEY = 'elegy_night_settings';
  const mem = {};

  const S = (G.save = { backend: 'none', db: null, uid: null, lastSlot: 1, ready: false });

  function localOK() {
    try {
      const k = '__elegy_test';
      root.localStorage.setItem(k, '1');
      root.localStorage.removeItem(k);
      return true;
    } catch (e) {
      return false;
    }
  }

  S.init = function () {
    S.backend = localOK() ? 'local' : 'none';
    const claude = root.claude;
    if (!claude || typeof claude.use !== 'function') {
      S.ready = true;
      return Promise.resolve(S.backend);
    }
    const timeout = new Promise((res) => setTimeout(() => res(null), 6000));
    return Promise.race([Promise.all([claude.use('db'), claude.use('user')]), timeout])
      .then(async (r) => {
        if (!r) return S.backend;
        const [db, user] = r;
        if (!db || !user) return S.backend;
        const uid = await user.id();
        if (!uid) return S.backend;
        S.db = db;
        S.uid = uid;
        S.backend = 'cloud';
        return S.backend;
      })
      .catch(() => S.backend)
      .then((b) => {
        S.ready = true;
        G.emit('saveBackend', b);
        return b;
      });
  };

  function docRef(slot) {
    return S.db.collection('data/users/' + S.uid).doc('slot' + slot);
  }

  S.meta = function (st) {
    const room = G.world.rooms[st.room];
    const area = room && G.world.areas[room.area];
    let hpMax = st.base.hp;
    try {
      hpMax = G.calcStats(st).hpMax;
    } catch (e) {}
    const d = new Date();
    return {
      level: st.level,
      areaName: area ? area.name : { en: '?', es: '?' },
      time: st.time,
      pct: G.mapCompletion(st, 'castle') + G.mapCompletion(st, 'archives'),
      hp: st.hp,
      hpMax,
      gold: st.gold,
      date: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'),
      savedAt: Date.now(),
    };
  };

  S.write = async function (slot, st) {
    const data = JSON.parse(JSON.stringify(st));
    const rec = { v: 1, meta: S.meta(st), data };
    S.lastSlot = slot;
    G.store.set('elegy_night_last', slot);
    let ok = false;
    if (S.backend === 'cloud' && S.db) {
      try {
        await docRef(slot).set(rec);
        ok = true;
      } catch (e) {
        if (e && (e.code === 'invalid_argument' || e.code === 'not_granted' || e.code === 'revoked')) {
          // this viewer cannot write: fall back to the browser
          S.backend = localOK() ? 'local' : 'none';
        }
      }
    }
    if (G.store.set(KEY + slot, rec)) ok = true;
    mem[slot] = rec;
    return ok || S.backend === 'none';
  };

  S.readRec = async function (slot) {
    let cloud = null, local = null;
    if (S.backend === 'cloud' && S.db) {
      try {
        const snap = await docRef(slot).get();
        if (snap.exists) cloud = snap.data();
      } catch (e) {}
    }
    local = G.store.get(KEY + slot) || mem[slot] || null;
    if (cloud && local) return (cloud.meta && cloud.meta.savedAt) >= (local.meta && local.meta.savedAt) ? cloud : local;
    return cloud || local;
  };

  S.read = async function (slot) {
    const rec = await S.readRec(slot);
    if (!rec || !rec.data) return null;
    S.lastSlot = slot;
    return S.migrate(JSON.parse(JSON.stringify(rec.data)));
  };

  S.listMeta = async function () {
    const out = [];
    for (let i = 1; i <= 3; i++) {
      const r = await S.readRec(i);
      out.push(r ? r.meta : null);
    }
    return out;
  };

  S.remove = async function (slot) {
    if (S.backend === 'cloud' && S.db) {
      try {
        await docRef(slot).delete();
      } catch (e) {}
    }
    G.store.del(KEY + slot);
    delete mem[slot];
  };

  // fill fields that older saves may lack
  S.migrate = function (st) {
    const fresh = G.newState();
    for (const k in fresh) if (st[k] === undefined) st[k] = fresh[k];
    for (const k in fresh.base) if (st.base[k] === undefined) st.base[k] = fresh.base[k];
    for (const k in fresh.equip) if (st.equip[k] === undefined) st.equip[k] = null;
    st.visited = st.visited || { castle: {}, archives: {} };
    st.visited.castle = st.visited.castle || {};
    st.visited.archives = st.visited.archives || {};
    st.status = st.status || { poison: 0, curse: 0 };
    return st;
  };

  S.valid = function (st) {
    return st && typeof st === 'object' && st.base && st.equip && typeof st.level === 'number' && st.inv;
  };

  // ---- export / import -----------------------------------------------------------------------
  S.exportCurrent = async function () {
    const st = G.state;
    if (!st) return;
    const rec = { v: 1, game: 'elegy-of-the-night', meta: S.meta(st), data: st };
    const json = JSON.stringify(rec);
    const name = 'elegy-of-the-night-save-L' + st.level + '.json';
    let done = false;
    try {
      const dl = root.claude && root.claude.use ? await root.claude.use('downloads') : null;
      if (dl) {
        await dl.save({ filename: name, data: json });
        done = true;
      }
    } catch (e) {
      if (e && e.code === 'declined') return;
    }
    if (!done) {
      try {
        const blob = new Blob([json], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          URL.revokeObjectURL(a.href);
          a.remove();
        }, 1000);
        done = true;
      } catch (e) {}
    }
    if (done) G.ui.notify(G.t('export_save') + ' ✓', '#a0ffb0');
  };

  // Opens a file picker; cb(state|null)
  S.importFile = function (cb, slot) {
    if (typeof document === 'undefined') return cb(null);
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.json,application/json';
    inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.addEventListener('change', () => {
      const f = inp.files && inp.files[0];
      inp.remove();
      if (!f) return cb(null);
      const r = new FileReader();
      r.onload = async () => {
        try {
          const obj = JSON.parse(r.result);
          const st = obj && obj.data ? obj.data : obj;
          if (!S.valid(st)) throw new Error('bad');
          const clean = S.migrate(st);
          await S.write(slot || 3, clean);
          G.ui.notify(G.t('import_save') + ' ✓ (' + G.t('slot') + ' ' + (slot || 3) + ')', '#a0ffb0');
          cb(clean);
        } catch (e) {
          G.ui.notify(G.tr({ en: 'That file is not an Elegy save.', es: 'Ese archivo no es una partida de Elegía.' }), '#ff8080');

      const ms = Math.max(1200, String(text || '').length * 55);

    listSfx: () => [],
  };
})();

      [G.tr({ en: 'Inspired by Castlevania: Symphony of the Night (Konami, 1997)', es: 'Inspirado en Castlevania: Symphony of the Night (Konami, 1997)' }), 7, '#a8a0b8'],
      [G.tr({ en: 'Unofficial fan project — not affiliated with Konami', es: 'Proyecto fan no oficial — sin afiliación con Konami' }), 7, '#a8a0b8'],
      ['', 30],
      [G.t('the_end'), 16, '#e8c872'],
    ];
    let y = H + 20 - EN.t * 0.35;
    for (const [l, sz, c] of roll) {
      if (l) gfx.text(l, W / 2, Math.max(y, l === G.t('the_end') ? H / 2 + 6 : -50), { size: sz, font: sz >= 9 ? 'title' : 'body', align: 'center', color: c, weight: sz >= 12 ? 700 : 500 });
      y += (sz || 8) + 8;
    }
  };
})();


/* ---- js/main.js ---- */
/* Elegy of the Night — main.js
 * Boot, fixed-timestep main loop, scene routing, new game / continue,
 * touch controls, focus handling and live-update (hot) snapshots.
 */
(function () {
  'use strict';
  const G = window.G;
  const I = G.input, gfx = G.gfx;

  G.scene = 'boot';
  G.isTouch = 'ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0;

  // ---- game flow -----------------------------------------------------------------------------------
  G.newGame = function () {
    const s = G.newState();
    // Alucard arrives fully equipped... for now.
    s.equip = { rhand: 'dhampir_blade', lhand: 'crimson_shield', head: null, body: 'twilight_mail', cloak: 'nightfall_cloak', acc1: 'blood_signet', acc2: null };
    s.inv = { potion: 2 };
    s.sub = null;
    s.hearts = 20;
    G.ui.closeAll();
    G.game.start(s);
    G.game.player.refreshStats();
    s.hp = G.game.player.st.hpMax;
    s.mp = G.game.player.st.mpMax;
    G.story.play('prologue', { after: () => G.story.play('arrival') });
  };

  G.continueGame = function (st) {
    G.ui.closeAll();
    G.game.start(st);
    G.game.player.refreshStats();
  };

  G.loadLast = function () {
    G.save.read(G.save.lastSlot || 1).then((st) => {
      if (st) G.continueGame(st);
      else G.toTitle();
    });
  };

  G.toTitle = function () {
    G.audio.stopSpeech();
    G.story.active = false;
    G.game.running = false;
    G.title.open();
  };

  G.toggleFullscreen = function () {
    try {
      const el = document.documentElement;
      if (!document.fullscreenElement) el.requestFullscreen && el.requestFullscreen().catch(() => {});
      else document.exitFullscreen && document.exitFullscreen();
    } catch (e) {}
  };

  // ---- loop ------------------------------------------------------------------------------------------
  let last = 0, acc = 0, paused = false;
  const STEP = 1000 / 60;

  function step() {
    I.update();
    switch (G.scene) {
      case 'title':
        G.title.update();
        break;
      case 'game':
        if (paused) break;
        if (G.ui.modal()) G.ui.update();
        else if (G.story.active) {
          G.story.update();
          G.game.update();
        } else {
          if (I.pressed.menu && !G.game.player.dead) {
            G.ui.openPause('status');
            I.consumeAll();
          } else if (I.pressed.map && !G.game.player.dead) {
            G.ui.openPause('map');
            I.consumeAll();
          } else G.game.update();
        }
        G.ui.tick();
        break;
      case 'ending':
        G.endingScene.update();
        break;
    }
  }

  function render() {
    switch (G.scene) {
      case 'title':
        G.title.draw();
        break;
      case 'game':
        gfx.beginFrame();
        G.game.draw();
        gfx.present();
        gfx.ui();
        G.ui.drawHUD();
        G.story.draw();
        G.ui.drawPanels();
        if (paused) drawPaused();
        break;
      case 'ending':
        G.endingScene.draw();
        break;
      default:
        gfx.beginFrame();
        gfx.present();
    }
  }

  function drawPaused() {
    const m = gfx.mctx;
    m.fillStyle = 'rgba(0,0,0,0.55)';
    m.fillRect(0, 0, G.W, G.H);
    gfx.text(G.t('paused'), G.W / 2, G.H / 2 - 4, { size: 14, font: 'title', align: 'center', color: '#e8c872' });
    gfx.text(G.t('click_resume'), G.W / 2, G.H / 2 + 12, { size: 7, align: 'center', color: '#d0c8e0' });
  }

  function frame(ts) {
    requestAnimationFrame(frame);
    if (!last) last = ts;
    let dt = ts - last;
    last = ts;
    if (dt > 250) dt = STEP; // tab was hidden
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 4) {
      step();
      acc -= STEP;
      n++;
    }
    if (n >= 4) acc = 0;
    render();
  }

  // ---- touch controls ---------------------------------------------------------------------------------
  function setupTouch() {
    const el = document.getElementById('touch');
    if (!el) return;
    I.bindTouch(el);
    const apply = () => {
      const st = G.settings.touch;
      const show = st === true || (st === 'auto' && G.isTouch);
      el.hidden = !show;
      document.body.classList.toggle('touch-on', show);
    };
    G.on('settings', apply);
    window.addEventListener('touchstart', () => {
      if (!G.isTouch) {
        G.isTouch = true;
        apply();
      }
    }, { passive: true });
    apply();
  }

  // ---- boot ---------------------------------------------------------------------------------------------
  function boot(hotData) {
    G.save.loadSettings();
    G.world.build();
    const canvas = document.getElementById('game');
    gfx.init(canvas);
    G.applySettings();
    setupTouch();
    const unlock = () => G.audio.unlock();
    window.addEventListener('pointerdown', unlock);
    window.addEventListener('keydown', unlock);
    canvas.addEventListener('pointerdown', () => {
      canvas.focus();
      if (G.scene === 'title') G.title.clicked = true;
      if (paused) {
        paused = false;
        G.audio.unlock();
      }
    });
    G.on('blur', () => {
      if (G.scene === 'game' && !G.ui.modal() && !G.story.active && G.game.player && !G.game.player.dead) paused = true;
    });
    window.addEventListener('keydown', () => {
      if (paused) {
        paused = false;
        I.clearAll();
      }
    });
    const fontsReady = document.fonts && document.fonts.load ? Promise.race([Promise.all([document.fonts.load('700 20px "Cinzel"'), document.fonts.load('500 16px "Crimson Pro"'), document.fonts.load('italic 500 16px "Crimson Pro"')]), new Promise((r) => setTimeout(r, 2500))]) : Promise.resolve();
    Promise.all([fontsReady.catch(() => {}), G.save.init()]).then(() => {
      if (hotData && hotData.state && G.save.valid(hotData.state)) {
        G.audio.unlock();
        G.continueGame(G.save.migrate(hotData.state));
      } else G.title.open();
      const ld = document.getElementById('loading');
      if (ld) ld.remove();
    });
    canvas.focus();
    requestAnimationFrame(frame);
  }

  // live updates of a published artifact keep the current run
  const hot = window.claude && window.claude.hot;
  try {
    if (hot && hot.snapshot)
      hot.snapshot(() => {
        if (G.scene !== 'game' || !G.state || !G.game.room) return {};
        const st = JSON.parse(JSON.stringify(G.state));
        st.room = G.game.room.id;
        st.px = G.game.player.cx;
        st.py = G.game.player.fy;
        return { state: st };
      });
  } catch (e) {}
  const start = (data) => boot(data || {});
  if (hot && hot.ready) hot.ready(start);
  else start((hot && hot.data) || {});
})();


</script>
