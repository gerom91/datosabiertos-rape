<title>Elegy of the Night</title>
<style>
  /* One visual world: a dark gothic stage. Layout: full-viewport canvas, letterboxed. */
  :root {
    color-scheme: dark;
    --bg: #050407;
    --ink: #0b0910;
    --gold: #c9a24a;
    --bone: #ece6d6;
    --blood: #8a1426;
    --mist: rgba(236, 230, 214, 0.16);
    --font-title: "Cinzel", Georgia, "Times New Roman", serif;
    --font-body: "Crimson Pro", Georgia, "Times New Roman", serif;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--bone); overflow: hidden; }
  body { font-family: var(--font-body); -webkit-user-select: none; user-select: none; touch-action: none; }
  #wrap { position: fixed; inset: 0; background: var(--bg); }
  #game { display: block; width: 100%; height: 100%; outline: none; image-rendering: pixelated; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-title); letter-spacing: 0.2em; color: var(--gold); font-size: 14px; pointer-events: none; }
  #touch { position: absolute; inset: 0; pointer-events: none; }
  #touch[hidden] { display: none !important; }
  #touch .pad, #touch .btn, #touch .mini { pointer-events: auto; touch-action: none; }
  #touch .pad {
    position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px));
    width: min(34vmin, 170px); height: min(34vmin, 170px); border-radius: 50%;
    background: radial-gradient(circle, rgba(236,230,214,0.10) 0 30%, rgba(236,230,214,0.05) 31% 100%);
    border: 1px solid var(--mist);
  }
  #touch .pad::before, #touch .pad::after { content: ""; position: absolute; background: var(--mist); }
  #touch .pad::before { left: 50%; top: 14%; bottom: 14%; width: 2px; transform: translateX(-50%); }
  #touch .pad::after { top: 50%; left: 14%; right: 14%; height: 2px; transform: translateY(-50%); }
  #touch .btns { position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px)); width: min(40vmin, 200px); height: min(36vmin, 180px); }
  #touch .btn {
    position: absolute; width: 33%; aspect-ratio: 1; max-width: 100%; border-radius: 50%;
    display: grid; place-items: center; font-family: var(--font-title); font-size: clamp(10px, 2.6vmin, 14px); color: var(--bone);
    background: rgba(20, 14, 30, 0.45); border: 1px solid rgba(201, 162, 74, 0.55);
  }
  #touch .btn:active { background: rgba(138, 20, 38, 0.6); }
  #touch .b-jump { right: 0; bottom: 0; }
  #touch .b-atk { right: 36%; bottom: 8%; }
  #touch .b-l { right: 0; bottom: 38%; }
  #touch .b-dash { right: 68%; bottom: 0; }
  #touch .b-sub { right: 36%; bottom: 46%; }
  #touch .minis { position: absolute; top: max(8px, env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 60vw; }
  #touch .mini {
    font-family: var(--font-title); font-size: 11px; padding: 6px 9px; border-radius: 6px; color: var(--bone);
    background: rgba(20, 14, 30, 0.5); border: 1px solid rgba(201, 162, 74, 0.45);
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

/* ---- js/util.js ---- */
/* Elegy of the Night — util.js
 * Global namespace, constants and small helpers shared by every module.
 * Classic script (no modules) so the game also runs from file://.
 */
(function () {
  'use strict';
  const root = typeof window !== 'undefined' ? window : globalThis;
  const G = (root.G = root.G || {});

  // ---- Core constants -------------------------------------------------------
  G.W = 384; // internal resolution (pixels)
  G.H = 224;
  G.TILE = 16;
  G.CELL_W = 24; // tiles per map cell (one screen)
  G.CELL_H = 14;
  G.CELL_PX_W = G.CELL_W * G.TILE; // 384
  G.CELL_PX_H = G.CELL_H * G.TILE; // 224
  G.FPS = 60;
  G.VERSION = '1.0.0';
  G.DEBUG = false;

  const U = (G.util = {});

  U.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.approach = (v, target, step) => (v < target ? Math.min(v + step, target) : Math.max(v - step, target));
  U.sign = (v) => (v < 0 ? -1 : v > 0 ? 1 : 0);
  U.rnd = (a, b) => a + Math.random() * (b - a);
  U.irnd = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
  U.pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  U.chance = (p) => Math.random() < p;
  U.dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
  U.angle = (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1);
  U.overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  U.pointIn = (px, py, r) => px >= r.x && px < r.x + r.w && py >= r.y && py < r.y + r.h;
  U.wrapAngle = (a) => {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  };

  // FNV-1a string hash → uint32
  U.hash = function (str) {
    let h = 2166136261 >>> 0;
    str = String(str);
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  };

  // Seeded RNG (mulberry32)
  U.RNG = function (seed) {
    let s = (typeof seed === 'string' ? U.hash(seed) : seed >>> 0) || 1;
    const next = function () {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    return {
      next,
      range: (a, b) => a + next() * (b - a),
      int: (a, b) => Math.floor(a + next() * (b - a + 1)),
      pick: (arr) => arr[Math.floor(next() * arr.length)],
      chance: (p) => next() < p,
    };
  };

  U.ease = {
    inOut: (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
    out: (t) => 1 - (1 - t) * (1 - t),
    in: (t) => t * t,
    outBack: (t) => {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    },
  };

  // ---- Colors ---------------------------------------------------------------
  U.hex2rgb = function (hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
    const n = parseInt(hex, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  U.rgb2hex = function (r, g, b) {
    const c = (v) => U.clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0');
    return '#' + c(r) + c(g) + c(b);
  };
  U.mix = function (c1, c2, t) {
    const a = U.hex2rgb(c1), b = U.hex2rgb(c2);
    return U.rgb2hex(U.lerp(a[0], b[0], t), U.lerp(a[1], b[1], t), U.lerp(a[2], b[2], t));
  };
  // amt > 0 lightens towards white, < 0 darkens towards black
  U.shade = function (c, amt) {
    return amt >= 0 ? U.mix(c, '#ffffff', amt) : U.mix(c, '#000000', -amt);
  };
  U.rgba = function (hex, a) {
    const c = U.hex2rgb(hex);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  };

  // ---- Misc -----------------------------------------------------------------
  U.clone = (o) => JSON.parse(JSON.stringify(o));
  U.fmtTime = function (frames) {
    const s = Math.floor(frames / 60);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return h + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  };
  U.uid = (function () {
    let n = 0;
    return () => ++n;
  })();
  U.removeIf = function (arr, fn) {
    let j = 0;
    for (let i = 0; i < arr.length; i++) if (!fn(arr[i])) arr[j++] = arr[i];
    arr.length = j;
    return arr;
  };

  // Simple event bus
  const listeners = {};
  G.on = function (ev, fn) {
    (listeners[ev] = listeners[ev] || []).push(fn);
  };
  G.emit = function (ev, a, b, c) {
    const l = listeners[ev];
    if (l) for (let i = 0; i < l.length; i++) l[i](a, b, c);
  };

  // Safe storage helpers (localStorage can throw in sandboxes)
  G.store = {
    get(key) {
      try {
        const v = root.localStorage && root.localStorage.getItem(key);
        return v == null ? null : JSON.parse(v);
      } catch (e) {
        return null;
      }
    },
    set(key, val) {
      try {
        if (!root.localStorage) return false;
        root.localStorage.setItem(key, JSON.stringify(val));
        return true;
      } catch (e) {
        return false;
      }
    },
    del(key) {
      try {
        root.localStorage && root.localStorage.removeItem(key);
      } catch (e) {}
    },
  };
})();

/* ---- js/gfx.js ---- */
/* Elegy of the Night — gfx.js
 * Canvas setup: a low-res world buffer (384x224) presented with crisp scaling,
 * a high-res UI layer for text, a sprite pipeline that turns procedural vector
 * drawings into clean pixel art (alpha threshold + palette snap + outline),
 * lighting, screen shake/flash.
 */
(function () {
  'use strict';
  const root = typeof window !== 'undefined' ? window : globalThis;
  const G = (root.G = root.G || {});
  const U = G.util;
  const hasDOM = typeof document !== 'undefined';

  const F = {
    title: '"Cinzel", "Trajan Pro", Georgia, "Times New Roman", serif',
    body: '"Crimson Pro", "Iowan Old Style", Georgia, "Times New Roman", serif',
  };

  function makeCanvas(w, h, willRead) {
    if (!hasDOM) {
      return { width: w, height: h, getContext: () => null };
    }
    const c = document.createElement('canvas');
    c.width = Math.max(1, w | 0);
    c.height = Math.max(1, h | 0);
    if (willRead) c._wr = true;
    return c;
  }
  function ctxOf(c) {
    if (!c.getContext) return null;
    if (!c._ctx) c._ctx = c.getContext('2d', c._wr ? { willReadFrequently: true } : undefined);
    return c._ctx;
  }

  const gfx = (G.gfx = {
    F,
    W: G.W,
    H: G.H,
    buf: null,
    ctx: null,
    main: null,
    mctx: null,
    k: 1, // device pixels per virtual pixel
    ox: 0, // device-pixel offset of the virtual screen
    oy: 0,
    dpr: 1,
    shakeT: 0,
    shakeMag: 0,
    shakeX: 0,
    shakeY: 0,
    flashT: 0,
    flashMax: 1,
    flashColor: '#ffffff',
    fade: 0, // 0..1 black overlay
    fadeColor: '#000000',
    lights: [],
    cache: new Map(),
    makeCanvas,
    ctxOf,
  });

  gfx.init = function (canvas) {
    gfx.main = canvas;
    gfx.mctx = canvas.getContext('2d', { alpha: false });
    gfx.buf = makeCanvas(G.W, G.H);
    gfx.ctx = ctxOf(gfx.buf);
    gfx.ctx.imageSmoothingEnabled = false;
    gfx.light = makeCanvas(G.W, G.H);
    gfx.lctx = ctxOf(gfx.light);
    gfx.mid = makeCanvas(G.W, G.H); // integer-upscaled intermediate
    gfx.midCtx = ctxOf(gfx.mid);
    gfx.resize();
    if (hasDOM) {
      window.addEventListener('resize', gfx.resize);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', gfx.resize);
    }
  };

  gfx.resize = function () {
    const c = gfx.main;
    if (!c) return;
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    const rect = c.parentElement ? c.parentElement.getBoundingClientRect() : { width: window.innerWidth, height: window.innerHeight };
    const cw = Math.max(64, Math.floor(rect.width));
    const ch = Math.max(64, Math.floor(rect.height));

    c.style.height = ch + 'px';
    c.width = Math.floor(cw * dpr);
    c.height = Math.floor(ch * dpr);
    gfx.dpr = dpr;
    let k = Math.min(c.width / G.W, c.height / G.H);
    // Prefer integer scale when it costs little space
    const ki = Math.floor(k);
    if (ki >= 2 && k - ki < 0.12) k = ki;
    gfx.k = k;
    gfx.ox = Math.floor((c.width - G.W * k) / 2);
    gfx.oy = Math.floor((c.height - G.H * k) / 2);

  gfx.applyLighting = function (darkness, tint) {

      g.addColorStop(0.55, 'rgba(0,0,0,' + Math.min(1, L.i) * 0.6 + ')');
      g.addColorStop(1, 'rgba(0,0,0,0)');

      l.fillRect(L.x - L.r, L.y - L.r, L.r * 2, L.r * 2);

      ctx.fillStyle = gfx.flashColor;
      ctx.fillRect(0, 0, G.W, G.H);
      ctx.globalAlpha = 1;
      gfx.flashT--;

    if (gfx.fade > 0) {
      ctx.globalAlpha = U.clamp(gfx.fade, 0, 1);
      ctx.fillStyle = gfx.fadeColor;
      ctx.fillRect(0, 0, G.W, G.H);
      ctx.globalAlpha = 1;
    }
    m.setTransform(1, 0, 0, 1, 0, 0);
    m.fillStyle = '#000';
    m.fillRect(0, 0, gfx.main.width, gfx.main.height);

    m.textBaseline = o.baseline || 'alphabetic';

      .split('\n')
      .forEach((para) => {

  gfx.panel = function (x, y, w, h, o) {

    m.save();
    const g = m.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, o.top || 'rgba(18,22,58,0.94)');
    g.addColorStop(1, o.bottom || 'rgba(6,6,22,0.96)');

   *  opts.threshold: alpha cut (0..255, default 110)
   *  opts.palette: array of hex colors to snap to (optional)
   *  opts.outline: hex color for a 1px outer outline (optional)
   *  opts.outlineDiag: also outline diagonals

  gfx.pixelize = function (cv, o) {
    o = o || {};
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    if (!ctx) return cv;
    const w = cv.width, h = cv.height;
    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;
    const thr = o.threshold == null ? 110 : o.threshold;
    const pal = o.palette ? parsePalette(o.palette) : null;
    const n = w * h;
    for (let i = 0; i < n; i++) {
      const j = i * 4;
      if (d[j + 3] < thr) {
        d[j + 3] = 0;
        continue;
      }
      d[j + 3] = 255;
      if (pal) {
        let best = 0, bd = 1e9;
        const r = d[j], g = d[j + 1], b = d[j + 2];
        for (let p = 0; p < pal.length; p++) {
          const c = pal[p];
          const dr = r - c[0], dg = g - c[1], db = b - c[2];

          if (dd < bd) {
            bd = dd;
            best = p;
          }
        }
        const c = pal[best];
        d[j] = c[0];
        d[j + 1] = c[1];
        d[j + 2] = c[2];
      }
    }
    if (o.outline) {
      const oc = U.hex2rgb(o.outline);
      const solid = new Uint8Array(n);
      for (let i = 0; i < n; i++) solid[i] = d[i * 4 + 3] ? 1 : 0;
      for (let y = 0; y < h; y++)
        for (let x = 0; x < w; x++) {
          const i = y * w + x;
          if (solid[i]) continue;
          let near =
            (x > 0 && solid[i - 1]) || (x < w - 1 && solid[i + 1]) || (y > 0 && solid[i - w]) || (y < h - 1 && solid[i + w]);
          if (!near && o.outlineDiag)
            near =
              (x > 0 && y > 0 && solid[i - w - 1]) ||
              (x < w - 1 && y > 0 && solid[i - w + 1]) ||
              (x > 0 && y < h - 1 && solid[i + w - 1]) ||
              (x < w - 1 && y < h - 1 && solid[i + w + 1]);
          if (near) {
            const j = i * 4;
            d[j] = oc[0];
            d[j + 1] = oc[1];
            d[j + 2] = oc[2];
            d[j + 3] = 255;
          }
        }
    }
    ctx.putImageData(img, 0, 0);
    return cv;
  };

  // Cached sprite: draw(ctx, w, h) is called once per key.
  gfx.sprite = function (key, w, h, draw, opts) {
    let c = gfx.cache.get(key);
    if (c) return c;
    c = makeCanvas(w, h, true);
    const ctx = ctxOf(c);

    return c;
  };

  gfx.whiteOf = function (img, color) {

    if (m && m[col]) return m[col];
    const c = makeCanvas(img.width, img.height);
    const x = ctxOf(c);
    x.drawImage(img, 0, 0);
    x.globalCompositeOperation = 'source-in';
    x.fillStyle = col;
    x.fillRect(0, 0, c.width, c.height);
    if (!m) {
      m = {};

    m[col] = c;
    return c;
  };

  /* Draw an image on the buffer with an anchor point (ax, ay inside the image)
   * placed at (x, y). flip mirrors horizontally around the anchor. */
  gfx.drawAnchored = function (img, x, y, ax, ay, flip, alpha, ctx) {
    ctx = ctx || gfx.ctx;
    if (!img) return;
    if (alpha != null && alpha < 1) ctx.globalAlpha = alpha;
    if (flip) {
      ctx.save();
      ctx.translate(Math.round(x), Math.round(y));
      ctx.scale(-1, 1);
      ctx.drawImage(img, -ax, -Math.round(ay));
      ctx.restore();
    } else {
      ctx.drawImage(img, Math.round(x - ax), Math.round(y - ay));
    }
    if (alpha != null && alpha < 1) ctx.globalAlpha = 1;
  };

  /* ASCII pixel art → canvas. rows: array of strings; pal: {char: '#hex'}.
   * '.' and ' ' are transparent. */
  gfx.ascii = function (key, rows, pal, opts) {
    let c = gfx.cache.get(key);
    if (c) return c;
    const h = rows.length, w = rows.reduce((m, r) => Math.max(m, r.length), 0);
    c = makeCanvas(w, h);
    const ctx = ctxOf(c);
    if (ctx) {
      for (let y = 0; y < h; y++)
        for (let x = 0; x < rows[y].length; x++) {
          const ch = rows[y][x];
          const col = pal[ch];
          if (!col) continue;
          ctx.fillStyle = col;
          ctx.fillRect(x, y, 1, 1);
        }
      if (opts && opts.outline) gfx.pixelize(c, { outline: opts.outline, threshold: 1 });
    }
    gfx.cache.set(key, c);
    return c;
  };

  // Recolor a cached canvas through a color map {fromHex: toHex}
  gfx.recolor = function (key, src, map) {
    let c = gfx.cache.get(key);
    if (c) return c;
    c = makeCanvas(src.width, src.height, true);
    const ctx = ctxOf(c);
    if (ctx) {
      ctx.drawImage(src, 0, 0);
      const img = ctx.getImageData(0, 0, c.width, c.height), d = img.data;
      const pairs = Object.keys(map).map((k) => [U.hex2rgb(k), U.hex2rgb(map[k])]);
      for (let i = 0; i < d.length; i += 4) {
        if (!d[i + 3]) continue;
        for (const [f, t] of pairs)
          if (d[i] === f[0] && d[i + 1] === f[1] && d[i + 2] === f[2]) {
            d[i] = t[0];
            d[i + 1] = t[1];
            d[i + 2] = t[2];
            break;
          }
      }
      ctx.putImageData(img, 0, 0);
    }
    gfx.cache.set(key, c);
    return c;
  };

  // Small drawing helpers on any ctx (vector, before pixelize)
  gfx.limb = function (ctx, x1, y1, x2, y2, w, col) {
    ctx.strokeStyle = col;
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  };
  gfx.poly = function (ctx, pts, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    ctx.closePath();
    ctx.fill();
  };
  gfx.circle = function (ctx, x, y, r, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  };
  gfx.ellipse = function (ctx, x, y, rx, ry, rot, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, Math.PI * 2);
    ctx.fill();
  };
  // crisp pixel rect on buffer
  gfx.rect = function (x, y, w, h, col, ctx) {
    ctx = ctx || gfx.ctx;
    ctx.fillStyle = col;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  };
})();


/* ---- js/input.js ---- */
/* Elegy of the Night — input.js
 * Keyboard + gamepad + touch → abstract actions, with per-frame pressed /
 * held / released states, menu auto-repeat and a directional history used to
 * recognise spell motions (e.g. ↓↘→ + attack).
 */
(function () {
  'use strict';
  const root = typeof window !== 'undefined' ? window : globalThis;
  const G = (root.G = root.G || {});
  const hasDOM = typeof document !== 'undefined';

  const ACTIONS = [
    'left', 'right', 'up', 'down', 'jump', 'attack', 'attack2', 'backdash', 'sub',
    'bat', 'mist', 'wolf', 'menu', 'map', 'confirm', 'cancel', 'tabL', 'tabR',
  ];

  const DEFAULT_KEYS = {
    left: ['ArrowLeft'],
    right: ['ArrowRight'],
    up: ['ArrowUp'],
    down: ['ArrowDown'],
    jump: ['KeyZ', 'Space'],
    attack: ['KeyX'],
    attack2: ['KeyC'],
    backdash: ['KeyA', 'ShiftLeft', 'ShiftRight'],
    sub: ['KeyS'],
    bat: ['KeyQ'],
    mist: ['KeyW'],
    wolf: ['KeyE'],
    menu: ['Enter', 'Escape'],
    map: ['Tab', 'KeyM'],
    confirm: ['KeyZ', 'Enter', 'Space'],
    cancel: ['KeyX', 'Escape', 'Backspace'],
    tabL: ['KeyQ', 'PageUp'],
    tabR: ['KeyE', 'PageDown'],
  };
  // standard gamepad mapping
  const PAD = {
    jump: [0], attack: [2], attack2: [1], backdash: [3], bat: [4], mist: [5], wolf: [6], sub: [7],
    map: [8], menu: [9], up: [12], down: [13], left: [14], right: [15],
    confirm: [0], cancel: [1], tabL: [4], tabR: [5],
  };

  const I = (G.input = {
    ACTIONS,
    held: {},
    pressed: {},
    released: {},
    kb: {},
    pad: {},
    touch: {},
    downEvents: {},
    repeatT: {},
    keys: JSON.parse(JSON.stringify(DEFAULT_KEYS)),
    DEFAULT_KEYS,
    lastDevice: 'kb',
    frame: 0,
    hist: [], // {d, f}
    lastDir: 0,
    anyKey: false,
    enabled: true,
  });
  ACTIONS.forEach((a) => {
    I.held[a] = I.pressed[a] = I.released[a] = false;
    I.kb[a] = I.pad[a] = I.touch[a] = false;
    I.downEvents[a] = 0;
    I.repeatT[a] = 0;

  const codeToActions = {};
  function rebuildMap() {
    for (const k in codeToActions) delete codeToActions[k];
    for (const a of ACTIONS)

/* Elegy of the Night — world.js

 * map-cell indexing used for transitions and the map screen.
 *
 * ROOM FORMAT (see docs/ROOMS.md):
 *   G.world.room({ id, map:'castle'|'archives', area, x, y, w, h, rows:[...], legend:{} })
 *   rows: h*14 strings of w*24 chars.

 *           '\\' slope rising left  '^' spikes  'G' grate (mist passes)
 *           'B' breakable wall  'X' Belmont seal (opens with the Belmont Crest)
 *           '~' water  'I' invisible-ink walkway (one-way, needs the Lantern)
 *   Entities (lowercase / symbols, placed standing on the tile below):

  const DEFAULT_LEGEND = {
    c: { t: 'candle' },
    s: { t: 'save' },
    t: { t: 'teleport' },
    '@': { t: 'start' },
  };

  const W = (G.world = {
    areas: {},
    rooms: {},
    order: [],
    maps: {
      castle: { id: 'castle', name: { en: 'Dracula’s Castle', es: 'Castillo de Drácula' }, cells: new Map(), total: 0 },
      archives: { id: 'archives', name: { en: 'Belmont Archives', es: 'Archivos Belmont' }, cells: new Map(), total: 0 },
    },
    built: false,
    errors: [],

    W.areas[id] = def;

    def.w = def.w || 1;
    def.h = def.h || 1;

    rows.length = th;
    for (let i = 0; i < th; i++) {
      if (rows[i].length !== tw) {
        W.errors.push(def.id + ': row ' + i + ' has ' + rows[i].length + ' chars, expected ' + tw);

        const cx = Math.floor(tx / CW);
        const ncy = side === 'T' ? def.y - 1 : def.y + def.h;
        const to = W.roomAtCell(def.map, def.x + cx, ncy);
        const key = side + cx;
        if (seen.has(key)) continue;
        seen.add(key);
        def._doors.push({ side, cell: cx, to, tx });
      }
    }
  }

  // ---- Runtime room ----------------------------------------------------------
  function Room(def) {
    this.def = def;
    this.id = def.id;
    this.map = def.map;
    this.area = W.areas[def.area] || { id: def.area, theme: 'entrance' };

      const r = rows[ty];
      for (let tx = 0; tx < this.tw; tx++) {
        const ch = r[tx];
        let t = CHAR_TILE[ch];
        if (t === undefined) {
          t = T.EMPTY;
          const L = legend[ch];
          if (L) {
            const sp = Object.assign({}, L);
            sp.tx = tx;
            sp.ty = ty;
            sp.x = tx * TS + TS / 2;
            sp.y = ty * TS + TS; // bottom of the tile
            sp.key = def.id + ':' + tx + ',' + ty;
            this.spawns.push(sp);
            if (L.tile) t = CHAR_TILE[L.tile] || 0;

    const a = W.areas[areaId];
    return a ? G.tr(a.name) : areaId;
  };
})();

    const t = room.get(tx, ty);
    if (solidFor(t) || t === T.ONEWAY) return true;
    if (isSlope(t)) return py >= slopeSurface(t, tx, ty, px) - 1;
    // slope just below (descending stairs)
    const t2 = room.get(tx, ty + 1);
    return isSlope(t2);
  };
  // Enemy helper: would walking forward step into a wall or off a ledge?
  P.blockedAhead = function (room, b, dir) {
    const fx = dir > 0 ? b.x + b.w + 2 : b.x - 2;
    const wall = P.solidAt(room, fx, b.y + b.h - 10) || P.solidAt(room, fx, b.y + 4);
    const ledge = !P.floorAt(room, fx, b.y + b.h + 4);
    return { wall, ledge };
  };
  // Line of sight between two points (tile DDA, coarse)
  P.los = function (room, x1, y1, x2, y2) {
    const d = Math.hypot(x2 - x1, y2 - y1);
    const n = Math.ceil(d / 8);
    for (let i = 1; i < n; i++) {
      const x = x1 + ((x2 - x1) * i) / n, y = y1 + ((y2 - y1) * i) / n;
      if (P.solidAt(room, x, y)) return false;
    }
    return true;
  };
  // Does a rectangle overlap any solid tile?
  P.rectSolid = function (room, x, y, w, h, b) {
    const tx0 = Math.floor(x / TS), tx1 = Math.floor((x + w - 0.01) / TS);
    const ty0 = Math.floor(y / TS), ty1 = Math.floor((y + h - 0.01) / TS);
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) if (solidFor(room.get(tx, ty), b)) return true;
    return false;
  };
  // Simple projectile step: returns true if it hit a solid tile
  P.projHits = function (room, x, y) {
    const t = room.get(Math.floor(x / TS), Math.floor(y / TS));
    return t === T.SOLID || t === T.BREAK || t === T.SEAL || t === T.SPIKES || t === T.GRATE;
  };
})();

  // ---- Tile drawing ------------------------------------------------------------
  function px(ctx, x, y, w, h, c) {

  function vary(c, rng, amt) {

  function solidTile(ctx, th, x, y, nb, rng, deep) {
    const c = th.c;
    switch (th.solid) {
      case 'blocks': {
        const base = deep ? U.shade(c.base, -0.35) : vary(c.base, rng, 0.05);

          px(ctx, x + (rng.next() < 0.5 ? 5 : 10), y, 1, 7, c.mortar);

          px(ctx, x, y, 15, 1, U.shade(base, 0.18));
          px(ctx, x, y, 1, 15, U.shade(base, 0.1));

          if (rng.next() < 0.2) px(ctx, x + rng.int(2, 12), y + rng.int(2, 12), 1, 2, U.shade(base, 0.2));
        }

      }
      case 'marble': {
        const base = deep ? U.shade(c.base, -0.45) : vary(c.base, rng, 0.03);
        px(ctx, x, y, 16, 16, base);
        if (!deep) {
          ctx.strokeStyle = c.vein;
          ctx.lineWidth = 1;
          ctx.beginPath();
          let vx = x + rng.int(0, 15), vy = y;
          ctx.moveTo(vx + 0.5, vy);
          for (let i = 0; i < 4; i++) {
            vx += rng.int(-3, 3);
            vy += 4;
            ctx.lineTo(vx + 0.5, vy);
          }
          ctx.stroke();
          px(ctx, x, y, 16, 1, c.light);
          px(ctx, x + 15, y, 1, 16, c.dark);
          px(ctx, x, y + 15, 16, 1, c.dark);
        } else {
          px(ctx, x + 15, y, 1, 16, U.shade(base, -0.2));
          px(ctx, x, y + 15, 16, 1, U.shade(base, -0.2));
        }
        break;
      }
      case 'wood': {
        const base = deep ? U.shade(c.base, -0.4) : vary(c.base, rng, 0.06);
        px(ctx, x, y, 16, 16, base);
        for (let i = 0; i < 4; i++) {
          px(ctx, x, y + i * 4 + 3, 16, 1, U.shade(base, -0.35));
          if (!deep && rng.next() < 0.6) px(ctx, x + rng.int(1, 12), y + i * 4 + 1, rng.int(2, 4), 1, U.shade(base, -0.15));

          px(ctx, x + 2, y + 2, 1, 12, U.shade(base, -0.35));
          px(ctx, x + 3, y + 13, 11, 1, U.shade(base, 0.22));
          px(ctx, x + 13, y + 3, 1, 11, U.shade(base, 0.22));

          case 'brass':

            px(ctx, x, y, 16, 1, c.accent2);

  function skull(ctx, x, y, col, dark) {
    px(ctx, x + 1, y, 4, 1, col);
    px(ctx, x, y + 1, 6, 3, col);
    px(ctx, x + 1, y + 4, 4, 1, col);
    px(ctx, x + 1, y + 2, 1, 1, dark);
    px(ctx, x + 4, y + 2, 1, 1, dark);
    px(ctx, x + 2, y + 4, 1, 1, dark);
    px(ctx, x + 3, y + 5, 1, 1, col);
  }

  function platformTile(ctx, th, x, y, rng) {
    const c = th.c;
    switch (th.solid) {
      case 'wood':
      case 'mahogany':

        px(ctx, x + 3, y + 6, 2, 3, c.dark);
        px(ctx, x + 11, y + 6, 2, 3, c.dark);
        if (th.top === 'brass' || th.top === 'gold') px(ctx, x, y + 1, 16, 1, c.accent);
    }
  }

  function slopeTile(ctx, th, x, y, dir, rng) {
    // filled triangle with stair steps (dir 1: rising right '/', -1: rising left '\')
    const c = th.c;
    const step = 4;
    for (let i = 0; i < 16; i += step) {
      // column band i..i+step: height of surface
      const h = dir > 0 ? i + step : 16 - i;
      const top = y + 16 - h;
      px(ctx, x + i, top, step, h, i % 8 === 0 ? c.base : U.shade(c.base, -0.06));

    for (let i = 1; i < 16; i += 4) {

    }
    px(ctx, x, y + 6, 16, 2, '#2c2e36');
    px(ctx, x, y + 6, 16, 1, '#5a5c66');
  }

  function sealTile(ctx, th, x, y, rng) {
    px(ctx, x, y, 16, 16, 'rgba(230,190,90,0.28)');
    px(ctx, x + 7, y + 2, 2, 12, 'rgba(255,230,150,0.75)');
    px(ctx, x + 3, y + 6, 10, 2, 'rgba(255,230,150,0.75)');
    px(ctx, x, y, 1, 16, 'rgba(255,220,120,0.5)');
    px(ctx, x + 15, y, 1, 16, 'rgba(255,220,120,0.5)');
  }

  // ---- Back walls -----------------------------------------------------------------
  function backWall(ctx, room, th, rng) {
    const c = th.c, W = room.pw, H = room.ph;
    switch (th.wall) {
      case 'bricks':
      case 'stone_light': {
        px(ctx, 0, 0, W, H, c.wall);
        for (let y = 0; y < H; y += 8) {
          const off = (y / 8) % 2 ? 8 : 0;
          for (let x = -off; x < W; x += 16) {
            const col = vary(c.wall, rng, 0.08);
            px(ctx, x + 1, y + 1, 15, 7, col);
            if (rng.next() < 0.08) px(ctx, x + 4, y + 3, 3, 1, U.shade(col, -0.3));
          }
        }
        break;
      }
      case 'panels': {
        px(ctx, 0, 0, W, H, c.wall);
        for (let x = 0; x < W; x += 48) {
          px(ctx, x + 4, 16, 40, H - 32, c.wall2);
          px(ctx, x + 6, 18, 36, H - 36, U.shade(c.wall, 0.06));
          px(ctx, x + 4, 16, 40, 1, c.trim);
          px(ctx, x + 4, H - 17, 40, 1, U.shade(c.trim, -0.4));
        }
        // dado rail
        for (let y = 0; y < H; y += G.CELL_PX_H) px(ctx, 0, y + 150, W, 2, U.shade(c.trim, -0.3));
        break;
      }
      case 'shelves': {
        px(ctx, 0, 0, W, H, c.wall);
        for (let x = 0; x < W; x += 64) bookcase(ctx, x + 2, 0, 60, H, th, rng);
        break;
      }
      case 'tallshelves': {
        px(ctx, 0, 0, W, H, c.wall);
        for (let x = 0; x < W; x += 80) {
          bookcase(ctx, x + 4, 0, 72, H, th, rng, true);
          // carved pilaster between cases
          px(ctx, x, 0, 4, H, c.dark);
          px(ctx, x + 1, 0, 1, H, c.trim);
        }
        break;
      }
      case 'cave': {
        px(ctx, 0, 0, W, H, c.wall);
        for (let i = 0; i < (W * H) / 220; i++) {
          const x = rng.int(0, W), y = rng.int(0, H);
          px(ctx, x, y, rng.int(3, 12), rng.int(2, 8), rng.next() < 0.5 ? c.wall2 : U.shade(c.wall, 0.08));
        }
        break;
      }
      case 'skulls': {
        px(ctx, 0, 0, W, H, c.wall);
        for (let y = 2; y < H; y += 9)
          for (let x = (y % 18 ? 0 : 5); x < W; x += 10)
            if (rng.next() < 0.85) skull(ctx, x, y, U.shade(c.accent, -0.55 + rng.next() * 0.1), c.wall2);
        break;
      }
      case 'curtain': {
        px(ctx, 0, 0, W, H, c.wall);
        for (let x = 0; x < W; x += 6) {
          const s = Math.sin(x * 0.5) * 0.12;
          px(ctx, x, 0, 3, H, U.shade('#5a0c16', s - 0.25));
          px(ctx, x + 3, 0, 3, H, U.shade('#5a0c16', s - 0.4));
        }
        break;
      }
      default:
        px(ctx, 0, 0, W, H, c.wall);
    }
  }

  const BOOK_COLS = ['#7a1a1a', '#1a4a2a', '#1a2a5a', '#5a3a1a', '#6a5a1a', '#3a1a4a', '#8a6a2a', '#2a2a2a', '#5a1a3a', '#1a4a4a'];
  function bookcase(ctx, x, y, w, h, th, rng, tall) {
    const c = th.c;
    px(ctx, x, y, w, h, c.wall2);
    px(ctx, x, y, 3, h, c.dark);
    px(ctx, x + w - 3, y, 3, h, c.dark);
    const shelfH = tall ? 22 : 20;
    for (let sy = y + 6; sy < y + h - 4; sy += shelfH) {
      // books
      let bx = x + 3;
      while (bx < x + w - 5) {
        const bw = rng.int(2, 4), bh = rng.int(11, shelfH - 5);
        if (rng.next() < 0.1) {
          // a leaning book or gap
          bx += bw + 2;
          continue;
        }
        const col = U.shade(rng.pick(BOOK_COLS), th === THEMES.vault ? -0.35 : -0.15);
        px(ctx, bx, sy + shelfH - 3 - bh, bw, bh, col);
        px(ctx, bx, sy + shelfH - 3 - bh, 1, bh, U.shade(col, 0.15));
        if (rng.next() < 0.5) px(ctx, bx, sy + shelfH - 3 - bh + 3, bw, 1, c.trim);
        if (tall && rng.next() < 0.15) px(ctx, bx, sy + shelfH - 8, bw, 1, c.glow || c.trim);
        bx += bw;
      }
      px(ctx, x, sy + shelfH - 3, w, 3, c.base);
      px(ctx, x, sy + shelfH - 3, w, 1, c.light);
    }
  }

  // ---- Decorations -------------------------------------------------------------------
  // Each returns optional light sources {x,y,r,color,flicker}
  const DECOR = {
    window(ctx, x, y, th, rng, out) {
      const w = 28, h = 56;
      // arched window cut (transparent → shows far sky)
      ctx.save();
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.moveTo(x, y + h);
      ctx.lineTo(x, y + 14);
      ctx.arc(x + w / 2, y + 14, w / 2, Math.PI, 0);
      ctx.lineTo(x + w, y + h);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      // frame & mullions
      ctx.strokeStyle = th.c.dark;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x, y + h);
      ctx.lineTo(x, y + 14);
      ctx.arc(x + w / 2, y + 14, w / 2, Math.PI, 0);
      ctx.lineTo(x + w, y + h);
      ctx.stroke();
      px(ctx, x + w / 2 - 1, y + 2, 2, h - 2, th.c.dark);
      px(ctx, x, y + 30, w, 2, th.c.dark);
      px(ctx, x - 3, y + h, w + 6, 4, th.c.light);
      px(ctx, x - 3, y + h, w + 6, 1, U.shade(th.c.light, 0.3));
      out.push({ x: x + w / 2, y: y + 30, r: 60, color: '#8aa0ff', i: 0.5, moon: true });
    },
    pillar(ctx, x, y, th, rng, out, room) {
      const h = G.CELL_PX_H - y - 32;
      const c = th.c;
      px(ctx, x, y + 8, 14, h, U.shade(c.base, -0.25));
      px(ctx, x + 2, y + 8, 3, h, U.shade(c.base, -0.1));
      px(ctx, x + 10, y + 8, 2, h, U.shade(c.base, -0.45));
      px(ctx, x - 3, y, 20, 8, U.shade(c.base, -0.15));
      px(ctx, x - 3, y, 20, 2, U.shade(c.light, -0.1));
      px(ctx, x - 3, y + 8 + h - 6, 20, 6, U.shade(c.base, -0.2));
    },
    torch(ctx, x, y, th, rng, out) {
      px(ctx, x + 2, y + 8, 4, 10, '#3a2a1a');
      px(ctx, x, y + 6, 8, 3, '#5a4a3a');
      px(ctx, x + 2, y + 1, 4, 6, '#ffb040');
      px(ctx, x + 3, y, 2, 3, '#fff0a0');
      out.push({ x: x + 4, y: y + 3, r: 70, color: '#ff9a40', i: 0.9, flicker: true });
    },
    banner(ctx, x, y, th, rng) {
      px(ctx, x - 2, y, 24, 3, th.c.trim);
      px(ctx, x, y + 3, 20, 44, '#5a0e18');
      px(ctx, x + 2, y + 3, 2, 44, '#7a1a26');
      ctx.fillStyle = '#5a0e18';
      ctx.beginPath();
      ctx.moveTo(x, y + 47);
      ctx.lineTo(x + 10, y + 55);
      ctx.lineTo(x + 20, y + 47);
      ctx.fill();
      // bat emblem
      px(ctx, x + 8, y + 18, 4, 6, th.c.trim);
      px(ctx, x + 4, y + 17, 4, 3, th.c.trim);
      px(ctx, x + 12, y + 17, 4, 3, th.c.trim);
    },
    chain(ctx, x, y, th) {
      for (let i = 0; i < 70; i += 4) px(ctx, x + (i % 8 ? 0 : 1), y + i, 2, 3, '#4a4a52');
    },
    painting(ctx, x, y, th, rng) {
      const w = 34, h = 42, c = th.c;
      px(ctx, x - 3, y - 3, w + 6, h + 6, c.trim);
      px(ctx, x - 2, y - 2, w + 4, h + 4, U.shade(c.trim, -0.4));
      const bg = rng.pick(['#2a3a2a', '#3a2a2a', '#2a2a3a', '#3a3424']);
      px(ctx, x, y, w, h, bg);
      // abstract portrait: dark figure
      gfx.ellipse(ctx, x + w / 2, y + 16, 6, 7, 0, '#d8c0a8');
      px(ctx, x + w / 2 - 9, y + 23, 18, 19, rng.pick(['#3a1418', '#14183a', '#1a1a1a']));
      px(ctx, x + w / 2 - 6, y + 9, 12, 4, rng.pick(['#e0e0e0', '#3a2414', '#c8a040']));
    },
    statue(ctx, x, y, th) {
      const c = th.c, b = G.CELL_PX_H - 32;
      px(ctx, x - 4, b - 14, 24, 14, c.dark);
      px(ctx, x - 4, b - 14, 24, 2, c.light);
      gfx.ellipse(ctx, x + 8, b - 52, 4, 5, 0, c.light);
      px(ctx, x + 3, b - 47, 10, 22, c.base);
      px(ctx, x + 1, b - 26, 14, 12, c.base);
      px(ctx, x - 1, b - 46, 4, 14, c.base);
      px(ctx, x + 13, b - 52, 3, 18, c.base);
      px(ctx, x + 3, b - 47, 2, 30, c.light);
    },
    chandelier(ctx, x, y, th, rng, out) {
      px(ctx, x + 11, 0, 2, y + 6, '#3a3a3a');
      px(ctx, x, y + 6, 24, 3, th.c.trim);
      for (let i = 0; i < 4; i++) {
        px(ctx, x + 1 + i * 7, y + 2, 2, 4, '#f0e8d0');
        px(ctx, x + 1 + i * 7, y, 2, 2, '#ffd060');
      }
      out.push({ x: x + 12, y: y + 2, r: 80, color: '#ffc860', i: 0.8, flicker: true });
    },
    curtain(ctx, x, y, th) {
      for (let i = 0; i < 20; i += 4) px(ctx, x + i, 0, 4, 70 - i, i % 8 ? '#6a1018' : '#8a1a24');
      px(ctx, x - 2, 0, 24, 4, th.c.trim);
    },
    lamp(ctx, x, y, th, rng, out) {
      px(ctx, x + 3, y + 6, 2, 10, '#3a2a1a');
      px(ctx, x, y, 8, 7, '#2a5a3a');
      px(ctx, x + 1, y + 1, 6, 5, '#7ad08a');
      out.push({ x: x + 4, y: y + 3, r: 66, color: '#9aff9a', i: 0.75 });
    },
    ladder(ctx, x, y, th) {
      const h = G.CELL_PX_H - 32;
      px(ctx, x, 0, 2, h, th.c.light);
      px(ctx, x + 12, 0, 2, h, th.c.light);
      for (let i = 6; i < h; i += 10) px(ctx, x, i, 14, 2, th.c.base);
    },
    desk(ctx, x, y, th, rng, out) {
      const b = G.CELL_PX_H - 32;
      px(ctx, x, b - 18, 36, 4, th.c.light);
      px(ctx, x + 2, b - 14, 3, 14, th.c.dark);
      px(ctx, x + 31, b - 14, 3, 14, th.c.dark);
      px(ctx, x + 6, b - 22, 12, 4, '#e8dcc0');
      px(ctx, x + 22, b - 26, 4, 8, '#f0e8d0');
      px(ctx, x + 23, b - 28, 2, 2, '#ffd060');
      out.push({ x: x + 24, y: b - 28, r: 50, color: '#ffc860', i: 0.7, flicker: true });
    },
    globe(ctx, x, y, th) {
      const b = G.CELL_PX_H - 32;
      px(ctx, x + 6, b - 10, 3, 10, th.c.dark);
      gfx.circle(ctx, x + 7.5, b - 18, 7, '#3a6a8a');
      px(ctx, x + 4, b - 22, 5, 3, '#6a8a3a');
      px(ctx, x + 6, b - 16, 6, 3, '#6a8a3a');
    },
    candelabra(ctx, x, y, th, rng, out) {
      const b = G.CELL_PX_H - 32;
      const c = th.c;
      px(ctx, x + 7, b - 34, 2, 34, c.trim);
      px(ctx, x + 3, b - 3, 10, 3, c.trim);
      px(ctx, x, b - 34, 16, 2, c.trim);
      for (let i = 0; i < 3; i++) {
        px(ctx, x + i * 7, b - 40, 2, 6, '#efe6d0');
        px(ctx, x + i * 7, b - 43, 2, 3, '#ffcc55');
      }
      out.push({ x: x + 8, y: b - 42, r: 74, color: '#ffb850', i: 0.95, flicker: true });
    },
    portrait(ctx, x, y, th, rng) {
      const w = 30, h = 40, c = th.c;
      px(ctx, x - 3, y - 3, w + 6, h + 6, c.trim);
      px(ctx, x - 1, y - 1, w + 2, h + 2, U.shade(c.trim, -0.5));
      px(ctx, x, y, w, h, '#2a1a14');
      // a hunter: brown hair, dark coat, whip coil
      gfx.ellipse(ctx, x + 15, y + 15, 5, 6, 0, '#e0c4a8');
      px(ctx, x + 9, y + 8, 12, 5, rng.pick(['#5a3a1a', '#3a2a1a', '#8a6a3a', '#2a1a10']));
      px(ctx, x + 7, y + 22, 16, 18, rng.pick(['#3a2a1a', '#1a2a3a', '#4a1a1a']));
      px(ctx, x + 13, y + 22, 4, 6, '#d8d0c0');
      ctx.strokeStyle = '#8a6a3a';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(x + 22, y + 33, 3, 0, Math.PI * 2);
      ctx.stroke();
      px(ctx, x + 4, y + h - 5, w - 8, 3, c.trim); // nameplate
    },
    crest(ctx, x, y, th, rng, out) {
      const c = th.c;
      // Belmont crest: shield with a cross and a coiled whip
      ctx.fillStyle = U.shade(c.accent, -0.2);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + 24, y);
      ctx.lineTo(x + 24, y + 18);
      ctx.lineTo(x + 12, y + 30);
      ctx.lineTo(x, y + 18);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = c.trim;
      ctx.lineWidth = 2;
      ctx.stroke();
      px(ctx, x + 11, y + 4, 3, 20, c.glow || c.trim);
      px(ctx, x + 5, y + 10, 15, 3, c.glow || c.trim);
      out.push({ x: x + 12, y: y + 14, r: 44, color: c.glow || '#ffd080', i: 0.45 });
    },
    scrollrack(ctx, x, y, th, rng) {
      const b = G.CELL_PX_H - 32, c = th.c;
      px(ctx, x, b - 44, 30, 44, c.dark);
      for (let r = 0; r < 4; r++)
        for (let k = 0; k < 4; k++) {
          const sx = x + 2 + k * 7, sy = b - 42 + r * 11;
          px(ctx, sx, sy, 6, 6, '#e8dcb8');
          px(ctx, sx + 2, sy + 2, 2, 2, '#8a7a5a');
        }
    },
    rift(ctx, x, y, th, rng, out) {
      // tear into the ink void (transparent cut → shows the 'void' far layer)
      ctx.save();
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.moveTo(x + 10, y);
      ctx.lineTo(x + 16, y + 20);
      ctx.lineTo(x + 12, y + 34);
      ctx.lineTo(x + 18, y + 58);
      ctx.lineTo(x + 6, y + 36);
      ctx.lineTo(x + 9, y + 20);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      ctx.strokeStyle = th.c.glow || '#e8c070';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x + 10, y);
      ctx.lineTo(x + 16, y + 20);
      ctx.lineTo(x + 12, y + 34);
      ctx.lineTo(x + 18, y + 58);
      ctx.stroke();
      out.push({ x: x + 12, y: y + 30, r: 56, color: th.c.glow || '#e8c070', i: 0.5 });
    },
    lectern(ctx, x, y, th, rng, out) {
      const b = G.CELL_PX_H - 32, c = th.c;
      px(ctx, x + 6, b - 20, 4, 20, c.base);
      px(ctx, x + 2, b - 3, 12, 3, c.base);
      ctx.fillStyle = c.light;
      ctx.beginPath();
      ctx.moveTo(x, b - 20);
      ctx.lineTo(x + 16, b - 26);
      ctx.lineTo(x + 16, b - 22);
      ctx.lineTo(x, b - 17);
      ctx.fill();
      px(ctx, x + 3, b - 26, 10, 3, '#efe6d0');
    },
    stalactite(ctx, x, y, th, rng) {
      const c = th.c, h = rng.int(16, 46);
      ctx.fillStyle = U.shade(c.wall, 0.12);
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x + 12, 0);
      ctx.lineTo(x + 6, h);
      ctx.fill();
    },
    crystal(ctx, x, y, th, rng, out) {
      const b = G.CELL_PX_H - 32;
      ctx.fillStyle = '#4ac0d0';
      ctx.beginPath();
      ctx.moveTo(x, b);
      ctx.lineTo(x + 4, b - 14);
      ctx.lineTo(x + 8, b);
      ctx.fill();
      ctx.fillStyle = '#9af0ff';
      ctx.beginPath();
      ctx.moveTo(x + 6, b);
      ctx.lineTo(x + 11, b - 9);
      ctx.lineTo(x + 14, b);
      ctx.fill();
      out.push({ x: x + 7, y: b - 6, r: 40, color: '#60e0ff', i: 0.5 });
    },
    waterfall(ctx, x, y, th, rng) {
      for (let i = 0; i < G.CELL_PX_H; i += 2) {
        px(ctx, x + Math.round(Math.sin(i * 0.3) * 1), i, 10, 2, i % 6 ? '#3a7a9a' : '#6ab0d0');
      }
    },
    gear(ctx, x, y, th, rng) {
      const r = rng.int(14, 28), c = th.c;
      const cx = x + r, cy = y + r;
      ctx.fillStyle = U.shade(c.accent, -0.45);
      ctx.beginPath();
      const teeth = Math.round(r / 2.5);
      for (let i = 0; i < teeth * 2; i++) {
        const a = (i / (teeth * 2)) * Math.PI * 2;
        const rr = i % 2 ? r : r - 4;
        ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
      }
      ctx.closePath();
      ctx.fill();
      gfx.circle(ctx, cx, cy, r - 8, U.shade(c.accent, -0.6));
      gfx.circle(ctx, cx, cy, 3, U.shade(c.accent, -0.3));
    },
    clockface(ctx, x, y, th) {
      const c = th.c;
      gfx.circle(ctx, x + 24, y + 24, 25, c.accent);
      gfx.circle(ctx, x + 24, y + 24, 22, '#e8e0c8');
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        px(ctx, x + 24 + Math.cos(a) * 18 - 1, y + 24 + Math.sin(a) * 18 - 1, 2, 2, '#2a2420');
      }
      gfx.limb(ctx, x + 24, y + 24, x + 24, y + 10, 2, '#2a2420');
      gfx.limb(ctx, x + 24, y + 24, x + 34, y + 28, 2, '#2a2420');
    },
    pendulum(ctx, x, y, th) {
      px(ctx, x + 5, 0, 2, 90, th.c.accent);
      gfx.circle(ctx, x + 6, 96, 9, th.c.accent);
      gfx.circle(ctx, x + 6, 96, 6, U.shade(th.c.accent, 0.3));
    },
    niche(ctx, x, y, th, rng, out) {
      px(ctx, x, y, 22, 26, '#0a0806');
      skull(ctx, x + 8, y + 16, th.c.accent, '#0a0806');
      px(ctx, x + 3, y + 22, 16, 2, U.shade(th.c.accent, -0.3));
    },
    bonepile(ctx, x, y, th, rng) {
      const b = G.CELL_PX_H - 32;
      for (let i = 0; i < 6; i++) skull(ctx, x + i * 5 - (i > 2 ? 12 : 0), b - 6 - (i > 2 ? 6 : 0), U.shade(th.c.accent, -0.2), '#1a1410');
    },
    stained(ctx, x, y, th, rng, out) {
      const w = 30, h = 64;
      const cols = ['#c83040', '#3050c8', '#d0b030', '#30a050', '#a040c0'];
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(x, y + h);
      ctx.lineTo(x, y + 15);
      ctx.arc(x + w / 2, y + 15, w / 2, Math.PI, 0);
      ctx.lineTo(x + w, y + h);
      ctx.closePath();
      ctx.clip();
      for (let yy = y; yy < y + h; yy += 6)
        for (let xx = x; xx < x + w; xx += 6) px(ctx, xx, yy, 6, 6, U.shade(rng.pick(cols), -0.1 + rng.next() * 0.2));
      for (let yy = y; yy < y + h; yy += 6) px(ctx, x, yy, w, 1, '#1a1a1a');
      for (let xx = x; xx < x + w; xx += 6) px(ctx, xx, y, 1, h, '#1a1a1a');
      ctx.restore();
      ctx.strokeStyle = th.c.dark;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, y + h);
      ctx.lineTo(x, y + 15);
      ctx.arc(x + w / 2, y + 15, w / 2, Math.PI, 0);
      ctx.lineTo(x + w, y + h);
      ctx.stroke();
      out.push({ x: x + w / 2, y: y + 34, r: 70, color: '#ffd0a0', i: 0.55 });
    },
    pew(ctx, x, y, th) {
      const b = G.CELL_PX_H - 32;
      px(ctx, x, b - 16, 40, 3, '#4a2a18');
      px(ctx, x, b - 26, 3, 26, '#4a2a18');
      px(ctx, x + 37, b - 16, 3, 16, '#3a1e10');
      px(ctx, x, b - 10, 40, 2, '#3a1e10');
    },
    organ(ctx, x, y, th) {
      for (let i = 0; i < 9; i++) {
        const h = 40 + Math.abs(4 - i) * -6 + 30;
        px(ctx, x + i * 6, y + 90 - h, 5, h, i % 2 ? '#b8a060' : '#d0b878');
        px(ctx, x + i * 6 + 1, y + 90 - h + 4, 3, 2, '#2a2010');
      }
    },
    throne(ctx, x, y, th) {
      const b = G.CELL_PX_H - 32;
      px(ctx, x, b - 60, 30, 60, '#3a0a10');
      px(ctx, x + 3, b - 56, 24, 52, '#6a1018');
      px(ctx, x - 3, b - 66, 36, 8, th.c.trim);
      px(ctx, x - 4, b - 22, 38, 6, th.c.trim);
    },
  };
  G.DECOR = DECOR;
  const gfx = G.gfx;

  // ---- Room pre-render ---------------------------------------------------------------
  function isSolidT(t) {
    return t === T.SOLID || t === T.BREAK || t === T.SPIKES || t === T.SEAL;
  }

  G.renderRoom = function (room) {
    const th = THEMES[room.def.theme || room.area.theme] || THEMES.entrance;
    room.theme = th;
    const rng = U.RNG(room.id + ':bg');
    const bg = gfx.makeCanvas(room.pw, room.ph);
    const bctx = gfx.ctxOf(bg);
    room.lightsStatic = [];
    if (bctx) {
      backWall(bctx, room, th, rng);
      if (room.def.outdoor) {
        // open sky: clear the upper part of the wall
        bctx.clearRect(0, 0, room.pw, room.ph);
        // distant battlement silhouette at the bottom of each cell
        for (let cy = 0; cy < room.def.h; cy++) {
          const by = cy * G.CELL_PX_H + G.CELL_PX_H - 32;
          for (let x = 0; x < room.pw; x += 16) {
            const h = 30 + ((x / 16) % 3) * 6;
            px(bctx, x, by - h, 14, h, U.shade(th.c.wall, 0.05));
            if ((x / 16) % 4 === 0) px(bctx, x + 4, by - h - 8, 6, 8, U.shade(th.c.wall, 0.05));
          }
        }
      }
      // decorations: a few per cell, avoiding the floor band
      const list = room.def.decor || (room.def.outdoor ? null : th.decor);
      if (list && !room.def.noDecor) {
        for (let cy = 0; cy < room.def.h; cy++)
          for (let cx = 0; cx < room.def.w; cx++) {
            const n = rng.int(2, 3);
            for (let k = 0; k < n; k++) {
              const kind = list[(cx + cy * 3 + k) % list.length];
              const fn = DECOR[kind];
              if (!fn) continue;
              const x = cx * G.CELL_PX_W + 24 + k * 120 + rng.int(0, 60);
              const y = cy * G.CELL_PX_H + rng.int(28, 60);
              // skip decorations whose anchor is inside solid rock
              const tx = Math.floor(x / TS), ty = Math.floor((y + 20) / TS);
              if (isSolidT(room.get(tx, ty)) || isSolidT(room.get(tx + 1, ty))) continue;
              if (room.def.outdoor && (kind === 'window' || kind === 'painting' || kind === 'portrait')) continue;
              bctx.save();
              const dy = cy * G.CELL_PX_H;
              // decorations that sit on the floor use cell-relative coordinates
              if (['statue', 'desk', 'globe', 'candelabra', 'scrollrack', 'lectern', 'crystal', 'bonepile', 'pew', 'throne', 'ladder'].includes(kind)) {
                bctx.translate(0, dy);
                fn(bctx, x, 0, th, rng, room.lightsStatic, room);
                room.lightsStatic.forEach((L) => {
                  if (!L._fixed) {
                    L.y += dy;
                    L._fixed = true;
                  }
                });
              } else {
                fn(bctx, x, y, th, rng, room.lightsStatic, room);
                room.lightsStatic.forEach((L) => (L._fixed = true));
              }
              bctx.restore();
            }
          }
      }
    }
    // foreground tiles
    const fg = gfx.makeCanvas(room.pw, room.ph);
    const fctx = gfx.ctxOf(fg);
    if (fctx) drawTiles(fctx, room, th);
    room.bgCanvas = bg;
    room.fgCanvas = fg;
    room.renderedVersion = room.version;
    room.needsFar = !!(room.def.outdoor || (th.decor || []).some((d) => d === 'window' || d === 'rift') || th.wall === 'none');
  };

  function drawTiles(fctx, room, th) {
    fctx.clearRect(0, 0, room.pw, room.ph);
    for (let ty = 0; ty < room.th; ty++)
      for (let tx = 0; tx < room.tw; tx++) {
        const t = room.get(tx, ty);
        if (t === T.EMPTY || t === T.WATER) continue;
        const x = tx * TS, y = ty * TS;
        const rng = U.RNG(U.hash(room.id) + tx * 7919 + ty * 104729);
        if (t === T.SOLID || t === T.BREAK) {
          const nb = {
            u: isSolidT(room.get(tx, ty - 1)),
            d: isSolidT(room.get(tx, ty + 1)),
            l: isSolidT(room.get(tx - 1, ty)),
            r: isSolidT(room.get(tx + 1, ty)),
          };
          const deep =
            nb.u && nb.d && nb.l && nb.r &&
            isSolidT(room.get(tx - 1, ty - 1)) && isSolidT(room.get(tx + 1, ty - 1)) &&
            isSolidT(room.get(tx - 1, ty + 1)) && isSolidT(room.get(tx + 1, ty + 1));
          solidTile(fctx, th, x, y, nb, rng, deep);
          if (t === T.BREAK) {
            px(fctx, x + 4, y + 5, 5, 1, U.shade(th.c.base, -0.45));
            px(fctx, x + 8, y + 6, 1, 4, U.shade(th.c.base, -0.45));
            px(fctx, x + 9, y + 10, 3, 1, U.shade(th.c.base, -0.45));
          }
        } else if (t === T.ONEWAY) platformTile(fctx, th, x, y, rng);
        else if (t === T.SLOPE_R) slopeTile(fctx, th, x, y, 1, rng);
        else if (t === T.SLOPE_L) slopeTile(fctx, th, x, y, -1, rng);
        else if (t === T.SPIKES) spikesTile(fctx, th, x, y, isSolidT(room.get(tx, ty - 1)) && !isSolidT(room.get(tx, ty + 1)));
        else if (t === T.GRATE) grateTile(fctx, th, x, y);
        else if (t === T.SEAL) sealTile(fctx, th, x, y, rng);
      }
  }
  G.redrawTiles = function (room) {
    const fctx = gfx.ctxOf(room.fgCanvas);
    if (fctx) drawTiles(fctx, room, room.theme);
    room.renderedVersion = room.version;
  };

  // ---- Far (parallax) layers -------------------------------------------------------------
  const farCache = {};
  function stars(key, w, h, n, seed) {
    if (farCache[key]) return farCache[key];
    const c = gfx.makeCanvas(w, h), x = gfx.ctxOf(c);
    const r = U.RNG(seed);
    for (let i = 0; i < n; i++) {
      const b = r.next();
      x.fillStyle = b > 0.9 ? '#ffffff' : b > 0.6 ? '#b8c0e8' : '#6a70a0';
      x.fillRect(r.int(0, w), r.int(0, h), 1, 1);
    }
    farCache[key] = c;
    return c;
  }
  function mountains(key, w, h, col, seed, amp, base) {
    if (farCache[key]) return farCache[key];
    const c = gfx.makeCanvas(w, h), x = gfx.ctxOf(c);
    const r = U.RNG(seed);
    x.fillStyle = col;
    x.beginPath();
    x.moveTo(0, h);
    let y = base;
    for (let i = 0; i <= w; i += 8) {
      y = U.clamp(y + r.range(-amp, amp), base - amp * 3, h - 4);
      x.lineTo(i, y);
    }
    x.lineTo(w, h);
    x.closePath();
    x.fill();
    farCache[key] = c;
    return c;
  }
  function castleSilhouette(key, w, h, col) {
    if (farCache[key]) return farCache[key];
    const c = gfx.makeCanvas(w, h), x = gfx.ctxOf(c);
    const r = U.RNG(key);
    x.fillStyle = col;
    for (let i = 0; i < w; i += r.int(14, 30)) {
      const tw = r.int(8, 18), th = r.int(30, h - 20);
      x.fillRect(i, h - th, tw, th);
      x.beginPath();
      x.moveTo(i - 2, h - th);
      x.lineTo(i + tw / 2, h - th - r.int(10, 22));
      x.lineTo(i + tw + 2, h - th);
      x.fill();
      if (r.next() < 0.5) {
        x.fillStyle = '#e8c070';
        x.fillRect(i + 3, h - th + 8, 2, 3);
        x.fillStyle = col;
      }
    }
    x.fillRect(0, h - 22, w, 22);
    farCache[key] = c;
    return c;
  }
  function tileX(ctx, img, ox, y) {
    const w = img.width;
    let x = -(((ox % w) + w) % w);
    for (; x < G.W; x += w) ctx.drawImage(img, Math.round(x), Math.round(y));
  }

  G.drawFar = function (ctx, kind, camx, camy, t) {
    switch (kind) {
      case 'night':
      case 'redmoon': {
        const red = kind === 'redmoon';
        const g = ctx.createLinearGradient(0, 0, 0, G.H);
        g.addColorStop(0, red ? '#12030a' : '#070920');
        g.addColorStop(0.6, red ? '#2a0812' : '#16173a');
        g.addColorStop(1, red ? '#3a0c14' : '#2a2448');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, G.W, G.H);
        tileX(ctx, stars('stars', 384, 160, 120, 7), camx * 0.02, 0);
        // moon
        const mx = 300 - camx * 0.03, my = 46 - camy * 0.02;
        const mg = ctx.createRadialGradient(mx, my, 10, mx, my, 70);
        mg.addColorStop(0, red ? 'rgba(255,80,80,0.35)' : 'rgba(200,210,255,0.3)');
        mg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = mg;
        ctx.fillRect(mx - 70, my - 70, 140, 140);
        gfx.circle(ctx, mx, my, 22, red ? '#e04848' : '#e8e6d8');
        gfx.circle(ctx, mx - 7, my - 5, 5, red ? '#c03030' : '#cfcdbd');
        gfx.circle(ctx, mx + 6, my + 7, 3, red ? '#c03030' : '#cfcdbd');
        gfx.circle(ctx, mx + 9, my - 9, 2, red ? '#c03030' : '#cfcdbd');
        // clouds
        ctx.fillStyle = red ? 'rgba(60,10,20,0.55)' : 'rgba(30,32,70,0.6)';
        for (let i = 0; i < 6; i++) {
          const cx = ((i * 97 + t * 0.15 - camx * 0.08) % 520) - 60;
          const cy = 30 + ((i * 53) % 70) - camy * 0.04;
          ctx.beginPath();
          ctx.ellipse(cx, cy, 46, 8, 0, 0, Math.PI * 2);
          ctx.ellipse(cx + 22, cy - 4, 26, 7, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        tileX(ctx, mountains('mtn1', 512, 120, red ? '#1e0610' : '#141634', 3, 5, 40), camx * 0.1, G.H - 130 - camy * 0.05);
        tileX(ctx, castleSilhouette('cast1', 640, 140, red ? '#140408' : '#0c0d22'), camx * 0.2, G.H - 140 - camy * 0.08);
        tileX(ctx, mountains('mtn2', 512, 90, red ? '#0c0206' : '#080918', 9, 4, 50), camx * 0.35, G.H - 80 - camy * 0.12);
        break;
      }
      case 'void': {
        const g = ctx.createLinearGradient(0, 0, 0, G.H);
        g.addColorStop(0, '#0c0410');
        g.addColorStop(0.5, '#2a0a18');
        g.addColorStop(1, '#100408');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, G.W, G.H);
        // drifting pages and glyphs
        for (let i = 0; i < 28; i++) {
          const px0 = ((i * 137 + t * (0.1 + (i % 5) * 0.05) - camx * 0.15) % 460) - 40;
          const py0 = ((i * 71 + Math.sin(t * 0.01 + i) * 12 - camy * 0.1) % 260) - 20;
          ctx.globalAlpha = 0.25 + (i % 4) * 0.1;
          ctx.fillStyle = i % 3 ? '#e8d8b0' : '#e8c070';
          ctx.save();
          ctx.translate(px0, py0);
          ctx.rotate(Math.sin(t * 0.02 + i) * 0.6);
          ctx.fillRect(-4, -5, 8, 10);
          ctx.fillStyle = '#6a4a2a';
          ctx.fillRect(-2, -3, 4, 1);
          ctx.fillRect(-2, -1, 4, 1);
          ctx.restore();
        }
        ctx.globalAlpha = 1;
        break;
      }
      case 'cave': {
        ctx.fillStyle = '#04080c';
        ctx.fillRect(0, 0, G.W, G.H);
        break;
      }
      default:
        ctx.fillStyle = '#050407';
        ctx.fillRect(0, 0, G.W, G.H);
    }
  };

  // Animated water overlay for '~' tiles (drawn every frame)
  G.drawWater = function (ctx, room, camx, camy, t) {
    if (!room.hasWater) return;
    const x0 = Math.max(0, Math.floor(camx / TS)), x1 = Math.min(room.tw - 1, Math.floor((camx + G.W) / TS));
    const y0 = Math.max(0, Math.floor(camy / TS)), y1 = Math.min(room.th - 1, Math.floor((camy + G.H) / TS));
    for (let ty = y0; ty <= y1; ty++)
      for (let tx = x0; tx <= x1; tx++) {
        if (room.get(tx, ty) !== T.WATER) continue;
        const sx = tx * TS - camx, sy = ty * TS - camy;
        const top = room.get(tx, ty - 1) !== T.WATER;
        ctx.fillStyle = 'rgba(40,110,170,0.38)';
        ctx.fillRect(sx, sy, TS, TS);
        if (top) {
          for (let i = 0; i < TS; i += 2) {
            const wy = Math.round(Math.sin((tx * TS + i) * 0.2 + t * 0.08) * 1.2);
            ctx.fillStyle = 'rgba(160,220,255,0.75)';
            ctx.fillRect(sx + i, sy + wy, 2, 1);
          }
        }
      }
  };
})();

      hp: 90,
      mp: 30,
      hearts: 20,
      base: { hp: 90, mp: 30, hearts: 50, str: 8, con: 7, int: 8, lck: 6 },
      equip: { rhand: null, lhand: null, head: null, body: null, cloak: null, acc1: null, acc2: null },
      inv: {},
      relics: {},
      sub: null,
      spells: {},
      flags: {},
      visited: { castle: {}, archives: {} },
      bestiary: {},
      kills: 0,
      time: 0,
      status: { poison: 0, curse: 0 },
      saves: 0,
      deaths: 0,
    };
  };

  // EXP needed to go from level L to L+1
  G.expFor = function (L) {
    return Math.floor(30 * Math.pow(L, 1.85) + 20 * L);
  };
  G.LEVEL_CAP = 99;

  // Level up gains (deterministic per level so they look designed)
  G.levelGains = function (L) {
    const r = U.RNG('lvl' + L);
    return { hp: 7 + r.int(0, 4), mp: 3 + r.int(0, 2), str: r.chance(0.7) ? 1 : 0, con: r.chance(0.6) ? 1 : 0, int: r.chance(0.6) ? 1 : 0, lck: r.chance(0.35) ? 1 : 0 };
  };

  G.item = (id) => G.ITEMS[id];

  // Derived stats
  G.calcStats = function (s, buffs) {
    const b = s.base;
    const st = {
      hpMax: b.hp, mpMax: b.mp, heartsMax: b.hearts,
      str: b.str, con: b.con, int: b.int, lck: b.lck,
      def: 0, res: {}, immune: {}, mpRegen: 0, hpOnHit: 0, flags: {},
    };
    for (const slot of G.SLOTS) {
      const id = s.equip[slot];
      if (!id) continue;
      const it = G.ITEMS[id];
      if (!it) continue;
      if (it.def) st.def += it.def;
      if (it.bonus)
        for (const k in it.bonus) {
          if (k === 'hp') st.hpMax += it.bonus[k];
          else if (k === 'mp') st.mpMax += it.bonus[k];
          else st[k] += it.bonus[k];
        }
      if (it.res) for (const k in it.res) st.res[k] = Math.max(st.res[k] || 0, it.res[k]);
      if (it.immune) it.immune.forEach((k) => (st.immune[k] = true));
      if (it.mpRegen) st.mpRegen += it.mpRegen;
      if (it.hpOnHit) st.hpOnHit += it.hpOnHit;
      ['heartsOnKill', 'subDiscount', 'watchDiscount', 'seeWalls', 'wolfBoost', 'rareBoost', 'showHp'].forEach((k) => {
        if (it[k]) st.flags[k] = it[k];
      });
    }
    st.def += st.con;
    // attack per hand
    const atkOf = (slot) => {
      const id = s.equip[slot];
      const it = id ? G.ITEMS[id] : null;
      if (!it || it.kind !== 'weapon') {
        if (it && it.kind === 'shield') return st.str + 1;
        return st.str + 2;
      }
      return it.wtype === 'tome' ? it.atk + st.int : it.atk + st.str;
    };
    st.atkR = atkOf('rhand');
    st.atkL = atkOf('lhand');
    if (buffs && buffs.atk) {
      st.atkR += buffs.atk;
      st.atkL += buffs.atk;
    }
    if (s.status && s.status.poison > 0) {
      st.atkR = Math.floor(st.atkR * 0.75);
      st.atkL = Math.floor(st.atkL * 0.75);
    }
    return st;
  };

  G.hasRelic = (s, id) => !!(s.relics && s.relics[id] !== undefined);
  G.relicOn = (s, id) => !!(s.relics && s.relics[id]);

  // ---- Inventory -----------------------------------------------------------------------
  G.invAdd = function (s, id, n) {
    s.inv[id] = (s.inv[id] || 0) + (n == null ? 1 : n);
    if (s.inv[id] > 99) s.inv[id] = 99;
  };
  G.invRemove = function (s, id, n) {
    if (!s.inv[id]) return false;
    s.inv[id] -= n == null ? 1 : n;
    if (s.inv[id] <= 0) delete s.inv[id];
    return true;
  };
  G.invCount = (s, id) => s.inv[id] || 0;

  // Equip from inventory into slot. Returns true on success.
  G.equipItem = function (s, slot, id) {
    const it = id ? G.ITEMS[id] : null;
    if (it && !G.slotAccepts(slot, it)) return false;
    const prev = s.equip[slot];
    if (id) {
      if (!G.invRemove(s, id, 1)) return false;
    }
    if (prev) G.invAdd(s, prev, 1);
    s.equip[slot] = id || null;
    // two-handed rules
    if (it && it.hands === 2) {
      const other = slot === 'rhand' ? 'lhand' : 'rhand';
      if (s.equip[other]) {
        G.invAdd(s, s.equip[other], 1);
        s.equip[other] = null;
      }
    } else if (it && (slot === 'rhand' || slot === 'lhand')) {
      const other = slot === 'rhand' ? 'lhand' : 'rhand';
      const o = s.equip[other] ? G.ITEMS[s.equip[other]] : null;
      if (o && o.hands === 2) {
        G.invAdd(s, s.equip[other], 1);
        s.equip[other] = null;
      }
    }
    return true;
  };
  G.slotAccepts = function (slot, it) {
    switch (slot) {
      case 'rhand':
      case 'lhand':
        return it.kind === 'weapon' || it.kind === 'shield';
      case 'head':
      case 'body':
      case 'cloak':
        return it.kind === slot;
      case 'acc1':
      case 'acc2':
        return it.kind === 'acc';
    }
    return false;
  };

  G.isEquippable = (it) => ['weapon', 'shield', 'head', 'body', 'cloak', 'acc'].includes(it.kind);

  // Grant EXP; returns number of levels gained
  G.gainExp = function (s, n) {
    if (s.level >= G.LEVEL_CAP) return 0;
    s.exp += n;
    let ups = 0;
    while (s.level < G.LEVEL_CAP && s.exp >= G.expFor(s.level)) {
      s.exp -= G.expFor(s.level);
      s.level++;
      ups++;
      const g = G.levelGains(s.level);
      s.base.hp += g.hp;
      s.base.mp += g.mp;
      s.base.str += g.str;
      s.base.con += g.con;
      s.base.int += g.int;
      s.base.lck += g.lck;
    }
    return ups;
  };

  G.mapCompletion = function (s, mapId) {
    const m = G.world.maps[mapId];
    if (!m || !m.total) return 0;
    const v = Object.keys(s.visited[mapId] || {}).length;
    return (v / m.total) * 100;
  };
})();


/* ---- js/fx.js ---- */
/* Elegy of the Night — fx.js
 * Particles, damage numbers (pixel digits), slash trails, dust, sparks,
 * explosions and floating texts. Everything lives in world coordinates.
 */
(function () {
  'use strict';
  const root = typeof window !== 'undefined' ? window : globalThis;
  const G = (root.G = root.G || {});
  const U = G.util, gfx = G.gfx;

  const parts = [];
  const nums = [];
  const slashes = [];
  const MAXP = 700;

  const fx = (G.fx = { parts, nums, slashes });

  fx.clear = function () {
    parts.length = 0;
    nums.length = 0;
    slashes.length = 0;
  };

  fx.particle = function (x, y, vx, vy, col, life, o) {
    if (parts.length >= MAXP) parts.shift();
    o = o || {};
    parts.push({ x, y, vx, vy, col, life, max: life, size: o.size || 1, grav: o.grav || 0, drag: o.drag == null ? 0.98 : o.drag, glow: !!o.glow, shape: o.shape || 'px', rot: o.rot || 0, vr: o.vr || 0 });
  };
  fx.burst = function (x, y, col, n, spd, o) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = (0.3 + Math.random()) * (spd || 2);
      fx.particle(x, y, Math.cos(a) * s, Math.sin(a) * s, col, 18 + Math.random() * 18, Object.assign({ size: Math.random() < 0.3 ? 2 : 1 }, o));
    }
  };
  fx.spark = function (x, y, col, n) {
    for (let i = 0; i < (n || 6); i++) {
      const a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * 2.5;
      fx.particle(x, y, Math.cos(a) * s, Math.sin(a) * s, i % 2 ? '#ffffff' : col || '#ffe080', 8 + Math.random() * 8, { glow: true });
    }
  };
  fx.blood = function (x, y, dir, n, col) {
    for (let i = 0; i < (n || 8); i++)
      fx.particle(x, y, dir * (0.5 + Math.random() * 2.5), -Math.random() * 2.5, col || '#a01020', 22 + Math.random() * 16, { grav: 0.15, size: Math.random() < 0.3 ? 2 : 1 });
  };
  fx.dust = function (x, y, n) {
    for (let i = 0; i < n; i++) fx.particle(x + U.rnd(-6, 6), y - 1, U.rnd(-0.8, 0.8), U.rnd(-0.6, -0.1), '#8a8070', 18 + Math.random() * 10, { size: 2, drag: 0.92 });
  };
  fx.ring = function (x, y, col) {
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2;
      fx.particle(x, y, Math.cos(a) * 1.8, Math.sin(a) * 0.6, col, 16, { glow: true });
    }
  };
  fx.explode = function (x, y, scale) {
    scale = scale || 1;
    const cols = ['#fff6c0', '#ffc040', '#ff6020', '#a02010', '#402018'];
    for (let i = 0; i < 26 * scale; i++) {
      const a = Math.random() * Math.PI * 2, s = Math.random() * 3 * scale;
      fx.particle(x, y, Math.cos(a) * s, Math.sin(a) * s - 0.5, cols[Math.floor(Math.random() * cols.length)], 20 + Math.random() * 20, { size: Math.random() < 0.5 ? 2 : 3, glow: i % 3 === 0, drag: 0.93 });
    }
  };
  fx.debris = function (x, y, col, n) {
    for (let i = 0; i < (n || 10); i++)
      fx.particle(x + U.rnd(-6, 6), y + U.rnd(-6, 6), U.rnd(-2, 2), U.rnd(-3.5, -0.5), i % 2 ? col : U.shade(col, -0.3), 40 + Math.random() * 20, { grav: 0.22, size: 2 + (i % 2), drag: 0.99 });
  };
  fx.soul = function (x, y, tx, ty, col) {
    fx.particle(x, y, (tx - x) / 30, (ty - y) / 30 - 1, col || '#ff4060', 30, { glow: true, size: 2, drag: 1 });
  };

  // ---- damage numbers -------------------------------------------------------------------
  const DIG = {
    0: ['111', '101', '101', '101', '111'], 1: ['010', '110', '010', '010', '111'], 2: ['111', '001', '111', '100', '111'],
    3: ['111', '001', '011', '001', '111'], 4: ['101', '101', '111', '001', '001'], 5: ['111', '100', '111', '001', '111'],
    6: ['111', '100', '111', '101', '111'], 7: ['111', '001', '010', '010', '010'], 8: ['111', '101', '111', '101', '111'],
    9: ['111', '101', '111', '001', '111'], '+': ['000', '010', '111', '010', '000'], '!': ['010', '010', '010', '000', '010'],
  };
  function digitImg(ch, col) {
    return gfx.sprite('dig' + ch + col, 4, 6, (c) => {
      const rows = DIG[ch];
      if (!rows) return;
      c.fillStyle = col;
      for (let y = 0; y < 5; y++) for (let x = 0; x < 3; x++) if (rows[y][x] === '1') c.fillRect(x, y, 1, 1);
    }, { outline: '#100810', threshold: 1 });
  }
  fx.number = function (x, y, val, col, big) {
    if (G.settings && G.settings.dmgNumbers === false) return;
    nums.push({ x, y, s: String(val), col: col || '#ffffff', life: 46, vy: -1.4, big: !!big });
  };
  fx.text = function (x, y, str, col) {
    nums.push({ x, y, s: str, col: col || '#ffffff', life: 70, vy: -0.6, text: true });
  };

  // ---- slashes (follow the player) ---------------------------------------------------------
  fx.slash = function (owner, kind, col, yoff) {
    slashes.push({ owner, kind, col, yoff, t: 0, dur: kind === 'big' ? 10 : 7, facing: owner.facing });
  };

  fx.update = function () {
    for (const p of parts) {
      p.vx *= p.drag;
      p.vy = p.vy * p.drag + p.grav;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life--;
    }
    U.removeIf(parts, (p) => p.life <= 0);
    for (const n of nums) {
      n.y += n.vy;
      n.vy *= 0.92;
      n.life--;
    }
    U.removeIf(nums, (n) => n.life <= 0);
    for (const s of slashes) s.t++;
    U.removeIf(slashes, (s) => s.t >= s.dur);
  };

  fx.draw = function (ctx, camx, camy) {
    // particles
    for (const p of parts) {
      const a = Math.min(1, p.life / (p.max * 0.5));
      ctx.globalAlpha = a;
      if (p.glow) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = p.col;
        ctx.fillRect(Math.round(p.x - camx - p.size), Math.round(p.y - camy - p.size), p.size * 2 + 1, p.size * 2 + 1);
        ctx.globalCompositeOperation = 'source-over';
      } else {
        ctx.fillStyle = p.col;
        ctx.fillRect(Math.round(p.x - camx), Math.round(p.y - camy), p.size, p.size);
      }
    }
    ctx.globalAlpha = 1;
    // slashes
    for (const s of slashes) {
      const o = s.owner;
      G.drawSlash(ctx, o.cx - camx + o.facing * 4, o.fy - s.yoff - camy, o.facing, s.kind, s.t / s.dur, s.col);
    }
  };

  fx.drawNumbers = function (ctx, camx, camy) {
    for (const n of nums) {
      if (n.text) continue;
      const a = Math.min(1, n.life / 12);
      ctx.globalAlpha = a;
      let x = Math.round(n.x - camx - (n.s.length * 4) / 2), y = Math.round(n.y - camy);
      for (const ch of n.s) {
        const img = digitImg(ch, n.col);
        if (n.big) ctx.drawImage(img, x, y, 8, 12);
        else ctx.drawImage(img, x, y);
        x += n.big ? 8 : 4;
      }
    }
    ctx.globalAlpha = 1;
  };
  // texts are drawn in the UI layer for crisp letters
  fx.drawTexts = function (camx, camy) {
    for (const n of nums) {
      if (!n.text) continue;
      gfx.text(n.s, n.x - camx, n.y - camy, { size: 7, font: 'title', align: 'center', color: n.col, alpha: Math.min(1, n.life / 15) });
    }
  };
})();


/* ---- js/player_art.js ---- */
/* Elegy of the Night — player_art.js
 * Alucard as a procedural puppet: jointed limbs, silver hair and a cape
 * simulated with verlet physics, rendered to a small canvas each frame and
 * snapped to a palette with a dark outline so it reads as pixel art.
 * Also: bat, wolf and mist forms, weapon art and slash effects.
 */
(function () {
  'use strict';
  const root = typeof window !== 'undefined' ? window : globalThis;
  const G = (root.G = root.G || {});
  const U = G.util, gfx = G.gfx;

  const C = (G.ALU_COL = {
    skin: '#f4e2d6', skinS: '#cfae9e', hair: '#eef2f8', hairS: '#b4bed2', hairD: '#7e88a2',
    coat: '#1c1e30', coatH: '#3a4064', coatD: '#0e0f1a', gold: '#d4ac52', goldD: '#8a6a2a',
    white: '#ecebf4', pants: '#24263c', boot: '#2c1c1c', bootH: '#5a3a34',
    capeO: '#16121c', capeOH: '#2e2640', capeI: '#9a1426', capeIH: '#d0303e', eye: '#ff3048',
    steel: '#cfd6e6', steelD: '#6a7090', steelL: '#ffffff', hilt: '#8a6a2a', outline: '#07050b',
  });
  const BASE_PAL = Object.values(C).filter((c, i, a) => a.indexOf(c) === i && c !== C.outline);

  const CW = 128, CH = 84, AX = 64, AY = 76;

    if (!canvas) {
      canvas = gfx.makeCanvas(CW, CH, true);

  }

  // ---- Pose library ------------------------------------------------------------------
  const P = (a) => Object.assign({ hipX: 0, hipY: -21, lean: 0, head: 0, legF: [0, 0], legB: [0, 0], armF: [0.15, 0.25], armB: [-0.12, 0.3], rot: 0, coatFlare: 0 }, a);

  G.alucardPose = function (st, t, o) {
    o = o || {};
    switch (st) {
      case 'idle': {
        const b = Math.sin(t * 0.06);
        return P({ hipY: -21 + b * 0.4, lean: 0.02, legF: [0.12, 0.08], legB: [-0.16, 0.06], armF: [0.12 + b * 0.03, 0.35], armB: [-0.22, 0.4] });
      }
      case 'walk': {
        const ph = t * 0.16;
        const s = Math.sin(ph), c = Math.cos(ph);
        return P({
          hipY: -21 + Math.abs(c) * 0.9 - 0.6,
          lean: 0.07,
          legF: [s * 0.55, Math.max(0, -c) * 0.9 + 0.1],
          legB: [-s * 0.55, Math.max(0, c) * 0.9 + 0.1],
          armF: [-s * 0.4 + 0.05, 0.35],

      }
      case 'crouch':
        return P({ hipY: -12, lean: 0.25, legF: [1.25, 2.3], legB: [0.6, 2.25], armF: [0.6, 0.6], armB: [0.2, 0.6], coatFlare: 0.4 });
      case 'jump':
        return P({ hipY: -22, lean: 0.05, legF: [0.85, 1.35], legB: [0.1, 0.6], armF: [0.6, 0.9], armB: [-0.6, 0.4], coatFlare: 0.6 });
      case 'fall':
        return P({ hipY: -22, lean: -0.04, legF: [0.25, 0.25], legB: [-0.2, 0.35], armF: [0.9, 0.5], armB: [-0.9, 0.3], coatFlare: 0.8 });
      case 'flip': {
        const p = P({ hipY: -20, lean: 0.2, legF: [1.4, 2.2], legB: [1.1, 2.0], armF: [1.0, 1.2], armB: [0.6, 1.2], coatFlare: 0.6 });
        p.rot = o.rot || 0;

      }
      case 'backdash':
        return P({ hipY: -20, lean: 0.32, legF: [0.55, 0.5], legB: [-0.55, 0.2], armF: [-0.4, 0.5], armB: [-0.9, 0.3], coatFlare: 0.7 });
      case 'land':

      case 'guard':
        return P({ hipY: -20, lean: 0.12, legF: [0.4, 0.4], legB: [-0.35, 0.3], armF: [1.2, 1.4], armB: [-0.2, 0.5] });
      case 'attack': {
        // o.phase: 0..1 over windup, 1..2 active, 2..3 recover; o.wtype
        const ph = o.phase || 0, w = o.wtype || 'sword', crouch = o.crouch;
        const base = crouch ? { hipY: -12, lean: 0.3, legF: [1.25, 2.3], legB: [0.6, 2.25] } : { hipY: -21, lean: 0.12, legF: [0.5, 0.3], legB: [-0.45, 0.2] };
        let armF, armB = [-0.6, 0.5], lean = base.lean;
        if (w === 'great' || w === 'mace') {
          // overhead arc: windup raises arm high behind, active sweeps down-forward
          const a = ph < 1 ? U.lerp(0.4, 2.9, U.ease.out(ph)) : ph < 2 ? U.lerp(2.9, 0.9, U.ease.out(ph - 1)) : U.lerp(0.9, 0.7, ph - 2);
          armF = [a, 0.2];
          armB = [a - 0.4, 0.4];

        } else if (w === 'whip') {
          const a = ph < 1 ? U.lerp(0.5, 2.8, ph) : ph < 2 ? U.lerp(2.8, 1.45, U.ease.out(Math.min(1, (ph - 1) * 2))) : 1.45;
          armF = [a, 0.15];
          lean += ph < 1 ? -0.12 : 0.1;
        } else if (w === 'tome') {

          armB = [0.5, 1.6];
        } else if (w === 'fist') {
