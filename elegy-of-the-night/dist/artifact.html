    }
    return P({});
  };

  // ---- Weapon geometry used by both art and hitboxes --------------------------------
  function weaponAngle(pose) {
    // direction of the forearm
    const a1 = pose.armF[0], a2 = a1 + pose.armF[1];
    return a2;
  }

  // ---- Drawing --------------------------------------------------------------------------------
  function limb(x1, y1, x2, y2, w, col) {
    gfx.limb(ctx, x1, y1, x2, y2, w, col);
  }

  /* drawAlucard(pose, cape, hair, opts) → canvas with anchor (AX, AY)
   * cape/hair: arrays of {x,y} in LOCAL space (facing right, origin at feet). */
  G.drawAlucard = function (pose, cape, hair, opts) {
    ensure();
    opts = opts || {};
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, CW, CH);
    ctx.translate(AX, AY);
    if (pose.rot) {
      ctx.translate(0, -20);
      ctx.rotate(pose.rot);
      ctx.translate(0, 20);
    }
    const col = opts.col || C;
    const capeOuter = opts.capeCol || col.capeO, capeInner = opts.liningCol || col.capeI;

    const hx = pose.hipX, hy = pose.hipY, ln = pose.lean;
    const sl = Math.sin(ln), cl = Math.cos(ln);
    const neckX = hx + sl * 14, neckY = hy - cl * 14;
    const shX = hx + sl * 12.5, shY = hy - cl * 12.5;
    const headX = hx + sl * 18.5 + Math.sin(pose.head) * 1, headY = hy - cl * 18.5;

    // limb kinematics
    function legPts(l, off) {
      const kx = hx + off + Math.sin(l[0]) * 11, ky = hy + Math.cos(l[0]) * 11;
      const a2 = l[0] - l[1];
      const fx = kx + Math.sin(a2) * 11, fy = ky + Math.cos(a2) * 11;
      return [hx + off, hy, kx, ky, fx, fy];
    }
    function armPts(a, off) {
      const sx = shX + off, sy = shY;
      const ex = sx + Math.sin(a[0]) * 8, ey = sy + Math.cos(a[0]) * 8;
      const a2 = a[0] + a[1];
      const hx2 = ex + Math.sin(a2) * 7.5, hy2 = ey + Math.cos(a2) * 7.5;
      return [sx, sy, ex, ey, hx2, hy2, a2];
    }
    const LB = legPts(pose.legB, -1), LF = legPts(pose.legF, 1);
    const AB = armPts(pose.armB, -2), AF = armPts(pose.armF, 1);

    // ---- cape (behind everything) ----
    if (cape && cape.length > 2) {
      ctx.fillStyle = capeOuter;
      ctx.beginPath();
      ctx.moveTo(neckX + 1, neckY + 1);
      ctx.lineTo(shX - 3, shY);
      for (const p of cape) ctx.lineTo(p.x, p.y);
      const last = cape[cape.length - 1];
      ctx.lineTo(Math.min(last.x + 4, hx + 2), Math.max(last.y - 2, hy + 6));
      ctx.lineTo(hx - 2, hy + 2);
      ctx.closePath();
      ctx.fill();
      // red lining along the trailing edge
      ctx.strokeStyle = capeInner;
      ctx.lineWidth = 2.2;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(cape[1].x + 0.8, cape[1].y);
      for (let i = 2; i < cape.length; i++) ctx.lineTo(cape[i].x + 0.8, cape[i].y - 0.5);
      ctx.stroke();
      ctx.strokeStyle = col.capeOH;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(shX - 2, shY + 2);
      ctx.lineTo(cape[Math.min(3, cape.length - 1)].x + 3, cape[Math.min(3, cape.length - 1)].y);
      ctx.stroke();
    }
    // ---- hair (behind head) ----
    if (hair && hair.length > 1) {
      ctx.lineCap = 'round';
      for (let i = 0; i < hair.length - 1; i++) {
        const w = 5 - i * 1.0;
        limb(hair[i].x, hair[i].y, hair[i + 1].x, hair[i + 1].y, Math.max(1.4, w), i > 1 ? col.hairS : col.hair);
      }
    }
    // ---- back arm ----
    limb(AB[0], AB[1], AB[2], AB[3], 3.2, col.coatD);
    limb(AB[2], AB[3], AB[4], AB[5], 2.8, col.coatD);
    gfx.circle(ctx, AB[4], AB[5], 1.4, col.skinS);
    // ---- back leg ----
    limb(LB[0], LB[1], LB[2], LB[3], 4, col.pants);
    limb(LB[2], LB[3], LB[4], LB[5], 3.4, col.boot);
    ctx.fillStyle = col.boot;
    ctx.fillRect(LB[4] - 1.5, LB[5] - 2, 5, 2.4);
    // ---- coat tails ----
    const fl = pose.coatFlare || 0;
    ctx.fillStyle = col.coat;
    ctx.beginPath();
    ctx.moveTo(hx - 4, hy - 3);
    ctx.lineTo(hx + 4, hy - 3);
    ctx.lineTo(hx + 5 + fl * 2, hy + 9);
    ctx.lineTo(hx + 1, hy + 10);
    ctx.lineTo(hx - 3 - fl * 4, hy + 11 - fl * 2);
    ctx.lineTo(hx - 6 - fl * 3, hy + 8);
    ctx.closePath();
    ctx.fill();
    // ---- front leg ----
    limb(LF[0], LF[1], LF[2], LF[3], 4.2, col.pants);
    limb(LF[2], LF[3], LF[4], LF[5], 3.6, col.boot);
    limb(LF[2] + 0.5, LF[3] + 1, LF[4] + 0.5, LF[5] - 3, 1, col.bootH);
    ctx.fillStyle = col.boot;
    ctx.fillRect(LF[4] - 1.5, LF[5] - 2.2, 5.5, 2.6);
    // ---- torso ----
    ctx.fillStyle = col.coat;
    ctx.beginPath();
    ctx.moveTo(hx - 3.6, hy + 1);
    ctx.lineTo(hx + 3.8, hy + 1);
    ctx.lineTo(shX + 4.6, shY + 1);
    ctx.lineTo(neckX + 2, neckY);
    ctx.lineTo(neckX - 3, neckY);
    ctx.lineTo(shX - 4.6, shY + 1);
    ctx.closePath();
    ctx.fill();
    // lapel highlight & gold trim
    limb(hx + 3, hy, shX + 3.6, shY + 1.5, 1, col.coatH);
    limb(hx - 3.2, hy - 1, hx + 3.4, hy - 1, 1.6, col.gold);
    gfx.circle(ctx, hx + 1.5 + sl * 6, hy - cl * 6, 0.8, col.gold);
    gfx.circle(ctx, hx + 1.5 + sl * 9, hy - cl * 9, 0.8, col.gold);
    // cravat
    ctx.fillStyle = col.white;
    ctx.beginPath();
    ctx.moveTo(neckX - 0.5, neckY);
    ctx.lineTo(neckX + 2.4, neckY);
    ctx.lineTo(neckX + 1.5 + sl * 1, neckY + 5);
    ctx.lineTo(neckX - 0.2, neckY + 3.5);
    ctx.closePath();
    ctx.fill();
    // collar of the cape around the shoulders
    ctx.fillStyle = capeOuter;
    ctx.beginPath();
    ctx.moveTo(neckX - 4.5, neckY - 2.5);
    ctx.lineTo(neckX - 1, neckY - 1);
    ctx.lineTo(shX - 1, shY + 4);
    ctx.lineTo(shX - 6, shY + 3);
    ctx.closePath();
    ctx.fill();
    // ---- head ----
    gfx.ellipse(ctx, headX + 0.3, headY, 3.6, 4.4, 0, col.skin);
    // hair cap and fringe
    ctx.fillStyle = col.hair;
    ctx.beginPath();
    ctx.ellipse(headX - 0.8, headY - 1.8, 4.3, 3.6, -0.2, Math.PI * 0.9, Math.PI * 2.15);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(headX - 4.6, headY - 2);
    ctx.lineTo(headX - 2, headY - 3);
    ctx.lineTo(headX - 4.2, headY + 4.5);
    ctx.lineTo(headX - 5.2, headY + 3);
    ctx.closePath();
    ctx.fill();
    // fringe locks over the forehead
    ctx.fillStyle = col.hairS;
    ctx.fillRect(headX + 1.2, headY - 3.6, 2.6, 1.2);
    ctx.fillStyle = col.hair;
    ctx.fillRect(headX - 0.5, headY - 4.2, 3.8, 1.1);
    // eye & face shade
    ctx.fillStyle = opts.eyeCol || col.eye;
    ctx.fillRect(headX + 1.6, headY - 0.6, 1.2, 1);
    ctx.fillStyle = col.skinS;
    ctx.fillRect(headX + 2.6, headY + 2, 1, 1);
    // ---- weapon (behind front arm hand) ----
    const wp = opts.weapon;
    let tip = null;
    if (wp) tip = drawWeapon(wp, AF, pose, col);
    // ---- front arm ----
    limb(AF[0], AF[1], AF[2], AF[3], 3.4, col.coat);
    limb(AF[2], AF[3], AF[4], AF[5], 3, col.coat);
    limb(AF[0] + 0.6, AF[1], AF[2] + 0.6, AF[3], 1, col.coatH);
    // cuff + hand
    gfx.circle(ctx, AF[4], AF[5], 1.6, col.white);
    gfx.circle(ctx, AF[4] + Math.sin(AF[6]) * 1.2, AF[5] + Math.cos(AF[6]) * 1.2, 1.5, col.skin);
    if (opts.shield) drawShield(opts.shield, AF, col);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const pal = opts.extraPal ? BASE_PAL.concat(opts.extraPal) : BASE_PAL;
    gfx.pixelize(canvas, { palette: pal, outline: C.outline, threshold: 96 });
    canvas.anchorX = AX;
    canvas.anchorY = AY;
    return { canvas, hand: { x: AF[4], y: AF[5] }, tip };
  };

  function drawWeapon(wp, AF, pose, col) {
    const it = wp.item;
    const ang = wp.angle != null ? wp.angle : AF[6];
    const hx = AF[4], hy = AF[5];
    const dx = Math.sin(ang), dy = Math.cos(ang);
    const steel = it.col || col.steel;
    const w = it.wtype;
    if (w === 'sword' || w === 'short' || w === 'great' || w === 'rapier') {
      const L = it.len || 18;
      const bw = w === 'great' ? 3.6 : w === 'rapier' ? 1.4 : w === 'short' ? 2.2 : 2.6;
      const tx = hx + dx * L, ty = hy + dy * L;
      limb(hx, hy, tx, ty, bw, steel);
      limb(hx + dx * 2, hy + dy * 2, tx - dx * 2, ty - dy * 2, 1, U.shade(steel, 0.5));
      // guard
      limb(hx - dy * 3, hy + dx * 3, hx + dy * 3, hy - dx * 3, 1.6, col.gold);
      limb(hx, hy, hx - dx * 3, hy - dy * 3, 1.6, col.hilt);
      return { x: tx, y: ty };
    }
    if (w === 'mace') {
      const L = it.len || 16;
      const tx = hx + dx * L, ty = hy + dy * L;
      limb(hx - dx * 2, hy - dy * 2, tx, ty, 1.8, '#5a4a3a');
      gfx.circle(ctx, tx, ty, it.hands === 2 ? 4.5 : 3.6, steel);
      gfx.circle(ctx, tx - 1, ty - 1, 1.2, U.shade(steel, 0.4));
      return { x: tx, y: ty };
    }
    if (w === 'spear') {
      const L = it.len || 36;
      const tx = hx + dx * (L - 10), ty = hy + dy * (L - 10);
      limb(hx - dx * 10, hy - dy * 10, tx, ty, 1.6, '#6a4a2a');
      limb(tx, ty, tx + dx * 9, ty + dy * 9, 2.6, steel);
      limb(tx - dy * 3, ty + dx * 3, tx + dy * 3, ty - dx * 3, 2, steel);
      return { x: tx + dx * 9, y: ty + dy * 9 };
    }
    if (w === 'tome') {
      ctx.save();
      ctx.translate(hx + dx * 3, hy + dy * 3);
      ctx.rotate(-ang + Math.PI / 2);
      ctx.fillStyle = it.col;
      ctx.fillRect(-4, -3, 8, 6);
      ctx.fillStyle = '#efe6d0';
      ctx.fillRect(-3, -2, 6, 1);
      ctx.restore();
      return { x: hx + dx * 6, y: hy + dy * 6 };
    }
    if (w === 'whip') {
      // handle only; the lash is drawn in world space
      limb(hx, hy, hx + dx * 5, hy + dy * 5, 2, '#5a3a1a');
      return { x: hx + dx * 5, y: hy + dy * 5 };
    }
    if (w === 'fist') {
      gfx.circle(ctx, hx, hy, 2.2, it.col || col.skin);
      return { x: hx, y: hy };
    }
    return null;
  }

  function drawShield(it, AF, col) {
    const hx = AF[4], hy = AF[5];
    ctx.fillStyle = it.col;
    ctx.beginPath();
    ctx.moveTo(hx - 1, hy - 7);
    ctx.lineTo(hx + 4, hy - 6);
    ctx.lineTo(hx + 4, hy + 3);
    ctx.lineTo(hx + 1.5, hy + 7);
    ctx.lineTo(hx - 1, hy + 3);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = U.shade(it.col, 0.35);
    ctx.fillRect(hx + 0.5, hy - 5, 1, 9);
  }

  // ---- Other forms ------------------------------------------------------------------------
  G.drawBat = function (t, opts) {
    const f = Math.floor(t / 4) % 4;
    return gfx.sprite('alubat' + f, 32, 24, (c) => {
      const wingY = [-7, -3, 2, -3][f];
      c.translate(16, 12);
      c.fillStyle = '#1a1220';
      c.beginPath();
      c.moveTo(-2, -1);
      c.lineTo(-13, wingY);
      c.lineTo(-10, wingY + 3);
      c.lineTo(-7, wingY + 1);
      c.lineTo(-4, wingY + 4);
      c.lineTo(-1, 3);
      c.closePath();
      c.fill();
      c.beginPath();
      c.moveTo(2, -1);
      c.lineTo(13, wingY);
      c.lineTo(10, wingY + 3);
      c.lineTo(7, wingY + 1);
      c.lineTo(4, wingY + 4);
      c.lineTo(1, 3);
      c.closePath();
      c.fill();
      gfx.ellipse(c, 0, 1, 3.4, 4.2, 0, '#2a2236');
      c.fillStyle = '#2a2236';
      c.fillRect(-3, -4, 1.6, 2.4);
      c.fillRect(1.4, -4, 1.6, 2.4);
      c.fillStyle = '#ff3048';
      c.fillRect(-2, 0, 1.2, 1.2);
      c.fillRect(1, 0, 1.2, 1.2);
      c.strokeStyle = '#9a1426';
      c.lineWidth = 0.8;
      c.beginPath();
      c.moveTo(-12, wingY + 0.5);
      c.lineTo(-3, 2);
      c.moveTo(12, wingY + 0.5);
      c.lineTo(3, 2);
      c.stroke();
    }, { outline: '#07050b', palette: ['#1a1220', '#2a2236', '#ff3048', '#9a1426'] });
  };

  G.drawWolf = function (t, moving, opts) {
    const f = moving ? Math.floor(t / 4) % 6 : 6 + (Math.floor(t / 20) % 2);
    return gfx.sprite('aluwolf' + f, 48, 32, (c) => {
      c.translate(24, 26);
      const run = f < 6;
      const ph = (f / 6) * Math.PI * 2;
      const body = run ? Math.sin(ph) * 1.2 : Math.sin(f) * 0.3;
      const fur = '#c8ccd8', furS = '#7e869e', furD = '#4a4e62';
      // tail
      c.strokeStyle = furS;
      c.lineWidth = 3.5;
      c.lineCap = 'round';
      c.beginPath();
      c.moveTo(-10, -10 + body);
      c.quadraticCurveTo(-17, -12 + body, -20, -7 - (run ? Math.sin(ph * 2) * 2 : 0));
      c.stroke();
      // legs
      const legs = run
        ? [[-7, Math.sin(ph) * 5], [-4, Math.sin(ph + 1) * 5], [6, Math.sin(ph + Math.PI) * 5], [9, Math.sin(ph + Math.PI + 1) * 5]]
        : [[-7, 0], [-4, 0], [6, 0], [9, 0]];
      legs.forEach(([x, s], i) => {
        gfx.limb(c, x, -6 + body, x + s, 0, 2.6, i % 2 ? fur : furS);
      });
      // body
      gfx.ellipse(c, 0, -9 + body, 11.5, 5.2, 0, fur);
      gfx.ellipse(c, -1, -7.5 + body, 9.5, 3, 0, furS);
      gfx.ellipse(c, 3, -11 + body, 6, 3.6, -0.2, '#e8ecf4');
      // head
      c.fillStyle = fur;
      c.beginPath();
      c.moveTo(9, -14 + body);
      c.lineTo(15, -13 + body);
      c.lineTo(20, -10 + body);
      c.lineTo(19, -8 + body);
      c.lineTo(12, -7 + body);
      c.closePath();
      c.fill();
      c.fillStyle = furS;
      c.beginPath();
      c.moveTo(10, -14 + body);
      c.lineTo(12, -19 + body);
      c.lineTo(14, -14 + body);
      c.fill();
      c.fillStyle = '#ff3048';
      c.fillRect(15, -12 + body, 1.4, 1.2);
      c.fillStyle = furD;
      c.fillRect(19, -10 + body, 1.5, 1.2);
    }, { outline: '#07050b', palette: ['#c8ccd8', '#7e869e', '#4a4e62', '#e8ecf4', '#ff3048'] });
  };

  // Mist is drawn with particles each frame (see player.js)
  G.drawMist = function (bctx, x, y, t) {
    for (let i = 0; i < 14; i++) {
      const a = t * 0.05 + i * 0.9;
      const r = 6 + (i % 4) * 3;
      const px = x + Math.cos(a) * r * 0.9, py = y - 8 + Math.sin(a * 1.3) * r * 0.5;
      bctx.globalAlpha = 0.18 + (i % 3) * 0.06;
      bctx.fillStyle = i % 2 ? '#c8d0e8' : '#8a96b8';
      bctx.beginPath();
      bctx.arc(px, py, 4 + (i % 3), 0, Math.PI * 2);
      bctx.fill();
    }
    bctx.globalAlpha = 1;
    bctx.fillStyle = '#ff3048';
    bctx.fillRect(Math.round(x - 2), Math.round(y - 9), 1, 1);
    bctx.fillRect(Math.round(x + 1), Math.round(y - 9), 1, 1);
  };

  // ---- Slash arcs (world space, additive) ----------------------------------------------
  G.drawSlash = function (bctx, sx, sy, facing, kind, t, col) {
    // t: 0..1 progress of the fade
    bctx.save();
    bctx.globalCompositeOperation = 'lighter';
    bctx.globalAlpha = (1 - t) * 0.85;
    bctx.translate(sx, sy);
    bctx.scale(facing, 1);
    const c = col || '#cfe0ff';
    if (kind === 'thrust') {
      const len = 30 + t * 6;
      const g = bctx.createLinearGradient(0, 0, len, 0);
      g.addColorStop(0, U.rgba(c, 0));
      g.addColorStop(0.6, U.rgba(c, 0.7));
      g.addColorStop(1, U.rgba('#ffffff', 0.95));
      bctx.fillStyle = g;
      bctx.beginPath();
      bctx.moveTo(4, -2.5);
      bctx.lineTo(len, -0.5);
      bctx.lineTo(len, 0.5);
      bctx.lineTo(4, 2.5);
      bctx.fill();
    } else {
      // crescent
      const r = kind === 'big' ? 34 : 26;
      bctx.strokeStyle = U.rgba(c, 0.9);
      bctx.lineWidth = kind === 'big' ? 5 : 3.5;
      bctx.beginPath();
      bctx.arc(0, 0, r, -1.6 + t * 0.2, 0.8 + t * 0.2);
      bctx.stroke();
      bctx.strokeStyle = 'rgba(255,255,255,0.9)';
      bctx.lineWidth = 1.2;
      bctx.beginPath();
      bctx.arc(0, 0, r + 1, -1.3 + t * 0.2, 0.6 + t * 0.2);
      bctx.stroke();
    }
    bctx.restore();
  };

  // Whip lash in world space: segments from the hand outward
  G.drawWhip = function (bctx, hx, hy, facing, ext, t, col, glow) {
    const n = 18;
    const L = ext;
    let px = hx, py = hy;
    for (let i = 1; i <= n; i++) {
      const f = i / n;
      const x = hx + facing * L * f;
      const y = hy + Math.sin(f * Math.PI * 1.5 + t * 0.9) * (1 - f) * 3 + f * 1.5;
      bctx.fillStyle = i % 2 ? col : U.shade(col, -0.35);
      const s = i > n - 2 ? 3 : 2;
      bctx.fillRect(Math.round(x - 1), Math.round(y - 1), s, s);
      px = x;
      py = y;
    }
    if (glow) {
      bctx.save();
      bctx.globalCompositeOperation = 'lighter';
      bctx.fillStyle = U.rgba(glow, 0.6);
      bctx.fillRect(Math.round(px - 2), Math.round(py - 2), 4, 4);
      bctx.restore();
    }
    return { x: px, y: py };
  };
})();


/* ---- js/player.js ---- */
/* Elegy of the Night — player.js
 * Alucard: movement (walk, crouch, variable jump, double jump, super jump,
 * dive kick, backdash), two-handed equipment attacks, shields, sub-weapons
 * (Up + Attack), command-input spells, bat / mist / wolf forms, damage,
 * status effects, cape & hair physics and drawing.
 */
(function () {
  'use strict';
  const root = typeof window !== 'undefined' ? window : globalThis;
  const G = (root.G = root.G || {});
  const U = G.util, P = G.phys, I = G.input;

  const WALK = 2.0, JUMP = 6.75, DJUMP = 5.8, GRAV = 0.3;
  const HUM_W = 12, HUM_H = 40, CROUCH_H = 26;
  const FORMS = {
    human: { w: HUM_W, h: HUM_H },
    bat: { w: 14, h: 12 },
    mist: { w: 16, h: 16 },
    wolf: { w: 24, h: 14 },
  };

  function Player(game, x, y) {
    this.g = game;
    this.x = x - HUM_W / 2;
    this.y = y - HUM_H;
    this.w = HUM_W;
    this.h = HUM_H;
    this.vx = 0;
    this.vy = 0;
    this.facing = 1;
    this.onGround = false;
    this.form = 'human';
    this.crouch = false;
    this.atk = null;
    this.inv = 0;
    this.hurtT = 0;
    this.dashT = 0;
    this.airJumps = 0;
    this.flipT = 0;
    this.superT = 0;
    this.diveT = 0;
    this.landT = 0;
    this.castT = 0;
    this.ramT = 0;
    this.coyote = 0;
    this.jumpBuf = 0;
    this.dropT = 0;
    this.dead = false;
    this.deadT = 0;
    this.locked = false; // cutscenes
    this.t = 0;
    this.walkT = 0;
    this.mpT = 0;
    this.poisonT = 0;
    this.buffs = { darkMeta: 0 };
    this.boxes = [];
    this.guarding = false;
    this.afterImgs = [];
    this.lastPose = null;
    this.mist = false;
    this.refreshStats();
    this.resetCape();
  }
  G.Player = Player;
  const PR = Player.prototype;

  Object.defineProperty(PR, 'cx', { get() { return this.x + this.w / 2; } });
  Object.defineProperty(PR, 'cy', { get() { return this.y + this.h / 2; } });
  Object.defineProperty(PR, 'fy', { get() { return this.y + this.h; } });

  PR.refreshStats = function () {
    const s = G.state;
    this.st = G.calcStats(s, this.buffs.darkMeta > 0 ? { atk: 0 } : null);
    s.hp = Math.min(s.hp, this.st.hpMax);
    s.mp = Math.min(s.mp, this.st.mpMax);
    s.hearts = Math.min(s.hearts, this.st.heartsMax);
  };

  PR.hurtbox = function () {
    return { x: this.x + 1, y: this.y + 2, w: this.w - 2, h: this.h - 3 };
  };

  // ---- cape & hair ----------------------------------------------------------------------
  PR.resetCape = function () {
    const fx = this.cx, fy = this.fy;
    this.cape = [];
    for (let i = 0; i < 7; i++) {
      const x = fx - this.facing * (4 + i * 0.5), y = fy - 33 + i * 5;
      this.cape.push({ x, y, px: x, py: y });
    }
    this.hair = [];
    for (let i = 0; i < 4; i++) {
      const x = fx - this.facing * (3 + i * 2), y = fy - 41 + i * 3;
      this.hair.push({ x, y, px: x, py: y });
    }
  };
  function simChain(pts, ax, ay, seg, grav, windX, windY, floorY, damp) {
    pts[0].x = ax;
    pts[0].y = ay;
    pts[0].px = ax;
    pts[0].py = ay;
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i];
      const vx = (p.x - p.px) * damp, vy = (p.y - p.py) * damp;
      p.px = p.x;
      p.py = p.y;
      p.x += vx + windX * (i / pts.length);
      p.y += vy + grav + windY * (i / pts.length);
    }
    for (let k = 0; k < 4; k++) {
      for (let i = 1; i < pts.length; i++) {
        const a = pts[i - 1], b = pts[i];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.001;
        const diff = (d - seg) / d;
        if (i === 1) {
          b.x -= dx * diff;
          b.y -= dy * diff;
        } else {
          a.x += dx * diff * 0.5;
          a.y += dy * diff * 0.5;
          b.x -= dx * diff * 0.5;
          b.y -= dy * diff * 0.5;
        }
      }
      pts[0].x = ax;
      pts[0].y = ay;
      for (let i = 1; i < pts.length; i++) if (pts[i].y > floorY) pts[i].y = floorY;
    }
  }
  PR.simCape = function () {
    const f = this.facing, fx = this.cx, fy = this.fy;
    const pose = this.lastPose;
    const crouch = this.crouch || (pose && pose.hipY > -16);
    const ln = pose ? pose.lean : 0;
    const shY = (pose ? pose.hipY : -21) - Math.cos(ln) * 12.5;
    const shX = (pose ? pose.hipX : 0) + Math.sin(ln) * 12.5 - 3;
    const ax = fx + shX * f, ay = fy + shY;
    // keep the cape behind: a gentle push backwards + motion wind
    const windX = -f * 0.18 - this.vx * 0.22;
    const windY = this.vy > 0 ? -this.vy * 0.16 : -this.vy * 0.05;
    simChain(this.cape, ax, ay, crouch ? 3.6 : 5, 0.26, windX, windY, fy - 1, 0.88);
    // never in front of the body
    for (let i = 1; i < this.cape.length; i++) {
      const p = this.cape[i];
      const local = (p.x - fx) * f;
      if (local > 2 - i * 0.2) p.x = fx + (2 - i * 0.2) * f;
    }
    const hx = fx + ((pose ? pose.hipX + Math.sin(ln) * 18.5 : 0) - 3) * f;
    const hy = fy + (pose ? pose.hipY - Math.cos(ln) * 18.5 : -39.5) - 1;
    simChain(this.hair, hx, hy, 3.4, 0.16, -f * 0.12 - this.vx * 0.12, this.vy > 0 ? -this.vy * 0.1 : 0, fy - 4, 0.8);
  };

  // ---- form changes --------------------------------------------------------------------
  PR.canFit = function (w, h, cx, fy, mist) {
    return !P.rectSolid(this.g.room, cx - w / 2, fy - h, w, h, { mist });
  };
  PR.setForm = function (f, silent) {
    const s = G.state;
    if (f === this.form) return true;
    const dim = FORMS[f];
    const cx = this.cx;
    let fy = this.fy;
    if (f === 'bat' || f === 'mist') fy = this.cy + dim.h / 2;
    if (!this.canFit(dim.w, dim.h, cx, fy, f === 'mist')) {
      // try aligning feet instead
      fy = this.fy;
      if (!this.canFit(dim.w, dim.h, cx, fy, f === 'mist')) return false;
    }
    if (f !== 'human' && !silent) {
      const cost = f === 'wolf' && this.st.flags.wolfBoost ? 0 : 3;
      if (s.mp < cost) {
        G.audio.sfx('menu_error');
        return false;
      }
      s.mp -= cost;
    }
    this.form = f;
    this.w = dim.w;
    this.h = dim.h;
    this.x = cx - dim.w / 2;
    this.y = fy - dim.h;
    this.crouch = false;
    this.atk = null;
    this.guarding = false;
    this.mist = f === 'mist';
    this.noOneWay = f === 'bat' || f === 'mist';
    this.vy = Math.min(this.vy, 0);
    this.ramT = 0;
    if (!silent) {
      G.audio.sfx('transform');
      G.fx.burst(this.cx, this.cy, f === 'mist' ? '#c8d0e8' : '#8a2030', 14, 2.2);
      if (f === 'wolf') G.audio.sfx('wolf_howl', { vol: 0.6 });
    }
    if (f === 'human') this.resetCape();
    return true;
  };

  // ---- damage ---------------------------------------------------------------------------
  /* hurt(raw, el, srcX, o) o: {status, chance, magic, unblockable, projectile}
   * returns 'blocked' | 'hit' | 'ignored' */
  PR.hurt = function (raw, el, srcX, o) {
    o = o || {};
    const s = G.state;
    if (this.dead || this.locked) return 'ignored';
    if (this.inv > 0 && !o.force) return 'ignored';
    if (this.form === 'mist' && !o.magic) return 'ignored';
    if (G.DEBUG_GOD) return 'ignored';
    const fromFront = srcX == null || (srcX - this.cx) * this.facing > 0;
    let dmg = raw;
    if (this.guarding && fromFront && !o.unblockable) {
      const sh = G.ITEMS[this.guardItem];
      dmg = Math.round(dmg * (1 - (sh ? sh.guard : 0.5)));
      G.audio.sfx('block');
      G.fx.spark(this.cx + this.facing * 8, this.cy - 4, '#ffffff', 6);
      this.vx = -this.facing * 1.5;
      if (dmg <= 0 || o.projectile) {
        this.inv = 12;
        return 'blocked';
      }
    }
    const res = this.st.res[el] || 0;
    dmg = Math.max(1, Math.round((dmg - this.st.def / 2) * (1 - res)));
    if (G.diffMul) dmg = Math.max(1, Math.round(dmg * G.diffMul));
    s.hp -= dmg;
    G.fx.number(this.cx, this.y - 4, dmg, '#ff5060');
    G.audio.sfx('player_hurt');
    G.gfx.shake(3, 10);
    if (o.status && !this.st.immune[o.status] && Math.random() < (o.chance == null ? 1 : o.chance)) {
      s.status[o.status] = o.status === 'poison' ? 1800 : 600;
      G.audio.sfx(o.status === 'poison' ? 'status_poison' : 'status_curse');
    }
    this.inv = 75;
    if (s.hp <= 0) {
      s.hp = 0;
      if (G.invCount(s, 'life_apple') > 0) {
        G.invRemove(s, 'life_apple');
        s.hp = Math.ceil(this.st.hpMax / 2);
        G.audio.sfx('heal');
        G.fx.burst(this.cx, this.cy, '#ffd040', 30, 3);
        G.ui.notify(G.tr(G.ITEMS.life_apple.name) + '!', '#ffd040');
        this.inv = 120;
        return 'hit';
      }
      this.die();
      return 'hit';
    }
    if (this.form === 'human') {
      this.atk = null;
      this.guarding = false;
      this.hurtT = 22;
      this.crouch = false;
      this.setHeight(HUM_H);
      this.vx = (srcX != null && srcX > this.cx ? -1 : 1) * 2.2;
      this.vy = -3.2;
      this.onGround = false;
      this.dashT = 0;
      this.superT = 0;
      this.diveT = 0;
    } else {
      this.vx = (srcX != null && srcX > this.cx ? -1 : 1) * 2.5;
      this.hurtT = 12;
    }
    return 'hit';
  };

  PR.die = function () {
    if (this.dead) return;
    if (this.form !== 'human') this.setForm('human', true);
    this.dead = true;
    this.deadT = 0;
    this.atk = null;
    this.vx = -this.facing * 1.5;
    this.vy = -3;
    G.audio.sfx('player_die');
    G.audio.stopMusic(2);
    G.state.deaths = (G.state.deaths || 0) + 1;
  };

  PR.heal = function (n, silent) {
    const s = G.state;
    const before = s.hp;
    s.hp = Math.min(this.st.hpMax, s.hp + n);
    if (!silent && s.hp > before) G.fx.number(this.cx, this.y - 4, s.hp - before, '#60ff90');
  };

  PR.setHeight = function (h) {
    if (this.h === h) return true;
    const fy = this.fy;
    if (h > this.h && P.rectSolid(this.g.room, this.x, fy - h, this.w, h - this.h + 1)) return false;
    this.y = fy - h;
    this.h = h;
    return true;
  };

  // ---- main update ------------------------------------------------------------------------
  PR.update = function () {
    const g = this.g, s = G.state;
    this.t++;
    this.boxes.length = 0;
    if (this.inv > 0) this.inv--;
    if (this.landT > 0) this.landT--;
    if (this.dropT > 0) this.dropT--;
    if (this.castT > 0) this.castT--;
    if (this.buffs.darkMeta > 0) {
      this.buffs.darkMeta--;
      if (this.t % 6 === 0) G.fx.particle(this.cx + U.rnd(-6, 6), this.cy + U.rnd(-10, 10), 0, -0.6, '#c02040', 30);
    }

    if (this.dead) {
      this.deadT++;
      this.vx *= 0.94;
      this.vy = Math.min(this.vy + GRAV, 7);
      P.move(this, g.room);
      this.simCape();
      return;
    }

    // MP regeneration & status
    this.mpT += 1 + this.st.mpRegen * 0.8 + this.st.int * 0.02;
    if (this.mpT >= 48) {
      this.mpT = 0;
      if (this.form === 'bat') s.mp = Math.max(0, s.mp - 1);
      else if (this.form !== 'mist') s.mp = Math.min(this.st.mpMax, s.mp + 1);
    }
    if (this.form === 'mist' && this.t % 10 === 0) s.mp = Math.max(0, s.mp - 1);
    if (s.status.poison > 0) {
      s.status.poison--;
      if (++this.poisonT >= 100) {
        this.poisonT = 0;
        if (s.hp > 1) s.hp--;
      }
      if (s.status.poison === 0) this.refreshStats();
    }
    if (s.status.curse > 0) s.status.curse--;

    if (this.locked) {
      this.vx = 0;
      this.atk = null;
      this.vy = Math.min(this.vy + GRAV, 7);
      if (this.form !== 'human') this.vy = 0;
      P.move(this, g.room);
      this.simCape();
      return;
    }

    // form toggles
    if (I.pressed.bat && G.hasRelic(s, 'soul_bat')) this.toggleForm('bat');
    else if (I.pressed.mist && G.hasRelic(s, 'form_mist')) this.toggleForm('mist');
    else if (I.pressed.wolf && G.hasRelic(s, 'soul_wolf')) this.toggleForm('wolf');
    if ((this.form === 'bat' || this.form === 'mist') && s.mp <= 0) {
      if (!this.setForm('human', true)) this.vy = 0;
      else G.audio.sfx('transform');
    }

    if (this.form === 'bat') this.updateBat();
    else if (this.form === 'mist') this.updateMist();
    else if (this.form === 'wolf') this.updateWolf();
    else this.updateHuman();

    // spikes
    if (this.touchSpikes && this.inv <= 0) this.hurt(Math.max(8, Math.round(this.st.hpMax * 0.08)), 'cut', this.cx - this.facing * 4, { force: false });

    this.simCape();
    // afterimages
    if ((this.dashT > 0 || this.superT > 0 || (this.form === 'wolf' && Math.abs(this.vx) > 3.2) || this.ramT > 0) && this.t % 3 === 0 && this.lastSprite) {
      this.pushAfterImage();
    }
    for (const a of this.afterImgs) a.life--;
    U.removeIf(this.afterImgs, (a) => a.life <= 0);
  };

  PR.toggleForm = function (f) {
    if (this.form === f) {
      if (!this.setForm('human')) G.audio.sfx('menu_error');
      return;
    }
    if (this.form !== 'human' && !this.setForm('human', true)) return;
    if (!this.setForm(f) && this.form === 'human') {
      /* stays human */
    }
  };

  PR.updateHuman = function () {
    const g = this.g, s = G.state, room = g.room;
    const dir = (I.held.right ? 1 : 0) - (I.held.left ? 1 : 0);
    const cursed = s.status.curse > 0;
    if (this.hurtT > 0) {
      this.hurtT--;
      this.vy = Math.min(this.vy + GRAV, 7);
      P.move(this, room);
      this.afterMove(false);
      return;
    }
    if (I.pressed.jump) this.jumpBuf = 7;
    else if (this.jumpBuf > 0) this.jumpBuf--;
    if (this.onGround) {
      this.coyote = 6;
      this.airJumps = 0;
    } else if (this.coyote > 0) this.coyote--;

    // ---- attacks / sub-weapons / spells ----
    const a1 = I.pressed.attack, a2 = I.pressed.attack2;
    const canStart = !this.atk || this.atk.t >= this.atk.wind + this.atk.act;
    if ((a1 || a2) && canStart && !cursed) {
      const sp = this.findSpell();
      if (sp && a1) this.castSpell(sp);
      else if (a1 && I.held.up && s.sub) this.useSub();
      else this.startAttack(a1 ? 'rhand' : 'lhand');
    } else if (I.pressed.sub && s.sub && !cursed && canStart) this.useSub();

    // shield guard (held)
    this.guarding = false;
    if (!this.atk && this.onGround) {
      for (const [hand, act] of [['lhand', 'attack2'], ['rhand', 'attack']]) {
        const it = s.equip[hand] && G.ITEMS[s.equip[hand]];
        if (it && it.kind === 'shield' && I.held[act]) {
          this.guarding = true;
          this.guardItem = it.id;
        }
      }
    }

    // ---- crouch ----
    const wantCrouch = this.onGround && I.held.down && !this.dashT && !this.diveT;
    if (wantCrouch && !this.crouch && !(this.atk && !this.atk.crouch)) {
      this.crouch = true;
      this.setHeight(CROUCH_H);
    } else if (!wantCrouch && this.crouch && !(this.atk && this.atk.crouch)) {
      if (this.setHeight(HUM_H)) this.crouch = false;
    }

    // ---- backdash ----
    if (I.pressed.backdash && this.onGround && !this.dashT && (!this.atk || this.atk.t >= this.atk.wind + this.atk.act) && !this.crouch) {
      this.atk = null;
      this.dashT = 18;
      this.vx = -this.facing * 5.2;
      this.inv = Math.max(this.inv, 6);
      G.audio.sfx('backdash');
      G.fx.dust(this.cx, this.fy, 4);
    }

    // ---- horizontal ----
    let spd = WALK * (this.inWater ? 0.6 : 1);
    if (this.dashT > 0) {
      this.dashT--;
      if (this.dashT < 10) this.vx *= 0.86;
      if (!this.onGround && this.dashT < 12) this.vx *= 0.9;
    } else if (this.diveT > 0) {
      // keep dive velocity
    } else if (this.atk && this.onGround) {
      this.vx = 0;
    } else if (this.crouch || this.guarding) {
      this.vx = 0;
      if (dir && !this.atk) this.facing = dir;
    } else {
      this.vx = dir * spd;
      if (dir && (!this.atk || !this.onGround) && !(this.atk && !this.onGround)) this.facing = dir;
    }
    if (this.vx !== 0 && this.onGround && !this.atk && !this.dashT) this.walkT += Math.abs(this.vx) / WALK;

    // ---- jumping ----
    const onPlatform = this.onGround && this.standingOnOneWay();
    if (this.jumpBuf > 0 && !this.atk) {
      if ((this.onGround || this.coyote > 0) && I.held.down && onPlatform) {
        this.dropT = 14;
        this.y += 2;
        this.onGround = false;
        this.jumpBuf = 0;
        this.crouch = false;
        this.setHeight(HUM_H);
      } else if (G.hasRelic(s, 'gravity_boots') && (this.onGround || this.coyote > 0 || this.airJumps < 2) && I.matchMotion(['d', 'u'], this.facing, 24) && I.held.up) {
        this.superT = 40;
        this.vy = -10.5;
        this.onGround = false;
        this.coyote = 0;
        this.jumpBuf = 0;
        this.crouch = false;
        this.setHeight(HUM_H);
        G.audio.sfx('super_jump');
        G.fx.burst(this.cx, this.fy, '#ffd080', 10, 2);
        I.clearMotion();
      } else if (this.onGround || this.coyote > 0) {
        if (this.crouch) {
          this.crouch = false;
          this.setHeight(HUM_H);
        }
        this.vy = -JUMP * (this.inWater ? 0.8 : 1);
        this.onGround = false;
        this.coyote = 0;
        this.jumpBuf = 0;
        this.dashT = Math.min(this.dashT, 4);
        G.audio.sfx('jump', { vol: 0.6 });
      } else if (I.held.down && !this.diveT) {
        // dive kick
        this.diveT = 1;
        this.vx = this.facing * 4.2;
        this.vy = 5.5;
        this.jumpBuf = 0;
        this.superT = 0;
        G.audio.sfx('wolf_dash', { vol: 0.5 });
      } else if (G.hasRelic(s, 'leap_stone') && this.airJumps < 1 && !this.superT) {
        this.airJumps++;
        this.vy = -DJUMP;
        this.flipT = 24;
        this.jumpBuf = 0;
        this.diveT = 0;
        G.audio.sfx('double_jump');
        G.fx.ring(this.cx, this.fy, '#9ad0ff');
      }
    }

    // ---- gravity ----
    if (this.superT > 0) {
      this.superT--;
      this.vy = Math.min(this.vy, -9.5 + (40 - this.superT) * 0.05);
      if (!I.held.jump && this.superT < 32) this.superT = 0;
      if (this.t % 2 === 0) G.fx.particle(this.cx + U.rnd(-3, 3), this.fy, 0, 1, '#ffd080', 14);
    } else {
      let gmul = 1;
      if (this.vy < 0 && !I.held.jump && !this.flipT) gmul = 2.3;
      if (this.inWater) gmul *= 0.55;
      this.vy = Math.min(this.vy + GRAV * gmul, this.inWater ? 3.5 : 7);
    }
    if (this.flipT > 0) this.flipT--;

    P.move(this, room);
    if (this.hitCeil) this.superT = 0;
    this.afterMove(true);
    this.updateAttack();
  };

  PR.standingOnOneWay = function () {
    const room = this.g.room;
    const ty = Math.floor((this.fy + 1) / 16);
    const t1 = room.get(Math.floor((this.x + 1) / 16), ty), t2 = room.get(Math.floor((this.x + this.w - 1) / 16), ty);
    const ok = (t) => t === G.T.ONEWAY || t === G.T.EMPTY;
    return (t1 === G.T.ONEWAY || t2 === G.T.ONEWAY) && ok(t1) && ok(t2);
  };

  PR.afterMove = function (control) {
    if (this.onGround) {
      if (this.landV > 3.2) {
        this.landT = 6;
        G.audio.sfx('land', { vol: 0.5 });
        G.fx.dust(this.cx, this.fy, this.landV > 6 ? 6 : 3);
      }
      this.landV = 0;
      this.flipT = 0;
      this.superT = 0;
      if (this.diveT) {
        this.diveT = 0;
        this.vx = 0;
        G.gfx.shake(2, 6);
        G.fx.dust(this.cx, this.fy, 6);
      }
      if (this.atk && this.atk.air && !this.atk.keepOnLand) this.atk = null;
    }
    if (this.diveT) this.boxes.push({ x: this.cx - 8 + this.facing * 4, y: this.fy - 10, w: 16, h: 12, dmg: this.st.atkR + 4, el: 'hit', id: 'dive' + Math.floor(this.t / 20), dive: true });
  };

  // ---- attacks -------------------------------------------------------------------------------
  PR.weaponFor = function (hand) {
    const s = G.state;
    let id = s.equip[hand];
    let it = id ? G.ITEMS[id] : null;
    if (!it) {
      // two-handed weapon held in the other hand?
      const o = s.equip[hand === 'rhand' ? 'lhand' : 'rhand'];
      const oi = o && G.ITEMS[o];
      if (oi && oi.hands === 2) return oi;
      return G.ITEMS.fist;
    }
    return it;
  };

  PR.startAttack = function (hand) {
    const it = this.weaponFor(hand);
    if (it.kind === 'shield') return; // guarding handled separately
    if (this.dashT > 6) this.dashT = 0;
    const air = !this.onGround;
    this.atk = {
      hand, item: it, wt: it.wtype, t: 0, wind: it.wind, act: it.act, rec: it.rec, id: 'a' + U.uid(),
      crouch: this.crouch, air, fired: false, slashed: false,
    };
    if (it.hpCost) {
      G.state.hp = Math.max(1, G.state.hp - it.hpCost);
    }
  };

  PR.updateAttack = function () {
    const a = this.atk;
    if (!a) return;
    a.t++;
    const it = a.item, f = this.facing;
    const fx = this.cx, fy = this.fy;
    const actStart = a.wind, actEnd = a.wind + a.act;
    if (a.t === actStart) {
      const w = a.wt;
      if (w === 'whip') G.audio.sfx('whip');
      else if (w === 'great' || w === 'mace' || w === 'spear') G.audio.sfx('swing_heavy');
      else if (w === 'fist') G.audio.sfx('punch', { vol: 0.7 });
      else if (w !== 'tome') G.audio.sfx('swing_light', { pitch: U.rnd(0.95, 1.08) });
      if (w === 'tome' && !a.fired) {
        a.fired = true;
        G.audio.sfx('magic_cast', { vol: 0.6 });
        G.spawnPlayerProj(it.proj, fx + f * 10, fy - (a.crouch ? 16 : 30), f, this.attackPower(a.hand), it.el);
      }
      if (w !== 'whip' && w !== 'tome') {
        const kind = w === 'great' || w === 'mace' ? 'big' : w === 'spear' || w === 'rapier' || w === 'short' || w === 'fist' ? 'thrust' : 'arc';

      const box = this.attackBox(a);

  };

  PR.attackPower = function (hand) {
    const st = this.st;
    return hand === 'lhand' ? st.atkL : st.atkR;
  };

  PR.attackBox = function (a) {
    const it = a.item, f = this.facing, fx = this.cx, fy = this.fy;
    const dmg = this.attackPower(a.hand);
    const base = { dmg, el: it.el || 'hit', id: a.id, status: it.status, drain: it.drain, item: it };
    const reach = it.reach || 20, hh = it.hh || 10;
    let b;
    switch (a.wt) {
      case 'tome':
        return null;
      case 'great':
      case 'mace':
        b = { x: f > 0 ? fx - 4 : fx + 4 - reach, y: fy - (a.crouch ? 34 : 52), w: reach, h: hh + 6 };
        break;
      case 'whip': {
        const prog = Math.min(1, (a.t - a.wind + 1) / 3);
        const L = reach * prog;

        break;

  // ---- sub-weapons & spells -------------------------------------------------------------------

    if (s.sub === 'stopwatch' && this.st.flags.watchDiscount) cost = Math.ceil(cost / 2);

  };

  PR.findSpell = function () {

      const sp = G.SPELLS[id];
      if (!sp.known && !s.spells[id]) continue;

  PR.castSpell = function (id) {

      G.ui.notify(G.t('mp') + ' ✕', '#8090ff');

    s.flags['cast_' + id] = 1;

  // ---- other forms ---------------------------------------------------------------------------------
  PR.updateBat = function () {
    const room = this.g.room, s = G.state;
    const dx = (I.held.right ? 1 : 0) - (I.held.left ? 1 : 0);
    const dy = (I.held.down ? 1 : 0) - (I.held.up ? 1 : 0);
    if (this.hurtT > 0) this.hurtT--;

  PR.updateWolf = function () {

    }
    if (this.atk) {
      const a = this.atk;
      a.t++;

  // ---- drawing ----------------------------------------------------------------------------------
  PR.poseName = function () {

  PR.draw = function (ctx, camx, camy) {

      opts.weapon = { item: a.item };

      opts.extraPal = opts.extraPal.concat([a.item.col || '#cfd6e6', U.shade(a.item.col || '#cfd6e6', 0.5)]);

  // ---- candles -----------------------------------------------------------------------------------
  class Candle extends Ent {
    constructor(sp, g) {
      super({ x: sp.x - 4, y: sp.y - 16, w: 8, h: 16, sp });
      this.style = (g.room.theme && g.room.theme.candle) || g.room.area.candle || 'wall';
      // candles float on walls: lift them a little above the floor tile they mark
      this.y -= sp.lift == null ? 6 : sp.lift;
      this.drop = sp.drop;
    }
    update(g) {
      this.t++;
      if (this.t % 4 === 0) {
        const L = { x: this.cx - g.camx, y: this.y + 2 - g.camy };
        this.light = L;
      }
    }
    hit(g) {
      if (this.dead) return;
      this.dead = true;
      G.audio.sfx('candle_break', { vol: 0.7 });
      G.fx.burst(this.cx, this.y + 4, '#ffb040', 8, 1.5, { glow: true });
      let d = this.drop;
      if (!d) {
        const r = Math.random();
        d = r < 0.55 ? 'heart' : r < 0.67 ? 'heart_big' : r < 0.93 ? 'gold' : 'potion';
        if (r > 0.985 && !G.state.sub) d = 'sub:dagger';
      }
      G.dropPickup(g, d, this.cx, this.y + 8);
    }
    draw(ctx, camx, camy) {
      const x = Math.round(this.x - camx), y = Math.round(this.y - camy);
      const f = Math.floor(this.t / 6) % 3;
      const img = gfx.sprite('candle_' + this.style + f, 12, 22, (c) => {
        if (this.style === 'lantern') {
          c.fillStyle = '#3a2a1a';
          c.fillRect(4, 0, 4, 2);
          c.fillStyle = '#8a6a3a';
          c.fillRect(2, 2, 8, 12);
          c.fillStyle = '#ffd070';
          c.fillRect(3, 4, 6, 8);
          c.fillStyle = '#fff4c0';
          c.fillRect(5, 6 - (f % 2), 2, 4);
          c.fillStyle = '#3a2a1a';
          c.fillRect(2, 14, 8, 2);
        } else {
          // wall sconce candle
          c.fillStyle = '#c9a24a';
          c.fillRect(2, 16, 8, 2);
          c.fillRect(5, 18, 2, 3);
          c.fillStyle = '#efe6d0';
          c.fillRect(4, 8, 4, 8);
          c.fillStyle = '#ffffff';
          c.fillRect(4, 8, 1, 7);
          const fl = [[5, 3, 2, 5], [4, 2, 3, 6], [5, 2, 2, 6]][f];
          c.fillStyle = '#ff9a30';
          c.fillRect(fl[0], fl[1] + 1, fl[2], fl[3]);
          c.fillStyle = '#fff0a0';
          c.fillRect(5, 5, 1, 3);
        }
      }, { outline: '#0a0608', threshold: 80 });
      ctx.drawImage(img, x - 2, y - 4);
      G.gfx.addLight(x + 4, y + 2, 46, '#ffa040', 0.85 + Math.sin(this.t * 0.3) * 0.08);
    }
  }
  G.ENT.candle = (sp, g) => new Candle(sp, g);

  // ---- pickups ------------------------------------------------------------------------------------
  class Pickup extends Ent {
    constructor(o) {
      super(Object.assign({ w: 10, h: 10, life: -1, grav: 0.2, bounce: 0 }, o));
      this.z = 2;
    }
    update(g) {
      this.t++;
      if (!this.static) {
        if (this.float) {
          this.vy = U.approach(this.vy, 0.5, 0.03);
          this.x += Math.sin(this.t * 0.08) * 0.4;
          this.y += this.vy;
          if (P.solidAt(g.room, this.cx, this.fy) || P.floorAt(g.room, this.cx, this.fy)) {
            this.float = false;
            this.vy = 0;
          }
        } else {
          this.vy = Math.min(this.vy + this.grav, 5);
          this.vx *= 0.92;
          P.move(this, g.room);
        }
      }
      if (this.life > 0 && --this.life <= 0) this.dead = true;
      if (this.t > 10 && this.overlapsPlayer(g, 2) && g.player.form !== 'mist' && !g.player.dead) this.collect(g);
    }
    blink() {
      return this.life > 0 && this.life < 90 && this.t % 6 < 3;
    }
  }
  G.Pickup = Pickup;

  class HeartPickup extends Pickup {
    constructor(x, y, big) {
      super({ x: x - 5, y: y - 5, big, life: 600, float: !big, vy: big ? -2 : 0 });
    }
    collect(g) {
      const s = G.state, st = g.player.st;
      s.hearts = Math.min(st.heartsMax, s.hearts + (this.big ? 5 : 1));
      G.audio.sfx(this.big ? 'heart_big' : 'heart');
      this.dead = true;
    }
    draw(ctx, camx, camy) {
      if (this.blink()) return;
      const img = gfx.sprite('pk_heart' + (this.big ? 'B' : 'S'), 16, 16, (c) => {
        c.translate(8, 8);
        c.scale(this.big ? 1 : 0.62, this.big ? 1 : 0.62);
        c.translate(-8, -8);
        drawIcon(c, 'heart', '#e8304a');
      }, { outline: '#200008', threshold: 90 });
      ctx.drawImage(img, Math.round(this.cx - 8 - camx), Math.round(this.cy - 8 - camy));
    }
  }

  const GOLD_VALUES = [1, 10, 25, 50, 100, 250, 400, 1000, 2000];
  class GoldPickup extends Pickup {
    constructor(x, y, amount) {
      super({ x: x - 5, y: y - 6, amount, life: 900, vy: -2.2, vx: U.rnd(-0.6, 0.6) });
    }
    collect(g) {
      G.state.gold = Math.min(9999999, G.state.gold + this.amount);
      G.audio.sfx('gold');
      G.fx.text(this.cx, this.y - 2, '$' + this.amount, '#ffe060');
      this.dead = true;
    }
    draw(ctx, camx, camy) {
      if (this.blink()) return;
      const tier = this.amount >= 1000 ? 3 : this.amount >= 250 ? 2 : this.amount >= 50 ? 1 : 0;
      const img = gfx.sprite('pk_gold' + tier, 14, 14, (c) => {
        const col = ['#e0c040', '#e0c040', '#60c0ff', '#ff6080'][tier];
        if (tier === 0) {
          gfx.circle(c, 7, 8, 4, col);
          c.fillStyle = '#fff4a0';
          c.fillRect(5, 6, 2, 1);
        } else {
          gfx.ellipse(c, 7, 9, 5.5, 4.5, 0, '#a07840');
          c.fillStyle = '#7a5a2a';
          c.fillRect(5, 3, 4, 3);
          gfx.circle(c, 7, 9, 2.2, col);
        }
      }, { outline: '#1a1008', threshold: 90 });
      ctx.drawImage(img, Math.round(this.cx - 7 - camx), Math.round(this.cy - 7 - camy));
    }
  }

  class ItemPickup extends Pickup {
    constructor(x, y, id, o) {
      super(Object.assign({ x: x - 6, y: y - 12, w: 12, h: 12, id, life: o && o.key ? -1 : 1200, vy: -2.5 }, o));
    }
    collect(g) {
      const s = G.state;
      const it = G.ITEMS[this.id];
      this.dead = true;
      if (this.key) s.flags[this.key] = 1;
      if (this.id === 'hp_up') {
        s.base.hp += 12;
        g.player.refreshStats();
        s.hp = g.player.st.hpMax;
        G.audio.sfx('relic_get');
        G.ui.banner(G.tr({ en: 'Life Vessel', es: 'Vasija de vida' }), G.tr({ en: 'Max HP increased', es: 'PV máximos aumentados' }), '#ff6070');
        return;
      }
      if (this.id === 'heart_up') {
        s.base.hearts += 10;
        g.player.refreshStats();
        s.hearts = g.player.st.heartsMax;
        G.audio.sfx('relic_get');
        G.ui.banner(G.tr({ en: 'Heart Vessel', es: 'Vasija de corazones' }), G.tr({ en: 'Max hearts increased', es: 'Corazones máximos aumentados' }), '#ff80a0');
        return;
      }
      if (this.id === 'mp_up') {
        s.base.mp += 8;
        g.player.refreshStats();
        s.mp = g.player.st.mpMax;
        G.audio.sfx('relic_get');
        G.ui.banner(G.tr({ en: 'Mana Prism', es: 'Prisma de maná' }), G.tr({ en: 'Max MP increased', es: 'PM máximos aumentados' }), '#80a0ff');
        return;
      }
      if (!it) return;
      if (it.kind === 'relic') {
        s.relics[it.id] = true;
        G.audio.sfx('relic_get');
        G.ui.banner(G.tr(it.name), G.tr(it.desc), it.col, 260);
        G.emit('relic', it.id);
        if (it.familiar) g.refreshFamiliar();
        return;
      }
      G.invAdd(s, it.id, 1);
      G.audio.sfx('item_get');
      G.ui.notify(G.tr(it.name), '#f0e6c8', it);
      if (it.kind === 'key') G.ui.banner(G.tr(it.name), G.tr(it.desc), '#e8d8b0', 240);
    }
    draw(ctx, camx, camy) {
      if (this.blink()) return;
      const it = this.id === 'hp_up' ? { icon: 'heart', col: '#ff4050' } : this.id === 'heart_up' ? { icon: 'heart', col: '#ff80c0' } : this.id === 'mp_up' ? { icon: 'relic', col: '#6080ff' } : G.ITEMS[this.id];
      if (!it) return;
      const img = G.itemIcon(it);
      const bob = this.static ? Math.sin(this.t * 0.06) * 2 : 0;
      ctx.drawImage(img, Math.round(this.cx - 8 - camx), Math.round(this.cy - 8 - camy + bob));
      if (this.static || it.kind === 'relic') G.gfx.addLight(this.cx - camx, this.cy - camy, 40, it.col || '#ffffff', 0.7);
      if (this.t % 20 === 0) G.fx.particle(this.cx + U.rnd(-5, 5), this.cy + U.rnd(-5, 5), 0, -0.3, '#ffffff', 20, { glow: true });
    }
  }
  G.ItemPickup = ItemPickup;

  class SubPickup extends Pickup {
    constructor(x, y, id) {
      super({ x: x - 6, y: y - 12, w: 12, h: 12, id, life: 900, vy: -2 });
    }
    collect(g) {
      const s = G.state;
      const old = s.sub;
      if (old === this.id) {
        s.hearts = Math.min(g.player.st.heartsMax, s.hearts + 2);
        G.audio.sfx('heart');
        this.dead = true;
        return;
      }
      s.sub = this.id;
      G.audio.sfx('item_get');
      G.ui.notify(G.tr(G.SUBWEAPONS[this.id].name), '#ffd080', G.SUBWEAPONS[this.id]);
      this.dead = true;
      if (old) {
        const p = new SubPickup(this.cx - g.player.facing * 18, this.cy, old);
        p.t = -40;
        g.add(p);
      }
    }
    draw(ctx, camx, camy) {
      if (this.blink()) return;
      const sw = G.SUBWEAPONS[this.id];
      ctx.drawImage(G.itemIcon(sw), Math.round(this.cx - 8 - camx), Math.round(this.cy - 8 - camy));
    }
  }

  // drop helper: 'heart' | 'heart_big' | 'gold' | 'gold:250' | 'sub:axe' | 'item:potion' | item id
  G.dropPickup = function (g, d, x, y) {
    if (!d) return null;
    let e = null;
    if (d === 'heart') e = new HeartPickup(x, y, false);
    else if (d === 'heart_big') e = new HeartPickup(x, y, true);
    else if (d.startsWith('gold')) {
      let amt = d.includes(':') ? parseInt(d.split(':')[1], 10) : U.pick([1, 1, 10, 10, 25, 50]);
      e = new GoldPickup(x, y, amt);
    } else if (d.startsWith('sub:')) e = new SubPickup(x, y, d.slice(4));
    else {
      const id = d.startsWith('item:') ? d.slice(5) : d;
      if (G.ITEMS[id] || id === 'hp_up' || id === 'heart_up' || id === 'mp_up') e = new ItemPickup(x, y, id);
    }
    if (e) g.add(e);
    return e;
  };

  // placed unique item / relic / vessel
  G.ENT.item = function (sp, g) {
    if (G.state.flags[sp.key]) return null;
    const e = new ItemPickup(sp.x, sp.y - 8, sp.id, { key: sp.key, static: true, life: -1, vy: 0 });
    if (sp.hidden) e.hiddenInWall = true;
    return e;
  };
  G.ENT.relic = function (sp, g) {
    if (G.hasRelic(G.state, sp.id) || G.state.flags[sp.key]) return null;
    const e = new ItemPickup(sp.x, sp.y - 20, sp.id, { key: sp.key, static: true, life: -1, vy: 0 });
    e.pedestal = true;
    const draw = e.draw.bind(e);
    e.draw = function (ctx, camx, camy) {
      const x = Math.round(sp.x - camx), y = Math.round(sp.y - camy);
      const img = gfx.sprite('pedestal', 24, 18, (c) => {
        c.fillStyle = '#6a6070';
        c.fillRect(4, 4, 16, 14);
        c.fillStyle = '#9a90a0';
        c.fillRect(2, 0, 20, 5);
        c.fillStyle = '#c9a24a';
        c.fillRect(2, 4, 20, 1);
        c.fillStyle = '#4a4050';
        c.fillRect(8, 8, 8, 8);
      }, { outline: '#0a0810' });
      ctx.drawImage(img, x - 12, y - 18);
      draw(ctx, camx, camy);
    };
    return e;
  };
  G.ENT.subweapon = function (sp, g) {
    const e = new SubPickup(sp.x, sp.y - 6, sp.id);
    e.static = true;
    e.life = -1;
    return e;
  };

  // ---- save point -------------------------------------------------------------------------------
  class SavePoint extends Ent {

        c.fillStyle = '#3a2430';

        c.fillRect(0, 4, 36, 6);

      gr.addColorStop(1, 'rgba(255,0,40,0)');

        c.lineTo(12, 8);
        c.lineTo(6, 20);
        c.lineTo(0, 8);
        c.closePath();
        c.fill();
        c.fillStyle = '#ff6070';
        c.beginPath();
        c.moveTo(6, 1);
        c.lineTo(9, 8);
        c.lineTo(6, 14);
        c.closePath();
        c.fill();
      }, { outline: '#200008' });
      ctx.drawImage(cr, x - 6, Math.round(cy - 10));

  G.ENT.save = (sp) => new SavePoint(sp);

  // ---- teleporter ---------------------------------------------------------------------------------
  class Teleporter extends Ent {
    constructor(sp) {
      super({ x: sp.x - 16, y: sp.y - 40, w: 32, h: 40, sp, interact: true, prompt: 'up_to_use' });
    }
    update(g) {
      this.t++;
      if (!G.state.flags['tp_' + g.room.id]) G.state.flags['tp_' + g.room.id] = 1;
    }
    onInteract(g) {
      G.ui.openTeleport(g.room.id);
    }
    draw(ctx, camx, camy) {
      const x = Math.round(this.cx - camx), y = Math.round(this.fy - camy);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 3; i++) {
        ctx.strokeStyle = U.rgba('#ffd060', 0.5 - i * 0.12);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(x, y - 2, 16 - i * 3, 4 - i, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      const h = 30 + Math.sin(this.t * 0.07) * 4;

      this.dy = ny - this.y;
      this.x = nx;
      this.y = ny;

  G.setDoorLocked = function (room, side, cell, locked) {
    const T2 = G.T;
    if (!room._doorSaved) room._doorSaved = {};
    const key = side + cell;
    const cells = [];
    if (side === 'L' || side === 'R') {
      const x0 = side === 'L' ? 0 : room.tw - 2;
      for (let x = x0; x < x0 + 2; x++) for (let r = cell * 14 + 8; r < cell * 14 + 12; r++) cells.push([x, r]);
    } else {
      const y0 = side === 'T' ? 0 : room.th - 2;
      for (let y = y0; y < y0 + 2; y++) for (let c = cell * 24 + 10; c < cell * 24 + 14; c++) cells.push([c, y]);
    }
    for (const [x, y] of cells) room.set(x, y, locked ? T2.SOLID : T2.EMPTY);
    if (room.fgCanvas) G.redrawTiles(room);
  };

/* ---- js/enemy_base.js ---- */
/* Elegy of the Night — enemy_base.js
 * Enemy framework used by data_enemies.js / data_bosses.js.
 *
 *   G.defEnemy('ghoul', {
 *     name:{en,es}, desc:{en,es}, area:'entrance',
 *     hp, atk, def, exp, w, h,              // stats & hitbox (px)
 *     el:'hit',                             // contact damage element
 *     weak:['fire'], resist:['dark'], absorb:[], immune:['poison'],
 *     drops:[{id:'potion', p:0.05}],        // item ids, 'gold', 'heart'...
 *     gold:[5,20], flying:false, heavy:false, touch:true,
 *     init(e, g){}, ai(e, g){}, draw(e, ctx, sx, sy){}, onHit(e,hit,g){}, onDeath(e,g){}
 *   });
 * In ai(): e.move() applies gravity (unless flying) and tile collision.
 * Useful helpers on e: face(), dxp(), dyp(), dist(), seesPlayer(), shoot(), state/stT, rnd.
 * Sprites: G.gfx.sprite(key, w, h, drawFn, {outline, palette}) then
 *          G.gfx.drawAnchored(img, sx, sy, ax, ay, e.facing < 0)
 * (sx, sy) passed to draw() is the screen position of the enemy's feet centre.
 */
(function () {
  'use strict';
  const root = typeof window !== 'undefined' ? window : globalThis;
  const G = (root.G = root.G || {});
  const U = G.util, P = G.phys, gfx = G.gfx;

  G.ENEMIES = G.ENEMIES || {};
  G.defEnemy = function (id, def) {
    def.id = id;
    def.weak = def.weak || [];
    def.resist = def.resist || [];
    def.absorb = def.absorb || [];
    def.immune = def.immune || [];
    def.drops = def.drops || [];
    if (def.touch === undefined) def.touch = true;
    G.ENEMIES[id] = def;
  };

  class Enemy extends G.Ent {
    constructor(def, sp, g) {
      super({ w: def.w || 16, h: def.h || 32 });
      this.def = def;
      this.id = def.id;
      this.sp = sp || {};
      this.g = g;
      this.x = (sp ? sp.x : 0) - this.w / 2;
      this.y = (sp ? sp.y : 0) - this.h;
      this.hp = this.maxHp = Math.round(def.hp * (sp && sp.hpMul ? sp.hpMul : 1));
      this.atk = def.atk;
      this.defn = def.def || 0;
      this.facing = sp && sp.facing ? sp.facing : -1;
      this.state = 'idle';
      this.stT = 0;
      this.flash = 0;
      this.hitIds = new Map();
      this.stun = 0;
      this.flying = !!def.flying;
      this.alpha = 1;
      this.z = 1;
      this.boss = !!def.boss;
      this.active = true;
      this.invuln = 0;
      this.contact = def.touch;
      this.rnd = U.RNG(U.uid() * 977);
      this.spawnX = this.x;
      this.spawnY = this.y;
      if (def.init) def.init(this, g);
    }
    get player() {
      return this.g.player;
    }
    setState(s) {
      this.state = s;
      this.stT = 0;
    }
    face() {
      this.facing = this.player.cx < this.cx ? -1 : 1;
      return this.facing;
    }
    dxp() {
      return this.player.cx - this.cx;
    }
    dyp() {
      return this.player.cy - this.cy;
    }
    dist() {
      return Math.hypot(this.dxp(), this.dyp());
    }
    seesPlayer(range) {
      return this.dist() < (range || 160) && P.los(this.g.room, this.cx, this.cy - 4, this.player.cx, this.player.cy);
    }
    onScreen(pad) {
      const g = this.g;
      pad = pad || 0;
      return this.x + this.w > g.camx - pad && this.x < g.camx + G.W + pad && this.y + this.h > g.camy - pad && this.y < g.camy + G.H + pad;
    }
    move() {
      if (!this.flying) this.vy = Math.min(this.vy + (this.grav == null ? 0.3 : this.grav), 7);
      P.move(this, this.g.room);
    }
    // move without tile collision (ghosts)
    drift() {
      this.x += this.vx;
      this.y += this.vy;
    }
    shoot(o) {
      const p = new EnemyProj(Object.assign({ owner: this, dmg: this.atk, el: 'hit' }, o));
      this.g.add(p);
      return p;
    }
    hurtPlayer(dmg, el, o) {
      return this.player.hurt(dmg == null ? this.atk : dmg, el || this.def.el || 'hit', this.cx, o);
    }
    hurtbox() {
      return { x: this.x, y: this.y, w: this.w, h: this.h };
    }
    update(g) {
      this.t++;
      this.stT++;
      if (this.flash > 0) this.flash--;
      if (this.invuln > 0) this.invuln--;
      if (this.stun > 0) {
        this.stun--;
        this.vx *= 0.85;
        if (!this.flying) this.move();
        else this.drift();
        return;
      }
      // bosses sleep until the player comes close, then (optionally) play an
      // intro scene, lock the arena and start fighting
      if (this.boss && !this.started) {
        const d = this.def;
        const wake = d.wake ? d.wake(this, g) : Math.abs(this.dxp()) < (d.wakeDist || 150) && Math.abs(this.dyp()) < 120;
        if (!wake || (G.story && G.story.active)) {
          if (d.idle) d.idle(this, g);
          return;
        }
        this.started = true;
        const go = () => {
          g.startBoss(this);
          if (d.onStart) d.onStart(this, g);
        };
        if (d.introScene && !G.state.flags['scene_' + d.introScene]) G.story.play(d.introScene, { after: go });
        else go();
        return;
      }
      if (this.boss && g.boss !== this) return;
      if (this.def.ai) this.def.ai(this, g);
      // contact damage
      if (this.contact && this.active && !this.dead && this.alpha > 0.3) {
        const p = g.player;
        const hb = this.hurtbox();
        const pb = p.hurtbox();
        if (hb.x < pb.x + pb.w && hb.x + hb.w > pb.x && hb.y < pb.y + pb.h && hb.y + hb.h > pb.y) {
          if (p.diveT) return; // dive kick handled as an attack
          this.hurtPlayer(this.atk, this.def.el, this.def.touchStatus);
        }
      }
    }
    /* hit: {dmg, el, id, status, drain, crit?, kb} */
    takeHit(hit, g) {
      if (this.dead || this.invuln > 0 || !this.active) return false;
      const last = this.hitIds.get(hit.id);
      if (last !== undefined && this.t - last < (hit.rehit || 9999)) return false;
      this.hitIds.set(hit.id, this.t);
      const d = this.def;
      const s = G.state;
      if (d.onHitCheck && d.onHitCheck(this, hit, g) === false) return false;
      let dmg = hit.dmg;
      const el = hit.el || 'hit';
      let mult = 1, tag = null;
      if (d.immune.includes(el)) {
        mult = 0;
        tag = 'immune';
      } else if (d.absorb.includes(el)) {
        mult = -0.5;
        tag = 'absorb';
      } else if (d.weak.includes(el)) {
        mult = 1.5;
        tag = 'weak';
      } else if (d.resist.includes(el)) {
        mult = 0.5;
        tag = 'resist';
      }
      const lck = g.player.st.lck;
      const crit = !hit.noCrit && Math.random() < Math.min(0.3, 0.03 + lck / 220);
      dmg = Math.max(mult > 0 ? 1 : 0, Math.round((dmg - this.defn / 2) * Math.abs(mult) * U.rnd(0.92, 1.08) * (crit ? 1.5 : 1)));
      if (mult < 0) {
        this.hp = Math.min(this.maxHp, this.hp + dmg);
        G.fx.number(this.cx, this.y - 4, dmg, '#60ff90');
        return true;
      }
      this.hp -= dmg;
      this.flash = 8;
      this.lastHitT = this.t;
      g.lastHitEnemy = this;
      g.lastHitT = 180;
      G.fx.number(this.cx + U.rnd(-4, 4), this.y - 2, dmg, crit ? '#ffe040' : tag === 'weak' ? '#ff9a40' : '#ffffff', crit);
      if (crit) G.audio.sfx('crit');
      else G.audio.sfx(d.hitSfx || (d.armored ? 'hit_metal' : d.bony ? 'hit_bone' : 'hit_flesh'), { pitch: U.rnd(0.92, 1.08), vol: 0.8 });
      G.fx.spark(hit.x != null ? hit.x : this.cx, hit.y != null ? hit.y : this.cy, d.blood || '#ffe0a0', 5);
      if (!d.noBlood) G.fx.blood(this.cx, this.cy, g.player.cx < this.cx ? 1 : -1, 5, d.blood);
      // player on-hit effects
      const st = g.player.st;
      if (st.hpOnHit) g.player.heal(st.hpOnHit, true);
      if (hit.drain) g.player.heal(Math.max(1, Math.round(dmg * hit.drain)), true);
      if (g.player.buffs.darkMeta > 0) g.player.heal(Math.max(1, Math.round(dmg * 0.25)), true);
      if (hit.status && hit.status.poison && !d.immune.includes('poison') && Math.random() < hit.status.poison) this.poison = 300;

    switch (id) {
      case 'spirit': {
        const p = new PlayerProj({ x: pl.cx, y: pl.y, w: 10, h: 10, dmg: 12 + Math.round(st.int * 1.5), el: 'dark', life: 200, wall: false, pierce: 0 });
        p.vx = -f * 0.5;
        p.vy = -1.5;
        p.upd = (p, g) => {
          let best = null, bd = 1e9;
          for (const e of g.ents) if (e instanceof G.Enemy && !e.dead && e.active) {
            const d = Math.hypot(e.cx - p.cx, e.cy - p.cy);
            if (d < bd) {
              bd = d;
              best = e;
            }
          }
          if (best && p.t > 15) {
            const a = Math.atan2(best.cy - p.cy, best.cx - p.cx);
            p.vx += Math.cos(a) * 0.35;
            p.vy += Math.sin(a) * 0.35;
            const sp = Math.hypot(p.vx, p.vy);
            if (sp > 3.4) {
              p.vx *= 3.4 / sp;
              p.vy *= 3.4 / sp;
            }
          } else p.vy *= 0.95;
        };
        p.drawFn = (p, ctx, sx, sy) => {
          glowDot(ctx, sx, sy, 9, '#a0c0ff');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(sx - 2, sy - 2, 4, 4);
          if (p.t % 3 === 0) G.fx.particle(p.cx, p.cy, 0, 0, '#8090ff', 14, { glow: true });
        };
        G.audio.sfx('spell_spirit');
        g.add(p);
        break;
      }
      case 'hellfire': {
        G.audio.sfx('spell_fire');
        G.gfx.flash('#ff8040', 4);
        [-0.22, 0, 0.22].forEach((a, i) => {
          const p = new PlayerProj({ x, y, vx: Math.cos(a) * 4.2 * f, vy: Math.sin(a) * 4.2, w: 12, h: 12, dmg: 26 + Math.round(st.int * 2), el: 'fire', life: 80, pierce: 1 });
          p.drawFn = (p, ctx, sx, sy) => {
            glowDot(ctx, sx, sy, 12, '#ff5010');
            if (p.t % 2 === 0) G.fx.particle(p.cx, p.cy, -f * 0.6, U.rnd(-0.5, 0.5), '#ffa030', 16, { glow: true });
            gfx.addLight(sx, sy, 50, '#ff7030', 0.9);
          };
          g.later(i * 6, () => g.add(p));
        });
        break;
      }
      case 'dark_meta':
        pl.buffs.darkMeta = 720;
        G.audio.sfx('spell_dark');
        G.fx.burst(pl.cx, pl.cy, '#c02040', 30, 2.5, { glow: true });
        G.gfx.flash('#600010', 6);
        break;
      case 'soul_steal': {
        G.audio.sfx('spell_soul_steal');
        G.gfx.flash('#ff2040', 10);
        G.gfx.shake(4, 30);
        let total = 0;
        for (const e of g.ents) {
          if (!(e instanceof G.Enemy) || e.dead || !e.active) continue;
          if (e.x + e.w < g.camx || e.x > g.camx + G.W || e.y + e.h < g.camy || e.y > g.camy + G.H) continue;
          const hp0 = e.hp;
          e.takeHit({ dmg: 40 + Math.round(st.int * 3), el: 'dark', id: 'ss' + U.uid(), noCrit: true }, g);
          total += Math.max(0, hp0 - Math.max(0, e.hp));
          for (let i = 0; i < 8; i++) g.later(i * 3, () => G.fx.soul(e.cx, e.cy, pl.cx, pl.cy, '#ff4060'));
        }
        g.later(30, () => pl.heal(Math.min(st.hpMax, Math.round(total * 0.5) + 10)));
        break;
      }
      case 'ink_lance': {
        G.audio.sfx('spell_ink');
        const len = 230;
        const p = new PlayerProj({ x: f > 0 ? pl.cx + 8 + len / 2 : pl.cx - 8 - len / 2, y: pl.fy - 30, w: len, h: 10, dmg: 22 + Math.round(st.int * 2.2), el: 'dark', life: 14, wall: false, pierce: 99 });
        p.drawFn = (p, ctx, sx, sy) => {
          const a = p.life / 14;
          ctx.fillStyle = U.rgba('#1a0c2a', a);
          ctx.fillRect(sx - len / 2, sy - 4 * a, len, 8 * a);
          ctx.fillStyle = U.rgba('#a070ff', a);
          ctx.fillRect(sx - len / 2, sy - 1, len, 2);
          gfx.addLight(sx, sy, 60, '#8050ff', 0.6);
        };
        g.add(p);
        G.gfx.shake(2, 8);
        break;
      }
      case 'belmont_ward': {
        G.audio.sfx('spell_holy');
        for (let i = 0; i < 4; i++) {
          const q = new PlayerProj({ x: pl.cx, y: pl.cy, w: 12, h: 12, dmg: 14 + Math.round(st.int * 1.2), el: 'holy', life: 320, wall: false, pierce: 999, rehit: 20 });
          q.upd = (q, g) => {
            const a = q.t * 0.07 + (i * Math.PI) / 2;
            q.x = pl.cx + Math.cos(a) * 30 - q.w / 2;
            q.y = pl.cy + Math.sin(a) * 26 - q.h / 2;
            if (--q.life <= 0) q.dead = true;
            return false;
          };
          q.drawFn = (q, ctx, sx, sy) => {
            ctx.save();
            ctx.translate(sx, sy);
            ctx.rotate(q.t * 0.1);
            ctx.fillStyle = '#ffe070';
            ctx.fillRect(-1.5, -6, 3, 12);
            ctx.fillRect(-5, -2.5, 10, 3);
            ctx.restore();
            gfx.addLight(sx, sy, 30, '#ffe080', 0.7);
          };
          g.add(q);
        }
        break;
      }
      case 'crimson_requiem': {
        G.audio.sfx('spell_dark');
        G.gfx.flash('#a00020', 6);
        for (let i = 0; i < 12; i++) {
          g.later(i * 5, () => {
            const bx = pl.cx + U.rnd(-120, 120);
            const p = new PlayerProj({ x: bx, y: g.camy - 10, vx: 0, vy: 7, w: 8, h: 18, dmg: 30 + Math.round(st.int * 2.4), el: 'dark', life: 60, wall: false, pierce: 3 });
            p.drawFn = (p, ctx, sx, sy) => {
              ctx.fillStyle = '#c01030';
              ctx.fillRect(sx - 2, sy - 9, 4, 16);
              ctx.fillStyle = '#ff6070';
              ctx.fillRect(sx - 1, sy - 9, 1, 14);
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(sx - 1, sy + 6, 2, 3);
            };
            g.add(p);
          });
        }
        break;
      }
    }
  };

  // reflected enemy projectile → becomes a player projectile
  G.convertToPlayerProj = function (ep, g) {
    ep.dead = true;
    const p = new PlayerProj({ x: ep.cx, y: ep.cy, vx: ep.vx, vy: ep.vy, w: ep.w, h: ep.h, dmg: ep.dmg * 2, el: ep.el, life: 90 });
    p.drawFn = (p, ctx, sx, sy) => glowDot(ctx, sx, sy, 8, '#e0e8ff');
    g.add(p);
  };

  // ---- familiars ----------------------------------------------------------------------------------------
  class Familiar extends G.Ent {
    constructor(kind, pl) {
      super({ x: pl.cx - 20, y: pl.y - 10, w: 10, h: 10, kind, z: 4 });
      this.pl = pl;
      this.cool = 0;
      this.target = null;
      this.familiar = true;
    }
    update(g) {
      this.t++;
      const pl = this.pl;
      if (this.cool > 0) this.cool--;
      let tx = pl.cx - pl.facing * 22, ty = pl.y - 6 + Math.sin(this.t * 0.08) * 4;
      if (this.kind === 'bat') {
        if (!this.target || this.target.dead) {
          this.target = null;
          let bd = 110;
          for (const e of g.ents) if (e instanceof G.Enemy && !e.dead && e.active && e.alpha > 0.5) {
            const d = Math.hypot(e.cx - this.cx, e.cy - this.cy);
            if (d < bd) {
              bd = d;
              this.target = e;
            }
          }
        }
        if (this.target && this.cool <= 0) {
          tx = this.target.cx;
          ty = this.target.cy;
          if (Math.abs(this.cx - tx) < 10 && Math.abs(this.cy - ty) < 12) {
            this.target.takeHit({ dmg: 6 + G.state.level * 2, el: 'cut', id: 'fam' + this.t, noCrit: true, kb: 0.5 }, g);
            this.cool = 40;
            this.target = null;
          }
        }
      } else if (this.kind === 'faerie') {
        const s = G.state;
        if (this.cool <= 0) {
          let used = null;
          if (s.hp < pl.st.hpMax * 0.3) used = ['high_potion', 'potion', 'roast_fowl', 'bread'].find((i) => G.invCount(s, i) > 0);
          else if (s.status.poison > 0 && G.invCount(s, 'antidote')) used = 'antidote';
          else if (s.status.curse > 0 && G.invCount(s, 'holy_salt')) used = 'holy_salt';
          if (used) {
            G.useItem(used, true);
            G.fx.text(this.cx, this.y - 6, G.tr(G.ITEMS[used].name), '#ffb0f0');
            this.cool = 480;
          }
        }
      }
      const sp = this.kind === 'bat' && this.target ? 0.12 : 0.06;
      this.vx += (tx - this.cx) * sp * 0.1;
      this.vy += (ty - this.cy) * sp * 0.1;
      this.vx *= 0.88;
      this.vy *= 0.88;
      this.x += this.vx;
      this.y += this.vy;
    }
    draw(ctx, camx, camy) {
      const sx = Math.round(this.cx - camx), sy = Math.round(this.cy - camy);
      if (this.kind === 'bat') {
        const img = G.drawBat(this.t + 7);
        ctx.drawImage(img, sx - 16, sy - 12);
      } else {
        glowDot(ctx, sx, sy, 10, '#ff90e0');
        ctx.fillStyle = '#ffe0f8';
        ctx.fillRect(sx - 1, sy - 2, 3, 4);
        const w = Math.sin(this.t * 0.5) * 3;
        ctx.fillStyle = 'rgba(255,220,250,0.8)';
        ctx.fillRect(sx - 4, sy - 3 + w * 0.3, 3, 2);
        ctx.fillRect(sx + 2, sy - 3 - w * 0.3, 3, 2);
        gfx.addLight(sx, sy, 34, '#ff90e0', 0.6);
      }
    }
  }
  G.Familiar = Familiar;
})();


/* ---- js/game.js ---- */
/* Elegy of the Night — game.js
 * The gameplay scene: room loading & transitions, camera, entity updates,
 * combat resolution, breakable walls, boss fights, time stop, hitstop,
 * interactions, saving, consumables and level ups.
 */
(function () {
  'use strict';
  const root = typeof window !== 'undefined' ? window : globalThis;
  const G = (root.G = root.G || {});
  const U = G.util, P = G.phys, T = G.T, I = G.input, gfx = G.gfx;

  const g = (G.game = {
    room: null,
    player: null,
    ents: [],
    camx: 0,
    camy: 0,
    lookX: 0,
    frame: 0,
    hitstop: 0,
    timeStop: 0,
    queue: [],
    boss: null,
    areaId: null,
    fadeIn: 0,
    transT: 0,
    interactEnt: null,
    lastHitEnemy: null,
    lastHitT: 0,
    running: false,
  });

  g.add = function (e) {
    g.ents.push(e);
    return e;
  };
  g.later = function (n, fn) {
    g.queue.push({ f: g.frame + Math.max(0, n | 0), fn });
  };

  g.start = function (state, opts) {
    G.state = state;
    opts = opts || {};
    g.ents = [];
    g.queue = [];
    g.boss = null;
    g.timeStop = 0;
    g.hitstop = 0;
    g.areaId = null;
    G.fx.clear();
    const roomId = state.room && G.world.rooms[state.room] ? state.room : 'ent_gate';
    g.loadRoom(roomId, state.px, state.py, { fromSave: true });
    g.running = true;
    G.scene = 'game';
    if (opts.onStart) opts.onStart();
  };

  function spawnPoint(room) {
    const s = room.spawns.find((sp) => sp.t === 'start') || room.spawns.find((sp) => sp.t === 'save');
    if (s) return { x: s.x, y: s.y };
    return { x: 40, y: G.CELL_PX_H - 32 };
  }

  g.loadRoom = function (id, px, py, opts) {
    opts = opts || {};
    const s = G.state;
    const room = G.world.load(id);
    // persistent tile changes
    for (let ty = 0; ty < room.th; ty++)
      for (let tx = 0; tx < room.tw; tx++) {
        const t = room.tiles[ty * room.tw + tx];
        if (t === T.BREAK && s.flags['wall:' + id + ':' + tx + ',' + ty]) room.tiles[ty * room.tw + tx] = T.EMPTY;
        else if (t === T.SEAL && G.hasRelic(s, 'belmont_crest')) room.tiles[ty * room.tw + tx] = T.EMPTY;
        else if (t === T.INK) room.tiles[ty * room.tw + tx] = G.hasRelic(s, 'lantern') ? T.ONEWAY : T.EMPTY;
        if (t === T.WATER) room.hasWater = true;
        if (t === T.INK) room.hasInk = true;
      }
    G.renderRoom(room);
    g.room = room;
    // entities
    const keep = opts.keepEnts || [];
    g.ents = keep.slice();
    for (const sp of room.spawns) {
      const f = G.ENT[sp.t];
      if (!f) continue;
      const e = f(sp, g);
      if (e) g.add(e);
    }
    // player
    let pos;
    if (px != null && py != null) pos = { x: px, y: py };
    else pos = spawnPoint(room);
    if (!g.player || opts.fromSave) {
      g.player = new G.Player(g, pos.x, pos.y);
    } else {
      const p = g.player;
      p.x = pos.x - p.w / 2;
      p.y = pos.y - p.h;
      p.g = g;
    }
    g.player.resetCape();
    g.refreshFamiliar();
    // camera
    g.snapCamera();
    // area & music
    const area = room.area;
    if (area && area.id !== g.areaId) {
      g.areaId = area.id;
      if (!opts.fromSave || true) G.ui.areaBanner(G.tr(area.name));
      s.flags['visited_area_' + area.id] = 1;
    }
    if (!g.boss) G.audio.playMusic(room.def.music || (area && area.music) || 'entrance', { fade: 1.2 });
    g.markVisited();
    g.fadeIn = opts.fade || 10;
    G.emit('room', room);
    if (room.def.onEnter) room.def.onEnter(g, room);
    if (G.story && room.def.scene && !s.flags['scene_' + room.def.scene]) g.later(10, () => G.story.play(room.def.scene));
  };

  g.refreshFamiliar = function () {
    U.removeIf(g.ents, (e) => e.familiar);
    const s = G.state;
    for (const id in s.relics) {
      const r = G.RELICS[id];
      if (r && r.familiar && s.relics[id]) g.add(new G.Familiar(r.familiar, g.player));
    }
  };

  g.markVisited = function () {
    const p = g.player, room = g.room;
    const c = room.cellOf(U.clamp(p.cx, 0, room.pw - 1), U.clamp(p.cy, 0, room.ph - 1));
    const v = (G.state.visited[room.map] = G.state.visited[room.map] || {});
    const k = c.cx + ',' + c.cy;
    if (!v[k]) v[k] = 1;
  };

  g.snapCamera = function () {
    const p = g.player, room = g.room;
    g.lookX = p.facing * 18;
    g.camx = U.clamp(p.cx - G.W / 2 + g.lookX, 0, room.pw - G.W);
    g.camy = U.clamp(p.cy - G.H / 2 - 8, 0, room.ph - G.H);
  };

  g.updateCamera = function () {
    const p = g.player, room = g.room;
    g.lookX = U.approach(g.lookX, p.facing * 18, 0.8);
    const tx = U.clamp(p.cx - G.W / 2 + g.lookX, 0, room.pw - G.W);
    const ty = U.clamp(p.cy - G.H / 2 - 8, 0, room.ph - G.H);
    g.camx += (tx - g.camx) * 0.16;
    g.camy += (ty - g.camy) * (Math.abs(ty - g.camy) > 60 ? 0.25 : 0.14);
    if (Math.abs(tx - g.camx) < 0.2) g.camx = tx;
    if (Math.abs(ty - g.camy) < 0.2) g.camy = ty;
  };

  // ---- transitions -----------------------------------------------------------------------------
  g.goRoom = function (id, tx, ty, opts) {
    opts = opts || {};
    const doIt = () => {
      const keepP = g.player;
      const x = tx != null ? tx * 16 + 8 : null, y = ty != null ? (ty + 1) * 16 : null;
      g.boss = null;
      g.loadRoom(id, x, y, { fade: opts.fade || 20 });
      keepP.vx = 0;
      keepP.vy = 0;
      if (opts.flash) gfx.flash(opts.flash, 12);
      if (opts.after) opts.after();
    };
    if (opts.instant) doIt();
    else {
      g.transT = 14;
      g.pendingTrans = doIt;
    }
  };

  function checkExit() {
    const p = g.player, room = g.room, def = room.def;
    const cx = p.cx, cy = p.cy;
    if (cx >= 0 && cx < room.pw && cy >= 0 && cy < room.ph) return;
    const gx = def.x * G.CELL_PX_W + cx, gy = def.y * G.CELL_PX_H + cy;
    const ncx = Math.floor(gx / G.CELL_PX_W), ncy = Math.floor(gy / G.CELL_PX_H);
    const nid = G.world.roomAtCell(def.map, ncx, ncy);
    if (!nid || nid === room.id) {
      // blocked: clamp inside
      p.x = U.clamp(p.x, 0, room.pw - p.w);
      if (p.y + p.h > room.ph) {
        p.y = room.ph - p.h;
        p.vy = 0;
        p.onGround = true;
      }
      if (p.y < 0) {
        p.y = 0;
        p.vy = 0;
      }
      return;
    }
    const nd = G.world.rooms[nid];
    const lx = gx - nd.x * G.CELL_PX_W, ly = gy - nd.y * G.CELL_PX_H;
    const vx = p.vx, vy = p.vy;
    const upward = cy < 0;
    const keepEnts = g.ents.filter((e) => e.familiar);
    g.boss = null;
    g.loadRoom(nid, lx, ly + p.h / 2, { fade: 8, keepEnts });
    const np = g.player;
    np.vx = vx;
    np.vy = vy;
    if (upward) {
      np.vy = Math.min(vy, -4.2);
      np.y = Math.min(np.y, g.room.ph - np.h - 2);
    }
    // nudge out of walls if room edges disagree slightly
    for (let i = 0; i < 24 && P.rectSolid(g.room, np.x, np.y, np.w, np.h, np); i++) np.y -= 2;
    g.snapCamera();
  }

  // ---- combat ------------------------------------------------------------------------------------
  function overlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }
  function breakTilesIn(box) {
    const room = g.room;
    const tx0 = Math.floor(box.x / 16), tx1 = Math.floor((box.x + box.w - 1) / 16);
    const ty0 = Math.floor(box.y / 16), ty1 = Math.floor((box.y + box.h - 1) / 16);
    let broke = false;
    for (let ty = ty0; ty <= ty1; ty++)
      for (let tx = tx0; tx <= tx1; tx++) {
        if (room.get(tx, ty) === T.BREAK) {
          room.set(tx, ty, T.EMPTY);
          G.state.flags['wall:' + room.id + ':' + tx + ',' + ty] = 1;
          G.fx.debris(tx * 16 + 8, ty * 16 + 8, room.theme.c.base, 12);
          broke = true;
        }
      }
    if (broke) {
      G.audio.sfx('break_wall');
      gfx.shake(2, 8);
      G.redrawTiles(room);
      if (!G.state.flags['secret_found_' + room.id]) {
        G.state.flags['secret_found_' + room.id] = 1;
        G.audio.sfx('secret', { vol: 0.7 });
      }
    }
  }

  function resolveCombat() {
    const pl = g.player;
    const boxes = pl.boxes;
    const projs = [];
    for (const e of g.ents) if (e instanceof G.PlayerProj && !e.dead) projs.push(e);
    for (const e of g.ents) {
      if (e.dead) continue;
      if (e instanceof G.Enemy) {
        if (!e.active) continue;
        const hb = e.hurtbox();
        for (const b of boxes) {
          if (overlap(b, hb)) {
            const ok = e.takeHit(Object.assign({ x: U.clamp(hb.x + hb.w / 2, b.x, b.x + b.w), y: b.y + b.h / 2 }, b), g);
            if (ok && b.dive) {
              pl.vy = -5;
              pl.diveT = 0;
              pl.flipT = 18;
            }
          }
        }
        for (const p of projs) {
          if (p.dead) continue;
          if (overlap(p, hb) && e.takeHit(p.box(), g)) {
            p.onHitEnemy(e, g);
            if (p.slow) e.vx *= 0.5;
          }
        }
      } else if (e.hit && !e.dead) {
        // candles and other breakables
        for (const b of boxes) if (overlap(b, e)) e.hit(g);
        for (const p of projs) if (!p.dead && overlap(p, e)) e.hit(g);
      }
    }
    for (const b of boxes) breakTilesIn(b);
    for (const p of projs) if (!p.dead && p.subKind && p.subKind !== 'grimoire') breakTilesIn(p);
  }

  // ---- bosses --------------------------------------------------------------------------------------
  g.startBoss = function (boss) {
    if (g.boss === boss) return;
    g.boss = boss;
    boss.active = true;
    // close the exits
    const room = g.room;
    g.shutters = [];
    for (const d of room.def._doors || []) {
      if (d.side === 'L' || d.side === 'R') {
        const tx = d.side === 'L' ? 0 : room.tw - 1;
        for (let ty = d.cell * G.CELL_H; ty < (d.cell + 1) * G.CELL_H; ty++) {
          if (room.get(tx, ty) === T.EMPTY) {
            g.shutters.push([tx, ty, room.get(tx, ty)]);
            room.set(tx, ty, T.SOLID);
          }
        }
      } else {
        const ty = d.side === 'T' ? 0 : room.th - 1;
        for (let tx = d.cell * G.CELL_W; tx < (d.cell + 1) * G.CELL_W; tx++) {
          const t = room.get(tx, ty);
          if (t === T.EMPTY || t === T.ONEWAY) {
            g.shutters.push([tx, ty, t]);
            room.set(tx, ty, T.SOLID);
          }
        }
      }
    }
    G.redrawTiles(room);
    G.audio.sfx('door');
    G.audio.playMusic(boss.def.music || 'boss', { fade: 0.4 });
  };
  g.endBoss = function (boss) {
    const room = g.room;
    G.state.flags['boss_' + boss.def.id] = 1;
    g.later(90, () => {
      for (const [tx, ty, t] of g.shutters || []) room.set(tx, ty, t);
      g.shutters = [];
      G.redrawTiles(room);

    for (const e of sorted) if (e.z < 3) e.draw(ctx, cx, cy);
    g.player.draw(ctx, cx, cy);

    if (room.def.weather === 'rain') drawRain(ctx, cx, cy);

      ctx.fillStyle = 'rgba(120,130,255,0.12)';

    const p = g.player;
